name: Editorial Draft Harvester

on:
  schedule:
    - cron: '0 6 * * 1' # Runs weekly on Monday at 6:00 AM UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Top up Staging Queue (up to 40 drafts)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run harvest

      - name: Commit Staged Drafts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add staging/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(staging): harvest and top up editorial queue" && git pull --rebase origin main && git push origin main)
