name: Monthly Topic Queue & Review

on:
  schedule:
    # Runs at 00:00 UTC on the 1st of every month
    - cron: '0 0 1 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab anytime

permissions:
  contents: write

jobs:
  generate-queue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Upcoming 30-Day Topic Queue
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node scripts/generate-monthly-queue.mjs

      - name: Commit and Push Updated Queue
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add content/upcoming-queue.json content/upcoming-review-email.html
          git commit -m "chore: generate upcoming 30-day topic queue and review digest [skip ci]" || echo "No changes to commit"
          git push origin main
