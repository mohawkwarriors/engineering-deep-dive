name: Daily Engineering Deep Dive

on:
  schedule:
    # 4:00 AM PST (UTC-8) is 12:00 UTC (runs at 5:00 AM PDT during Daylight Saving Time)
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-daily-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Generate Daily Deep Dive Dispatch
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-dispatch.mjs

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html content/
          git diff --staged --quiet || (git commit -m "Auto-publish daily deep dive dispatch [skip ci]" && git push origin main)
