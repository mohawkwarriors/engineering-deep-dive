<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Engineering Deep Dive — Archive</title>
  <!-- Diameter Symbol Favicon (Data URI) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23D97757%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><circle cx=%2212%22 cy=%2212%22 r=%228%22/><line x1=%225.5%22 y1=%2218.5%22 x2=%2218.5%22 y2=%225.5%22/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F9F8F6;
      --surface: #EFECE6;
      --surface-hover: #E4E0D8;
      --text: #191918;
      --muted: #6B6960;
      --border: #D8D4CC;
      --accent: #D97757;
      --accent-hover: #C56645;
      --max-w: 1080px;

      /* Subject Tag Colors (Light Mode) */
      --sub-product-dives: #D97757;
      --sub-manufacturing: #2563EB;
      --sub-design: #7C3AED;
      --sub-materials: #059669;
      --sub-mechanisms: #D97706;
      --sub-thermal: #E11D48;
      --sub-fluids: #0891B2;
      --sub-electromechanical: #4F46E5;
    }
    [data-theme="dark"] {
      --bg: #191918;
      --surface: #232220;
      --surface-hover: #2E2D2A;
      --text: #EDEDEB;
      --muted: #9E9C94;
      --border: #383734;
      --accent: #D97757;
      --accent-hover: #E88868;

      /* Subject Tag Colors (Dark Mode) */
      --sub-product-dives: #E88868;
      --sub-manufacturing: #3B82F6;
      --sub-design: #8B5CF6;
      --sub-materials: #10B981;
      --sub-mechanisms: #F59E0B;
      --sub-thermal: #F43F5E;
      --sub-fluids: #06B6D4;
      --sub-electromechanical: #6366F1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.74;
      font-size: 16.5px;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    .layout-wrapper { max-width: var(--max-w); margin: 0 auto; padding: 0 24px 104px; }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 28px 0; border-bottom: 1px solid var(--border); margin-bottom: 44px;
    }
    .brand-group {
      display: flex; align-items: center; gap: 12px; text-decoration: none; cursor: pointer;
    }
    .brand-logo {
      width: 34px; height: 34px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 6px; display: flex; align-items: center; justify-content: center;
      color: var(--accent); transition: border-color 0.15s; font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 600;
    }
    .brand-group:hover .brand-logo { border-color: var(--accent); }
    .brand {
      font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500;
      letter-spacing: 0.06em; text-transform: uppercase; color: var(--text); text-decoration: none;
    }
    .nav-actions { display: flex; gap: 20px; align-items: center; }
    .nav-btn {
      background: none; border: none; font-family: 'JetBrains Mono', monospace;
      font-size: 12px; color: var(--muted); cursor: pointer; padding: 4px 0; transition: color 0.15s;
    }
    .nav-btn:hover, .nav-btn.active { color: var(--text); font-weight: 600; }
    .theme-toggle-btn {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      width: 34px; height: 34px; border-radius: 6px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background 0.15s, border-color 0.15s;
    }
    .theme-toggle-btn:hover { background: var(--surface-hover); border-color: var(--muted); }
    .theme-toggle-btn svg { width: 16px; height: 16px; fill: currentColor; }

    .content-grid { display: grid; grid-template-columns: 240px 1fr; gap: 56px; align-items: start; }
    @media (max-width: 1023px) {
      .content-grid { grid-template-columns: 1fr !important; }
      .sidebar-outline { display: none !important; }
    }

    .sidebar-outline {
      position: sticky; top: 36px; max-height: calc(100vh - 72px); overflow-y: auto; padding-right: 16px; border-right: 1px solid var(--border);
    }
    .outline-title { font-family: 'JetBrains Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 16px; font-weight: 500; }
    .outline-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .outline-item a { font-size: 13.5px; color: var(--muted); text-decoration: none; display: block; line-height: 1.4; transition: color 0.15s; border-left: 2px solid transparent; padding-left: 10px; }
    .outline-item a:hover { color: var(--text); }
    .outline-item a.active { color: var(--accent); border-left-color: var(--accent); font-weight: 500; }
    .outline-item.sub-item a { padding-left: 22px; font-size: 12.5px; }

    .editorial-column { max-width: 740px; width: 100%; }
    .archive-column { max-width: 100%; width: 100%; grid-column: 1 / -1; }

    .subjects-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 36px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
    .subject-pill {
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
      font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 6px 12px; border-radius: 4px; cursor: pointer; transition: all 0.15s ease;
    }
    .subject-pill:hover { opacity: 0.85; transform: translateY(-1px); }
    .subject-pill.active {
      box-shadow: 0 0 0 1px var(--text);
    }

    /* Filter Button Colors */
    .btn-sub-all { background: var(--surface); color: var(--text); border-color: var(--border); }
    .btn-sub-all.active { background: var(--text); color: var(--bg); border-color: var(--text); }

    .btn-sub-product-dives { background: rgba(217, 119, 87, 0.1); color: var(--sub-product-dives); border-color: rgba(217, 119, 87, 0.35); }
    .btn-sub-product-dives.active { background: var(--sub-product-dives); color: #FFF; border-color: var(--sub-product-dives); }

    .btn-sub-manufacturing { background: rgba(37, 99, 235, 0.1); color: var(--sub-manufacturing); border-color: rgba(37, 99, 235, 0.35); }
    .btn-sub-manufacturing.active { background: var(--sub-manufacturing); color: #FFF; border-color: var(--sub-manufacturing); }

    .btn-sub-design { background: rgba(124, 58, 237, 0.1); color: var(--sub-design); border-color: rgba(124, 58, 237, 0.35); }
    .btn-sub-design.active { background: var(--sub-design); color: #FFF; border-color: var(--sub-design); }

    .btn-sub-materials { background: rgba(5, 150, 105, 0.1); color: var(--sub-materials); border-color: rgba(5, 150, 105, 0.35); }
    .btn-sub-materials.active { background: var(--sub-materials); color: #FFF; border-color: var(--sub-materials); }

    .btn-sub-mechanisms { background: rgba(217, 119, 6, 0.1); color: var(--sub-mechanisms); border-color: rgba(217, 119, 6, 0.35); }
    .btn-sub-mechanisms.active { background: var(--sub-mechanisms); color: #FFF; border-color: var(--sub-mechanisms); }

    .btn-sub-thermal { background: rgba(225, 29, 72, 0.1); color: var(--sub-thermal); border-color: rgba(225, 29, 72, 0.35); }
    .btn-sub-thermal.active { background: var(--sub-thermal); color: #FFF; border-color: var(--sub-thermal); }

    .btn-sub-fluids { background: rgba(8, 145, 178, 0.1); color: var(--sub-fluids); border-color: rgba(8, 145, 178, 0.35); }
    .btn-sub-fluids.active { background: var(--sub-fluids); color: #FFF; border-color: var(--sub-fluids); }

    .btn-sub-electromechanical { background: rgba(79, 70, 229, 0.1); color: var(--sub-electromechanical); border-color: rgba(79, 70, 229, 0.35); }
    .btn-sub-electromechanical.active { background: var(--sub-electromechanical); color: #FFF; border-color: var(--sub-electromechanical); }

    .meta-line { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    h1 { font-family: 'Instrument Serif', Georgia, serif; font-size: 46px; font-weight: 400; line-height: 1.12; letter-spacing: -0.01em; margin-bottom: 18px; }
    .subtitle { font-size: 18.5px; color: var(--muted); line-height: 1.55; margin-bottom: 36px; font-weight: 400; }
    h2 { font-family: 'Instrument Serif', Georgia, serif; font-size: 32px; font-weight: 400; margin: 52px 0 16px; line-height: 1.2; border-top: 1px solid var(--border); padding-top: 32px; scroll-margin-top: 40px; }
    h3 { font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 600; margin: 32px 0 10px; letter-spacing: -0.01em; display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; scroll-margin-top: 40px; }
    .price-tag { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--accent); font-weight: 500; background: var(--surface); padding: 3px 8px; border-radius: 4px; border: 1px solid var(--border); }
    p { margin-bottom: 20px; }
    ul { margin: 0 0 24px 22px; }
    li { margin-bottom: 12px; }
    strong { font-weight: 600; }

    /* Interactive Deep-Dive Tangent Triggers */
    .tangent-term {
      border-bottom: 1.5px dotted var(--accent);
      color: var(--text);
      cursor: pointer;
      font-weight: 500;
      position: relative;
      transition: background-color 0.15s, color 0.15s;
      padding: 1px 2px;
      border-radius: 3px;
    }
    .tangent-term:hover {
      background-color: var(--surface);
      color: var(--accent);
    }

    /* Modal / Pop-up Dialog for Mini Deep Dives */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(3px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      max-width: 540px;
      width: 100%;
      padding: 24px 28px;
      position: relative;
      transform: translateY(12px);
      transition: transform 0.2s ease;
    }
    .modal-overlay.active .modal-card {
      transform: translateY(0);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .modal-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent);
      font-weight: 600;
    }
    .modal-close-btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 18px;
      padding: 4px;
      line-height: 1;
      transition: color 0.15s;
    }
    .modal-close-btn:hover { color: var(--text); }
    .modal-title {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 26px;
      font-weight: 400;
      margin-bottom: 12px;
      line-height: 1.25;
    }
    .modal-body {
      font-size: 15px;
      line-height: 1.65;
      color: var(--text);
    }
    .modal-equation-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 16px;
      margin: 16px 0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13.5px;
      color: var(--text);
    }

    .callout-box { background: var(--surface); border-left: 3px solid var(--accent); padding: 18px 22px; margin: 28px 0; font-size: 15.5px; border-radius: 0 6px 6px 0; }
    .callout-title { font-family: 'JetBrains Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); margin-bottom: 6px; font-weight: 500; }

    figure.product-figure { margin: 38px 0; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; background: var(--surface); }
    .img-wrapper { position: relative; width: 100%; aspect-ratio: 16 / 10; overflow: hidden; background: #141413; }
    .img-wrapper img { width: 100%; height: 100%; object-fit: cover; display: block; }
    figcaption { padding: 14px 18px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); line-height: 1.5; display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
    .source-tag { white-space: nowrap; font-size: 11px; opacity: 0.85; }

    .spec-table-wrap { overflow-x: auto; margin: 28px 0 36px; border: 1px solid var(--border); border-radius: 6px; }
    .spec-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .spec-table th, .spec-table td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
    .spec-table tr:last-child td { border-bottom: none; }
    .spec-table th { font-family: 'JetBrains Mono', monospace; font-size: 11px; text-transform: uppercase; color: var(--muted); font-weight: 500; background: var(--surface); }

    .telemetry-bar { display: flex; justify-content: space-between; align-items: center; background: var(--surface); border: 1px solid var(--border); padding: 16px 20px; border-radius: 6px; margin: 48px 0 24px; font-size: 13.5px; flex-wrap: wrap; gap: 12px; }
    .telemetry-info { display: flex; flex-direction: column; gap: 2px; }
    .telemetry-title { font-weight: 600; font-family: 'JetBrains Mono', monospace; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
    .telemetry-desc { color: var(--muted); font-size: 13px; }
    .telemetry-actions { display: flex; gap: 10px; }
    .score-btn { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 6px 14px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.15s ease; }
    .score-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--surface); }
    .score-btn.active-up { background: #E1F5FE; border-color: #0288D1; color: #01579B; }
    .score-btn.active-down { background: #FFEBEE; border-color: #C62828; color: #B71C1C; }

    /* Previous Issue Navigation Bar */
    .issue-nav-bar {
      margin-top: 48px;
      padding-top: 28px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    .prev-issue-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      transition: all 0.15s ease;
      font-weight: 500;
    }
    .prev-issue-btn:hover {
      background: var(--surface-hover);
      border-color: var(--accent);
      color: var(--accent);
      transform: translateX(-2px);
    }

    /* Archive Items - Clean, No Viz Text */
    #archive-list { display: flex; flex-direction: column; gap: 0px; }
    .archive-item {
      padding: 24px 0; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; cursor: pointer;
    }
    .archive-item:hover .archive-title { color: var(--accent); }
    .archive-main { display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .archive-title { font-weight: 500; font-size: 17px; line-height: 1.4; transition: color 0.15s; }
    .archive-details { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-family: 'JetBrains Mono', monospace; font-size: 12px; }
    .archive-subject-tag { font-weight: 500; padding: 3px 9px; border-radius: 4px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
    .archive-right { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted); white-space: nowrap; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; padding-top: 2px; }

    /* Distinct Subject Tag Colors */
    .tag-product-dives { background: rgba(217, 119, 87, 0.12); color: var(--sub-product-dives); border: 1px solid rgba(217, 119, 87, 0.25); }
    .tag-manufacturing { background: rgba(37, 99, 235, 0.12); color: var(--sub-manufacturing); border: 1px solid rgba(37, 99, 235, 0.25); }
    .tag-design { background: rgba(124, 58, 237, 0.12); color: var(--sub-design); border: 1px solid rgba(124, 58, 237, 0.25); }
    .tag-materials { background: rgba(5, 150, 105, 0.12); color: var(--sub-materials); border: 1px solid rgba(5, 150, 105, 0.25); }
    .tag-mechanisms { background: rgba(217, 119, 6, 0.12); color: var(--sub-mechanisms); border: 1px solid rgba(217, 119, 6, 0.25); }
    .tag-thermal { background: rgba(225, 29, 72, 0.12); color: var(--sub-thermal); border: 1px solid rgba(225, 29, 72, 0.25); }
    .tag-fluids { background: rgba(8, 145, 178, 0.12); color: var(--sub-fluids); border: 1px solid rgba(8, 145, 178, 0.25); }
    .tag-electromechanical { background: rgba(79, 70, 229, 0.12); color: var(--sub-electromechanical); border: 1px solid rgba(79, 70, 229, 0.25); }

    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="layout-wrapper">
    <header>
      <a class="brand-group" onclick="loadArticle('#001')">
        <div class="brand-logo">⌀</div>
        <span class="brand">Engineering Deep Dive</span>
      </a>
      <div class="nav-actions">
        <button class="nav-btn" id="btn-archive" onclick="showView('archive')">Archive</button>
        <button class="theme-toggle-btn" onclick="toggleTheme()" id="theme-btn" title="Toggle Theme">
          <svg id="moon-icon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          <svg id="sun-icon" style="display:none;" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        </button>
      </div>
    </header>

    <div class="content-grid" id="content-grid">
      <aside class="sidebar-outline" id="sidebar-outline">
        <div class="outline-title" id="outline-title-text">On This Page</div>
        <ul class="outline-list" id="outline-list"></ul>
      </aside>

      <main class="editorial-column" id="main-container">
        <!-- Dynamic Article Container -->
        <article id="view-article"></article>

        <!-- Dynamic Archive Container -->
        <section id="view-archive" class="hidden">
          <h1>Archive</h1>
          <p class="subtitle" style="margin-bottom: 28px;">Explore published dispatches across all 8 core engineering disciplines.</p>
          <div class="subjects-bar" id="subjects-bar"></div>
          <div id="archive-list"></div>
        </section>
      </main>
    </div>
  </div>

  <!-- Interactive Pop-up Modal for Mini Deep Dives -->
  <div class="modal-overlay" id="tangent-modal" onclick="closeModalOnBackdrop(event)">
    <div class="modal-card">
      <div class="modal-header">
        <span class="modal-tag" id="modal-tag">MINI DEEP DIVE</span>
        <button class="modal-close-btn" onclick="closeModal()">✕</button>
      </div>
      <h3 class="modal-title" id="modal-title">Engineering Concept</h3>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script>
    const SUBJECTS = ["All", "Product Dives", "Manufacturing", "Design", "Materials", "Mechanisms", "Thermal", "Fluids", "Electromechanical"];
    
    const TOPICS = [
      { id: "#001", subject: "Product Dives", title: "Inside the Apple HomeView & Apple Home Collection: The Complete Hardware Breakdown", status: "Published", date: "Oct 14, 2026" },
      { id: "#000", subject: "Electromechanical", title: "Apple Vision Pro Actuators: Interpupillary Voice Coil Motors and Custom Encoders", status: "Published", date: "Oct 13, 2026" }
    ];

    // Mini Deep Dive Tangent Database
    const TANGENTS = {
      convection: {
        tag: "THERMAL PHYSICS // CONDUCTION & CONVECTION",
        title: "Passive Natural Convection in Compute Displays",
        body: `
          <p>Smart displays on nightstands cannot use active cooling fans due to acoustic noise, dust accumulation, and motor wear over a 10-year lifespan. Dissipating heat from the 3nm A18 silicon die package requires a continuous thermal conduction chain into the rear housing.</p>
          <div class="modal-equation-box">
            Conduction: q = -k · A · (dT/dx)<br>
            Natural Convection: q_conv = h · A · (T_surface - T_ambient)
          </div>
          <p>Thermal energy moves from the silicon die package through a high-conductivity phase-change thermal interface material (TIM) into anisotropic pyrolytic graphite sheets. These graphite spreaders disperse the concentrated heat flux horizontally across an internal structural aluminum chassis extrusion, keeping peak rear-enclosure skin temperatures safely under 38°C during full-screen video playback and local neural network execution.</p>
        `
      },
      uwb: {
        tag: "RF PHYSICS // SPATIAL RANGING",
        title: "Ultra-Wideband (UWB) Time-of-Flight vs. BLE RSSI",
        body: `

          <h2 id="section-ipd-problem">1. The Biomechanical Imperative: Human Anatomical Variance & Why Manual IPD Fails</h2>
          <p>
            In high-resolution spatial computing, optical alignment is not merely an ergonomic comfort consideration; it is the fundamental physics gating factor for stereoscopic image fusion, binocular depth perception, and visual acuity. The human interpupillary distance (IPD)—the transverse Euclidean distance between the optical centers of the pupils—ranges from 51 mm to 75 mm across 99% of the global adult population, with a global mean of 63 mm.
          </p>
          <p>
            Conventional consumer VR headsets (such as the Meta Quest 2 and early HTC Vive headsets) attempted to address this biometric dispersion using coarse manual sliders or discrete three-position detent ratchets. However, user studies consistently demonstrate that over 70% of non-technical consumers set their manual IPD incorrectly by an average error of 2.5 mm to 4.0 mm. In low-resolution displays, this error causes mild blur; but in a display system boasting 23 million pixels across two postage-stamp-sized Sony 4K micro-OLED panels, a 2 mm misalignment introduces catastrophic visual artifacts:
          </p>
          <ul>
            <li><strong>Catadioptric Pancake MTF Collapse:</strong> Folded pancake optics achieve extraordinary flatness and compactness by polarizing, reflecting, and semi-transmitting light multiple times between spherical glass surfaces. However, this catadioptric beam path creates an ultra-tight "optical eyebox" measuring only 4.0 mm in diameter. Translating the human pupil just 1.5 mm off the primary <span class="tangent-term" onclick="openTangent('ipd_alignment')">interpupillary optical axis</span> causes the Modulation Transfer Function (MTF) to drop by over 45%, introducing severe astigmatic blur, chromatic fringing, and geometric coma aberrations.</li>
            <li><strong>Vergence-Accommodation Conflict & Vestibular Mismatch:</strong> In the natural physical world, visual accommodation (the focal power of the crystalline lens inside the eyeball) and visual vergence (the inward or outward rotation of both eyeballs to triangulate a target) are mechanically coupled in the brainstem. In spatial headsets, the micro-OLED virtual image plane is held at a fixed optical focal distance of approximately 1.3 meters. If physical display centers fail to match the user's interpupillary vector, the user's brain is forced to artificially diverge or converge its optical axes against the physical focal cues, rapidly inducing nausea, visual fatigue, and debilitating vestibular disorientation.</li>
          </ul>
          <p>
            To eliminate this entire error class, Apple eliminated manual mechanical dials, ratchets, and sliders entirely. Instead, Vision Pro incorporates a fully automated, closed-loop electromechanical drivetrain that detects eye positions and translates the dual lens pods into optical alignment within ±0.05 mm during initial calibration.
          </p>

          <h2 id="section-actuator-selection">2. Actuator Selection: Voice Coil Motors vs. Stepper Lead Screws</h2>
          <p>
            When engineering an automated optical positioning mechanism inside a wearable headset, the mechanical design constraints are extraordinarily punishing:
          </p>
          <ul>
            <li><strong>Spatial Volumetric Packaging:</strong> The mechanism must fit inside a tightly contoured, organic 3D magnesium chassis curved to match human facial anthropology, leaving zero clearance for bulky motor housings.</li>
            <li><strong>Acoustic and Bone-Conduction Silence:</strong> The headset sits directly against the facial bones of the zygomatic arch and temples. Any mechanical gear whine, tooth backlash, or stepper resonance will conduct directly through the user's cranium, sounding like a dentist's drill.</li>
            <li><strong>Mass and Center of Gravity (CoG):</strong> The complete headset already approaches 600 to 650 grams. Moving mass must be kept under 30 grams per optical pod to avoid shifting the headset's forward center of gravity and worsening neck strain.</li>
          </ul>
          <p>
            Miniature stepper motors paired with lead screws—the standard industrial approach in camera zoom stages—were systematically evaluated and rejected. Lead screw nuts suffer from mechanical backlash, require periodic lubrication that can outgas and fog sealed optical surfaces, generate high-frequency micro-stepping acoustic chatter, and exhibit slow settling times.
          </p>
          <p>
            Instead, Apple engineered custom miniature dual-gap <span class="tangent-term" onclick="openTangent('lorentz_vcm')">voice coil motors (VCMs)</span> mounted directly to the optical carriages and suspended on planar beryllium-copper <span class="tangent-term" onclick="openTangent('flexure_suspension')">flexure spring suspensions</span>.
          </p>
          <p>
            Unlike rotary motors that convert rotary torque to linear motion via friction-laden mechanical interfaces, a voice coil motor generates direct linear force via the Lorentz force interaction between a stationary NdFeB permanent magnet array and an energized copper voice coil. By regulating current through a high-frequency PWM H-bridge driver, the VCM produces completely smooth, frictionless linear translation. It operates in absolute acoustic silence, exhibits zero mechanical backlash, and achieves full-stroke position settling in under 120 milliseconds.
          </p>

          <h2 id="section-optical-encoders">3. Closed-Loop Metrology: Sub-Micron Optical Linear Encoders</h2>
          <p>
            Voice coil motors possess zero holding detent torque: the moment current is removed from the coil, the carriage is free to drift under gravity or head acceleration. Consequently, the mechanism requires an ultra-precise, real-time closed-loop positional feedback system.
          </p>
          <p>
            Traditional rotary encoders were unusable because there is no rotating shaft. Hall-effect magnetic linear sensors were evaluated, but the intense magnetic fields generated by the headset's integrated spatial audio speakers, magnetic head-strap connectors, and external power cords introduced unacceptable sensor noise and offset drift.
          </p>
          <p>
            Apple solved this by developing custom reflective <span class="tangent-term" onclick="openTangent('linear_encoder')">optical linear encoders</span> integrated directly along the structural magnesium guide rail:
          </p>
          <ul>
            <li><strong>Photolithographic Chrome-on-Glass Scale:</strong> A precision glass encoder scale etched with reflective chrome lines at a 20-micron pitch runs parallel to the transverse carriage guide shaft.</li>
            <li><strong>Differential Quadrature Laser Metrology:</strong> An infrared VCSEL laser diode illuminates the moving scale, reflecting optical diffraction fringes onto an application-specific integrated circuit (ASIC) photodiode array. The sensor outputs two 90°-phase-shifted sinusoidal signals (Channel A and Channel B).</li>
            <li><strong>256x Digital Sub-Division:</strong> The dedicated encoder ASIC digitizes and interpolates the analog quadrature sine waves down to 1/256th of a pitch period. This mathematical interpolation resolves linear displacement down to an astonishing <strong>0.078 microns (78 nanometers)</strong>.</li>
            <li><strong>Non-Volatile Hardware Position Locking:</strong> Once the optimal IPD is reached, the controller cuts high holding currents to preserve battery life, relying on a bi-stable micro-solenoid friction brake to lock the carriage rigidly in place. The encoder writes the physical coordinates to non-volatile flash memory, enabling instant, homing-free readiness the next time the device is powered on.</li>
          </ul>

          <h2 id="section-gaze-calibration">4. Eye-Tracking Sensor Fusion & Gaze Calibration Vectors</h2>
          <p>
            A high-precision motorized stage is useless without an equally precise sensing system to dictate its target coordinates. In Apple Vision Pro, the automated IPD calibration process is completely invisible to the user, occurring dynamically during the initial device onboarding sequence.
          </p>
          <p>
            Surrounding each pancake lens barrel is an annular ring of infrared vertical-cavity surface-emitting lasers (VCSELs) operating across both 850 nm and 940 nm wavelengths. These illuminators project an invisible structured array of glint reflections onto the user's curved cornea. High-speed infrared cameras positioned at the base of the lens barrels capture the corneal reflections and pupil boundary at 90 frames per second.
          </p>
          <p>
            Apple's computer vision pipeline runs these video streams through custom convolutional neural networks running locally on the R1 real-time coprocessor. By measuring the dynamic spatial vector between the pupil center and the multiple corneal glints across varying gaze angles, the R1 calculates the true 3D center of rotation of the eyeball in Cartesian coordinate space. It separates the optical visual axis (the line connecting the fovea to the pupil center) from the anatomical pupillary axis, computing the exact mathematical interpupillary separation. The system then commands the left and right VCM drivers independently, translating each optical pod until its optical axis aligns with the user's eyes within ±0.05 mm.
          </p>

    let activeArticleId = "#001";

    // Dynamic Read Time Calculation (~220 words per minute for technical teardowns)
    function calculateReadTime() {
      const articleEl = document.getElementById("view-article");
      if (!articleEl) return;
      const text = articleEl.innerText || articleEl.textContent || "";
      const words = text.match(/\S+/g) || [];
      const wordCount = words.length;
      const readMinutes = Math.max(1, Math.round(wordCount / 220));
      const badge = document.getElementById("read-time-badge");
      if (badge) badge.textContent = `${readMinutes} MIN READ`;

      }
    }

    function buildOutline() {
      const outlineList = document.getElementById("outline-list");
      const headings = document.querySelectorAll("#view-article h2, #view-article h3");
      let html = "";
      headings.forEach((h, index) => {
        if(!h.id) h.id = "heading-" + index;
        const isSub = h.tagName === "H3";
        html += `<li class="outline-item ${isSub ? 'sub-item' : ''}"><a href="#${h.id}" data-target="${h.id}">${h.textContent.replace(/\s*\$[\d.]+\s*$/, '')}</a></li>`;
      });
      outlineList.innerHTML = html;

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            document.querySelectorAll(".outline-list a").forEach(a => a.classList.remove("active"));
            const activeLink = document.querySelector(`.outline-list a[data-target="${entry.target.id}"]`);
            if (activeLink) activeLink.classList.add("active");
          }
        });
      }, { rootMargin: "-20% 0% -60% 0%" });

      headings.forEach(h => observer.observe(h));
    }

    renderSubjects();
    renderArchive();
