      <div class="nav-actions">
        <button class="nav-btn" id="btn-queue" style="display:none;" onclick="window.location.href='queue.html'">Queue</button>
        <button class="nav-btn" id="btn-current-issue" style="display:none;" onclick="loadLatestArticle()">Current Issue</button>
        <button class="nav-btn" id="btn-archive" onclick="toggleArchiveView()">Archive</button>
        <button class="theme-toggle-btn" onclick="toggleTheme()" id="theme-btn" title="Toggle Theme">
          <svg id="moon-icon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          <svg id="sun-icon" style="display:none;" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        </button>
      </div>
    </header>

    <div class="content-grid" id="content-grid">
      <!-- Desktop Left Sidebar (Only visible on Desktop in Article view) -->
      <aside class="sidebar-outline" id="sidebar-outline">
        <div class="sidebar-overview-header">OVERVIEW</div>
        <ul class="outline-list" id="outline-list"></ul>
      </aside>

      <main class="editorial-column" id="main-container">
        <!-- Article View -->
        <article id="view-article"></article>
        
        <!-- Bottom Article Scoring Bar -->
        <div class="article-footer-score" id="article-footer-score">
          <button class="score-bottom-btn" id="btn-score-mode" onclick="toggleScoreMode()" title="Toggle in-article scoring & review mode">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 9.5-9.5z"></path></svg>
            <span id="score-btn-label">Score Article</span>
          </button>
        </div>

        <!-- Bottom Article Navigation -->
        <nav class="issue-nav" id="issue-nav"></nav>

        <!-- Archive View (Redesigned Full-Width & Responsive) -->
        <section id="view-archive" class="hidden">
          <h1 class="archive-header-title">Archive</h1>
          <p class="archive-header-subtitle">Explore published dispatches across all 8 core engineering disciplines.</p>
          <div class="subjects-bar" id="subjects-bar"></div>
          <div id="archive-list"></div>
        </section>
      </main>
    </div>
  </div>

  <script>
    const SUBJECTS = ["All", "Product Dives", "Manufacturing", "Design", "Materials", "Mechanisms", "Thermal", "Fluids", "Electromechanical"];
    
    const TOPICS = [
      { id: "#006", subject: "Fluids", title: "Helical Heat Exchangers: Beating Boundary Layers with 300% Higher Heat Flux", shortTitle: "Helical Heat Exchangers", status: "Published", date: "Oct 19, 2026" },
      { id: "#005", subject: "Thermal", title: "How Vapor Chambers Flatten Die Hotspots", shortTitle: "How Vapor Chambers Flatten Die Hotspots", status: "Published", date: "Oct 19, 2026" },
      { id: "#004", subject: "Product Dives", title: "The Secret Geometry of Foldable Screens", shortTitle: "The Secret Geometry of Foldable Screens", status: "Published", date: "Oct 17, 2026" },
      { id: "#003", subject: "Manufacturing", title: "How Laptops Get Featherweight Metal Shells", shortTitle: "Featherweight Laptop Shells", status: "Published", date: "Oct 16, 2026" },
      { id: "#002", subject: "Thermal", title: "Espresso Machine Boilers: Thermoblocks vs. Dual-Boiler PID Systems", shortTitle: "Espresso Machine Boilers", status: "Published", date: "Oct 15, 2026" },
      { id: "#001", subject: "Product Dives", title: "Apple Home Hardware: HomeView Hub & The LG/Schneider Teardown", shortTitle: "Apple Home Hardware", status: "Published", date: "Oct 14, 2026" },
      { id: "#000", subject: "Mechanisms", title: "Surviving 100G Shock Loads in Cycloidal Drives", shortTitle: "Cycloidal Drives Shock Resistance", status: "Published", date: "Oct 13, 2026" }
    ];

    let TANGENTS = {};
    const articleCache = {};
    let activeArticleId = (typeof TOPICS !== "undefined" && TOPICS.length > 0) ? TOPICS[0].id : "#004";
    let activeSubject = "All";
    let telemetryScores = {};
    try {
      telemetryScores = JSON.parse(localStorage.getItem("deepdive_telemetry") || "{}");
    } catch (e) {}

    function renderMath(targetEl) {
      if (!targetEl) return;
      if (window.renderMathInElement) {
        try {
          window.renderMathInElement(targetEl, {
            delimiters: [
              { left: '$$', right: '$$', display: true },
              { left: '$', right: '$', display: false },
              { left: '\\(', right: '\\)', display: false },
              { left: '\\[', right: '\\]', display: true }
            ],
            ignoredClasses: ["price-tag", "katex-ignore", "schematic-card", "spec-table", "spec-table-wrap", "product-subnav-bar", "process-grid"],
            throwOnError: false
          });
        } catch (e) {
          console.error("KaTeX render error:", e);
        }
      } else {
        setTimeout(() => renderMath(targetEl), 100);
      }
    }

    async function loadArticle(id) {
      activeArticleId = id;
      const articleEl = document.getElementById("view-article");
      const currentTopic = TOPICS.find(t => t.id === id);
      if (currentTopic) {
        document.title = `${currentTopic.title} — The HW Insider`;
      }

      if (articleCache[id]) {
        renderArticleContent(articleCache[id]);
        return;
      }

      const num = id.replace('#', '');
      try {
        const res = await fetch(`content/issues/${num}.json`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        articleCache[id] = data;
        renderArticleContent(data);
      } catch (err) {
        console.error("Could not fetch issue chunk:", err);
        articleEl.innerHTML = `<div style="padding:48px 0; color:var(--muted); font-family:'JetBrains Mono',monospace;">Could not load dispatch ${id}.</div>`;
        showView("article");
      }
    }

    function formatTablePrices(container) {
      if (!container) return;
      container.querySelectorAll(".spec-table").forEach(table => {
        const ths = Array.from(table.querySelectorAll("th"));
        const priceColIndices = new Set();
        ths.forEach((th, idx) => {
          const txt = th.textContent.toLowerCase();
          if (txt.includes("price") || txt.includes("cost") || txt.includes("bom") || txt.includes("msrp")) {
            priceColIndices.add(idx);
          }
        });

        table.querySelectorAll("tbody tr").forEach(tr => {
          const tds = Array.from(tr.querySelectorAll("td"));
          tds.forEach((td, idx) => {
            const raw = td.textContent.trim();
            const isPriceCol = priceColIndices.has(idx);
            const looksLikePrice = /^(\$|&dollar;|USD)\s*[0-9]+(\.[0-9]{2})?(\s*(&ndash;|-|–|—|to)\s*(\$|&dollar;)?\s*[0-9]+(\.[0-9]{2})?)?(\s*(per|\/)\s*[a-zA-Z]+)?$/i.test(raw);
            
            if (isPriceCol || looksLikePrice) {
              td.classList.add("price-cell");
              if (!td.querySelector(".price-tag") && (raw.includes("$") || raw.includes("USD"))) {
                td.innerHTML = `<span class="price-tag">${td.innerHTML.trim()}</span>`;
              }
            }
          });
        });
      });
    }

    function initProcessWheels(container) {
      if (!container) return;
      const grids = Array.from(container.querySelectorAll('.process-grid'));
      grids.forEach((grid, gIdx) => {
        if (grid.dataset.wheelInitialized) return;
        const cards = Array.from(grid.querySelectorAll('.process-step-card'));
        if (cards.length < 2) return;

        grid.dataset.wheelInitialized = "true";
        const total = cards.length;
        const wheelId = `pw-${Date.now()}-${gIdx}`;
        const parentCard = grid.closest('.schematic-card');
        const cardId = parentCard ? parentCard.id : '';

        // Default variant mapping based on data-variant or card archetype
        let defaultVariant = grid.dataset.variant;
        if (!defaultVariant) {
          if (cardId.includes('thermal') || cardId.includes('conduction')) {
            defaultVariant = 'accordion';
          } else if (cardId.includes('thixo') || cardId.includes('workflow') || cardId.includes('matrix')) {
            defaultVariant = 'grid';
          } else if (cardId.includes('teardrop') || cardId.includes('kinematic') || cardId.includes('fold')) {
            defaultVariant = 'carousel';
          } else if (cardId.includes('spatial') || cardId.includes('fluidic') || cardId.includes('pipeline')) {
            defaultVariant = 'pipeline';
          } else {
            defaultVariant = 'stepper';
          }
        }

        let currentVariant = defaultVariant;
        let activeIdx = 0;

        const steps = cards.map((card, idx) => {
          const tagEl = card.querySelector('.process-step-tag');
          const titleEl = card.querySelector('.process-step-title');
          const visualEl = card.querySelector('.process-step-visual');
          const descEl = card.querySelector('.process-step-desc');
          const metricEl = card.querySelector('.process-step-metric');

          let tagText = tagEl ? tagEl.textContent.trim() : `STAGE 0${idx + 1}`;
          let shortLabel = tagText.replace(/^ST(AGE|EP)\s*\d+\s*:\s*/i, '').trim();
          if (!shortLabel || shortLabel.length > 16) {
            shortLabel = titleEl ? titleEl.textContent.trim().split(' ')[0] : `Step ${idx + 1}`;
          }

          return {
            tagHtml: tagEl ? tagEl.innerHTML : `STAGE 0${idx + 1}`,
            titleHtml: titleEl ? titleEl.innerHTML : '',
            visualHtml: visualEl ? visualEl.innerHTML : '',
            descHtml: descEl ? descEl.innerHTML : '',
            metricHtml: metricEl ? metricEl.innerHTML : '',
            shortLabel: shortLabel
          };
        });

        grid.classList.add('hidden-by-wheel');

        const viewer = document.createElement('div');
        viewer.className = 'process-wheel-viewer';
        viewer.id = wheelId;
        viewer.dataset.variant = currentVariant;
        viewer.setAttribute('tabindex', '0');
        viewer.setAttribute('role', 'region');
        viewer.setAttribute('aria-label', 'Interactive kinematic step viewer');

        const hasTopBar = (currentVariant !== 'grid' && currentVariant !== 'accordion');

        viewer.innerHTML = `
          ${hasTopBar ? `
          <div class="stepper-top-bar" id="top-bar-${wheelId}">
            <div class="stepper-left-group" id="top-left-${wheelId}"></div>
            <div class="stepper-right-group">
              <div class="stepper-nav-controls" id="nav-controls-${wheelId}">
                <span class="stepper-counter"><strong id="counter-curr-${wheelId}">01</strong> / 0${total}</span>
                <button type="button" class="stepper-nav-btn" id="prev-${wheelId}" title="Previous Stage" aria-label="Previous Stage">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
                </button>
                <button type="button" class="stepper-nav-btn" id="next-${wheelId}" title="Next Stage" aria-label="Next Stage">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
                </button>
              </div>
            </div>
          </div>
          ` : ''}
          <div class="stepper-body-container" id="body-${wheelId}"></div>
        `;

        grid.parentNode.insertBefore(viewer, grid);

        function updateTopBarLeft() {
          const topLeft = document.getElementById(`top-left-${wheelId}`);
          if (!topLeft) return;
          if (currentVariant === 'stepper') {
            let pillsContainer = topLeft.querySelector('.stepper-pills');
            if (pillsContainer) {
              const pills = pillsContainer.querySelectorAll('.stepper-pill');
              pills.forEach((p, idx) => {
                p.classList.toggle('active', idx === activeIdx);
              });
              const activePill = pills[activeIdx];
              if (activePill) {
                const targetLeft = activePill.offsetLeft - (pillsContainer.clientWidth / 2) + (activePill.offsetWidth / 2);
                pillsContainer.scrollTo({ left: Math.max(0, targetLeft), behavior: 'smooth' });
              }
            } else {
              topLeft.innerHTML = `
                <div class="stepper-pills" id="pills-${wheelId}">
                  ${steps.map((s, idx) => `
                    <button type="button" class="stepper-pill ${idx === activeIdx ? 'active' : ''}" data-idx="${idx}">
                      <span class="stepper-pill-num">0${idx + 1}</span>
                      <span class="stepper-pill-text">${s.shortLabel}</span>
                    </button>
                  `).join('')}
                </div>
              `;
              pillsContainer = topLeft.querySelector('.stepper-pills');
              const activePill = topLeft.querySelector('.stepper-pill.active');
              if (pillsContainer && activePill) {
                const targetLeft = activePill.offsetLeft - (pillsContainer.clientWidth / 2) + (activePill.offsetWidth / 2);
                pillsContainer.scrollTo({ left: Math.max(0, targetLeft), behavior: 'auto' });
              }
            }
          } else if (currentVariant === 'pipeline') {
            topLeft.innerHTML = `
              <span class="stepper-pill active" style="cursor:default;">
                <span class="stepper-pill-num">STAGE 0${activeIdx + 1}</span>
                <span class="stepper-pill-text">${steps[activeIdx].shortLabel}</span>
              </span>
            `;
          } else if (currentVariant === 'accordion') {
            topLeft.innerHTML = `
              <span class="stepper-pill" style="cursor:default; font-size:10.5px;">
                <span class="stepper-pill-num">${total}</span>
                <span class="stepper-pill-text">INSPECTION DRAWERS</span>
              </span>
            `;
          } else if (currentVariant === 'carousel') {
            topLeft.innerHTML = `
              <span class="stepper-pill active" style="cursor:default;">
                <span class="stepper-pill-num">FRAME 0${activeIdx + 1}</span>
                <span class="stepper-pill-text">${steps[activeIdx].shortLabel}</span>
              </span>
            `;
          } else if (currentVariant === 'grid') {
            topLeft.innerHTML = `
              <span class="stepper-pill" style="cursor:default; font-size:10.5px;">
                <span class="stepper-pill-num">${total}</span>
                <span class="stepper-pill-text">SPEC STAGES MATRIX</span>
              </span>
            `;
          }

          const navControls = document.getElementById(`nav-controls-${wheelId}`);
          if (navControls) {
            navControls.style.display = (currentVariant === 'grid') ? 'none' : 'inline-flex';
          }
        }

        function renderVariantBody(direction = 'init') {
          const bodyEl = document.getElementById(`body-${wheelId}`);
          if (!bodyEl) return;
          const s = steps[activeIdx];
          const dirClass = direction === 'next' ? 'slide-next' : direction === 'prev' ? 'slide-prev' : 'slide-init';

          if (currentVariant === 'stepper') {
            const viewport = bodyEl.querySelector('.stepper-stage-viewport');
            const visEl = document.getElementById(`vis-${wheelId}`);
            const tagEl = document.getElementById(`tag-${wheelId}`);
            const titleEl = document.getElementById(`title-${wheelId}`);
            const descEl = document.getElementById(`desc-${wheelId}`);
            const metricEl = document.getElementById(`metric-${wheelId}`);

            if (viewport && visEl && tagEl && titleEl && descEl && metricEl) {
              viewport.classList.remove('slide-next', 'slide-prev', 'slide-init');
              visEl.innerHTML = s.visualHtml;
              tagEl.innerHTML = s.tagHtml;
              titleEl.innerHTML = s.titleHtml;
              descEl.innerHTML = s.descHtml;
              if (s.metricHtml && s.metricHtml.trim()) {
                metricEl.innerHTML = s.metricHtml;
                metricEl.style.display = 'inline-flex';
              } else {
                metricEl.innerHTML = '';
                metricEl.style.display = 'none';
              }

                  <div class="pipeline-header-row">
                    <span class="pipeline-tag">${s.tagHtml}</span>
                    <span class="pipeline-counter">STAGE 0${activeIdx + 1} / 0${total}</span>

                  <h4 class="pipeline-title">${s.titleHtml}</h4>
                  <p class="pipeline-desc">${s.descHtml}</p>
                  <div class="pipeline-metric" style="${s.metricHtml && s.metricHtml.trim() ? '' : 'display:none;'}">${s.metricHtml}</div>
                </div>

          } else if (currentVariant === 'accordion') {
            bodyEl.innerHTML = `
              <div class="accordion-stack">
                ${steps.map((st, idx) => `
                  <div class="accordion-drawer ${idx === activeIdx ? 'open' : ''}" data-idx="${idx}">
                    <button type="button" class="accordion-header" data-idx="${idx}">
                      <div class="accordion-header-left">
                        <span class="accordion-num">0${idx + 1}</span>
                        <span class="accordion-tag">${st.shortLabel}</span>
                        <span class="accordion-title">${st.titleHtml}</span>
                      </div>
                      <div class="accordion-header-right">
                        ${st.metricHtml ? `<span class="accordion-mini-metric">${st.metricHtml}</span>` : ''}
                        <span class="accordion-chevron">
                          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
                        </span>
                      </div>
                    </button>

                      <div class="accordion-split">

                        <div class="accordion-body">
                          <p class="accordion-desc">${st.descHtml}</p>
                          ${st.metricHtml ? `<div class="accordion-metric-badge">${st.metricHtml}</div>` : ''}
                        </div>
                      </div>
                    </div>
                  </div>
                `).join('')}
              </div>
            `;
          } else if (currentVariant === 'carousel') {
            bodyEl.innerHTML = `
              <div class="filmstrip-viewport" id="filmstrip-${wheelId}">
                <div class="filmstrip-track">
                  ${steps.map((st, idx) => `
                    <div class="filmstrip-card ${idx === activeIdx ? 'active' : ''}" data-idx="${idx}">
                      <div class="filmstrip-card-header">
                        <span class="filmstrip-num">0${idx + 1}</span>
                        <span class="filmstrip-tag">${st.shortLabel}</span>
                      </div>
                      <div class="filmstrip-visual">
                        ${st.visualHtml}
                      </div>
                      <div class="filmstrip-card-title">${st.titleHtml}</div>
                      <p class="filmstrip-card-desc">${st.descHtml}</p>
                      ${st.metricHtml ? `<div class="filmstrip-card-metric">${st.metricHtml}</div>` : ''}
                    </div>
                  `).join('')}
                </div>
              </div>
            `;
          } else if (currentVariant === 'grid') {
            bodyEl.innerHTML = `
              <div class="matrix-grid">
                ${steps.map((st, idx) => `
                  <div class="matrix-card">
                    <div class="matrix-card-header">
                      <span class="matrix-tag">${st.tagHtml}</span>
                      <span class="matrix-num">0${idx + 1}</span>
                    </div>
                    <div class="matrix-card-title">${st.titleHtml}</div>
                    <div class="matrix-visual">
                      ${st.visualHtml}
                    </div>
                    <p class="matrix-desc">${st.descHtml}</p>
                    ${st.metricHtml ? `<div class="matrix-metric">${st.metricHtml}</div>` : ''}
                  </div>
                `).join('')}
              </div>
            `;
          }

          if (typeof renderMathInElement === 'function') {
            renderMathInElement(bodyEl, {
              delimiters: [
                { left: "$$", right: "$$", display: true },
                { left: "$", right: "$", display: false }
              ],
              throwOnError: false
            });
          }

          if (currentVariant === 'pipeline') {
            const railWrap = bodyEl.querySelector('.pipeline-rail-wrap');
            const activeStation = bodyEl.querySelector('.pipeline-station.active');
            if (railWrap && activeStation) {
              const targetLeft = activeStation.offsetLeft - (railWrap.clientWidth / 2) + (activeStation.offsetWidth / 2);
              railWrap.scrollTo({ left: Math.max(0, targetLeft), behavior: 'smooth' });
            }
          } else if (currentVariant === 'carousel') {
            const filmstripEl = bodyEl.querySelector('.filmstrip-viewport');
            const activeCard = bodyEl.querySelector('.filmstrip-card.active');
            if (filmstripEl && activeCard) {
              const targetLeft = activeCard.offsetLeft - (filmstripEl.clientWidth / 2) + (activeCard.offsetWidth / 2);
              filmstripEl.scrollTo({ left: Math.max(0, targetLeft), behavior: 'smooth' });
            }
            if (filmstripEl) {
              let filmScrollTimer = null;
              filmstripEl.addEventListener('scroll', () => {
                clearTimeout(filmScrollTimer);
                filmScrollTimer = setTimeout(() => {
                  const cards = Array.from(filmstripEl.querySelectorAll('.filmstrip-card'));
                  const viewportCenter = filmstripEl.scrollLeft + filmstripEl.clientWidth / 2;
                  let closestIdx = activeIdx;
                  let minDiff = Infinity;
                  cards.forEach((c) => {
                    const cIdx = parseInt(c.dataset.idx, 10);
                    const cardCenter = c.offsetLeft + c.offsetWidth / 2;
                    const diff = Math.abs(cardCenter - viewportCenter);
                    if (diff < minDiff) {
                      minDiff = diff;
                      closestIdx = cIdx;
                    }
                  });
                  if (closestIdx !== activeIdx) {
                    activeIdx = closestIdx;
                    const counterEl = document.getElementById(`counter-curr-${wheelId}`);
                    if (counterEl) {
                      counterEl.classList.add('changing');
                      setTimeout(() => {
                        counterEl.textContent = `0${activeIdx + 1}`;
                        counterEl.classList.remove('changing');
                      }, 100);
                    }
                    updateTopBarLeft();
                    cards.forEach(c => {
                      const cIdx = parseInt(c.dataset.idx, 10);
                      c.classList.toggle('active', cIdx === activeIdx);
                    });
                  }
                }, 80);
              }, { passive: true });
            }
          }
        }

        function updateView(idx, explicitDir) {
          prevIdx = activeIdx;
          const newIdx = (idx + total) % total;
          let direction = explicitDir;
          if (!direction) {
            if (activeIdx === total - 1 && newIdx === 0) {
              direction = 'next';
            } else if (activeIdx === 0 && newIdx === total - 1) {
              direction = 'prev';
            } else {
              direction = newIdx >= activeIdx ? 'next' : 'prev';
            }
          }
          activeIdx = newIdx;

          const counterCurr = document.getElementById(`counter-curr-${wheelId}`);
          if (counterCurr) {
            counterCurr.classList.add('changing');
            setTimeout(() => {
              counterCurr.textContent = `0${activeIdx + 1}`;
              counterCurr.classList.remove('changing');
            }, 100);
          }
          updateTopBarLeft();
          renderVariantBody(direction);
        }

        // Event delegation for clicks inside viewer
        viewer.addEventListener('click', (e) => {
          const pillBtn = e.target.closest('.stepper-pill');
          if (pillBtn && pillBtn.dataset.idx !== undefined) {
            const targetIdx = parseInt(pillBtn.dataset.idx, 10);
            updateView(targetIdx, targetIdx >= activeIdx ? 'next' : 'prev');
            return;
          }

          const stationEl = e.target.closest('.pipeline-station');
          if (stationEl && stationEl.dataset.idx !== undefined) {
            const targetIdx = parseInt(stationEl.dataset.idx, 10);
            updateView(targetIdx, targetIdx >= activeIdx ? 'next' : 'prev');
            return;
          }

          const drawerHeader = e.target.closest('.accordion-header');
          if (drawerHeader && drawerHeader.dataset.idx !== undefined) {
            const dIdx = parseInt(drawerHeader.dataset.idx, 10);
            const drawer = drawerHeader.closest('.accordion-drawer');
            if (drawer) {
              const isOpen = drawer.classList.contains('open');
              if (isOpen && activeIdx === dIdx) {
                drawer.classList.remove('open');
              } else {
                updateView(dIdx, dIdx >= activeIdx ? 'next' : 'prev');
                setTimeout(() => {
                  const updatedDrawer = viewer.querySelector(`.accordion-drawer[data-idx="${dIdx}"]`);
                  if (updatedDrawer) {
                    const rect = updatedDrawer.getBoundingClientRect();
                    if (rect.top < 60) {
                      window.scrollBy({ top: rect.top - 70, behavior: 'smooth' });
                    }
                  }
                }, 60);
              }
            }
            return;
          }

          const filmCard = e.target.closest('.filmstrip-card');
          if (filmCard && filmCard.dataset.idx !== undefined) {
            const targetIdx = parseInt(filmCard.dataset.idx, 10);
            updateView(targetIdx, targetIdx >= activeIdx ? 'next' : 'prev');
            return;
          }

          const prevBtn = e.target.closest(`#prev-${wheelId}`);
          if (prevBtn) {
            updateView(activeIdx - 1, 'prev');
            return;
          }

          const nextBtn = e.target.closest(`#next-${wheelId}`);
          if (nextBtn) {
            updateView(activeIdx + 1, 'next');
            return;
          }
        });

        viewer.addEventListener('keydown', (e) => {
          if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
            e.preventDefault();
            updateView(activeIdx + 1, 'next');
          } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
            e.preventDefault();
            updateView(activeIdx - 1, 'prev');
          }
        });

        // Enhanced swipe gesture handling for mobile & touchscreens
        let touchStartX = 0;
        let touchStartY = 0;
        let touchEndX = 0;
        let touchEndY = 0;
        let touchStartTime = 0;
        let isTouching = false;
        let isHorizontalSwipe = false;

        viewer.addEventListener('touchstart', (e) => {
          if (e.touches.length === 1) {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            touchEndX = touchStartX;
            touchEndY = touchStartY;
            touchStartTime = Date.now();
            isTouching = true;
            isHorizontalSwipe = false;
          }
        }, { passive: true });

        viewer.addEventListener('touchmove', (e) => {
          if (!isTouching || e.touches.length !== 1) return;
          touchEndX = e.touches[0].clientX;
          touchEndY = e.touches[0].clientY;
          const diffX = touchEndX - touchStartX;
          const diffY = touchEndY - touchStartY;

          // Determine gesture intent early
          if (!isHorizontalSwipe && Math.abs(diffX) > 8) {
            if (Math.abs(diffX) > Math.abs(diffY)) {
              isHorizontalSwipe = true;
            } else {
              isTouching = false; // User is scrolling vertically down page, do not hijack
              return;
            }
          }

          if (isHorizontalSwipe) {
            const activeCard = viewer.querySelector('.stepper-stage-viewport, .pipeline-stage-view');
            if (activeCard) {
              const clampedX = Math.max(-45, Math.min(45, diffX * 0.35));
              activeCard.style.transform = `translate3d(${clampedX}px, 0, 0)`;
              activeCard.style.transition = 'none';
            }
          }
        }, { passive: true });

        viewer.addEventListener('touchend', (e) => {
          if (!isTouching) return;
          isTouching = false;
          const deltaX = touchEndX - touchStartX;
          const deltaY = touchEndY - touchStartY;
          const duration = Date.now() - touchStartTime;

          const activeCard = viewer.querySelector('.stepper-stage-viewport, .pipeline-stage-view');
          if (activeCard) {
            activeCard.style.transform = '';
            activeCard.style.transition = '';
          }

          // Trigger swipe on quick flick (< 320ms and > 22px) or standard drag (> 28px)
          const isFlick = duration < 320 && Math.abs(deltaX) > 22 && Math.abs(deltaX) > Math.abs(deltaY);
          const isStandardSwipe = Math.abs(deltaX) > 28 && Math.abs(deltaX) > Math.abs(deltaY) * 1.1;

          if (isFlick || isStandardSwipe) {
            if (currentVariant === 'stepper' || currentVariant === 'pipeline') {
              if (deltaX < 0) {
                updateView(activeIdx + 1, 'next');
              } else {
                updateView(activeIdx - 1, 'prev');
              }
            }
          }
        }, { passive: true });

        // Initialize display
        updateTopBarLeft();
        renderVariantBody('init');
      });
    }

    function alignComparisonCards(container) {
      if (!container) return;
      const grids = container.querySelectorAll('.comparison-grid');
      grids.forEach(grid => {
        const cards = Array.from(grid.querySelectorAll('.comparison-card'));
        if (cards.length < 2) return;

        const tags = cards.map(c => c.querySelector('.comparison-card-tag')).filter(Boolean);
        const titles = cards.map(c => c.querySelector('.comparison-card-title')).filter(Boolean);
        const pills = cards.map(c => c.querySelector('.comparison-metric-pill')).filter(Boolean);
        const labels = cards.map(c => c.querySelector('.pill-label')).filter(Boolean);
        const values = cards.map(c => c.querySelector('.pill-value')).filter(Boolean);
        const consequences = cards.map(c => c.querySelector('.comparison-consequence')).filter(Boolean);

        [tags, titles, pills, labels, values, consequences].forEach(group => {
          group.forEach(el => el.style.minHeight = '');
        });

        const isMultiCol = grid.classList.contains('three-col') ? window.innerWidth > 840 : window.innerWidth > 680;
        if (!isMultiCol) return;

        const syncMaxHeight = (elements) => {
          if (elements.length < 2) return;
          const maxH = Math.max(...elements.map(el => el.getBoundingClientRect().height));
          if (maxH > 0) {
            elements.forEach(el => el.style.minHeight = Math.ceil(maxH) + 'px');
          }
        };

        syncMaxHeight(tags);
        syncMaxHeight(titles);
        syncMaxHeight(labels);
        syncMaxHeight(values);
        syncMaxHeight(pills);
        syncMaxHeight(consequences);
      });
    }

    function renderArticleContent(data) {
      const articleEl = document.getElementById("view-article");
      if (data.tangents) {
        TANGENTS = { ...TANGENTS, ...data.tangents };
      }

      let html = data.article_html || '';

      // Defensive Fallback 1: Ensure metadata header (meta-line, h1, subtitle) is present
      if (!html.includes('class="meta-line"') && data.title) {
        const subSlug = (data.subject || 'Hardware').toLowerCase().replace(/[^a-z0-9]+/g, '-');
        html = `
<div class="meta-line">
  <span>ISSUE ${data.id || ''}</span><span>•</span><span class="archive-subject-tag sub-${subSlug}">${(data.subject || '').toUpperCase()}</span><span>•</span><span id="read-time-badge">14 MIN READ</span>
</div>

<h1>${data.title}</h1>
<p class="subtitle">
  ${data.subtitle || ''}
</p>
` + html;
      }

      // Defensive Fallback 2: Ensure product-figure has .img-wrapper
      html = html.replace(/(<figure class="product-figure">\s*)(<img\b[^>]*>)/gi, (m, pre, img) => {
        return `${pre}<div class="img-wrapper">\n    ${img}\n  </div>`;
      });

      // Defensive Fallback 3: Ensure schematic-card wraps svg in .schematic-viewport
      html = html.replace(/(<div class="schematic-card"[^>]*>[\s\S]*?<\/div>\s*)(<svg\b[\s\S]*?<\/svg>)/gi, (m, header, svg) => {
        if (!m.includes('class="schematic-viewport"')) {
          return `${header}<div class="schematic-viewport">\n    ${svg}\n  </div>`;
        }
        return m;
      });

      // Defensive Fallback 3B: Ensure spec-table is wrapped in .spec-table-wrap instead of legacy .process-card
      html = html.replace(/<div class="process-card"[^>]*>\s*(<table class="spec-table")/gi, '<div class="spec-table-wrap">\n  $1');

      // Defensive Fallback 3C: Auto-heal any legacy or collided metric blocks
      html = html.replace(/<div class="telemetry-bar">([\s\S]*?)<\/div>/gi, (match, inner) => {
        if (inner.includes('telemetry-cell') || inner.includes('metric-cell') || (!inner.includes('telemetry-actions') && !inner.includes('telemetry-info'))) {
          const fixedInner = inner
            .replace(/\btelemetry-cell\b/g, 'metric-cell')
            .replace(/\btelemetry-label\b/g, 'metric-cell-label')
            .replace(/\btelemetry-val\b/g, 'metric-cell-val')
            .replace(/\btelemetry-sub\b/g, 'metric-cell-sub');
          return `<div class="executive-metrics-bar">\n${fixedInner.trim()}\n</div>`;
        }
        return match;
      });

      html = html.replace(/<div class="executive-metrics-bar">([\s\S]*?)<\/div>/gi, (match, inner) => {
        const fixedInner = inner
          .replace(/\btelemetry-cell\b/g, 'metric-cell')
          .replace(/\btelemetry-label\b/g, 'metric-cell-label')
          .replace(/\btelemetry-val\b/g, 'metric-cell-val')
          .replace(/\btelemetry-sub\b/g, 'metric-cell-sub');
        return `<div class="executive-metrics-bar">\n${fixedInner.trim()}\n</div>`;
      });

      // Remove legacy telemetry bars, good/bad topic voting buttons, and editorial drawer
      html = html.replace(/<div class="telemetry-bar">[\s\S]*?<\/div>\s*<\/div>/gi, '');
      html = html.replace(/<div class="telemetry-actions">[\s\S]*?<\/div>/gi, '');
      html = html.replace(/<div id="editorial-drawer"[^>]*>[\s\S]*?<\/div>/gi, '');

      articleEl.innerHTML = html;
      articleEl.querySelectorAll('.telemetry-bar, .telemetry-actions, .telemetry-info, #telemetry-up, #telemetry-down, .score-btn').forEach(el => el.remove());
      formatTablePrices(articleEl);
      initProcessWheels(articleEl);
      initMobileSchematicHints(articleEl);
      alignComparisonCards(articleEl);
      renderMath(articleEl);
      showView("article");
      buildOutline();
      renderIssueNav();
      injectScoreModeOverlays(articleEl);
      const btn = document.getElementById("btn-score-mode");
      const label = document.getElementById("score-btn-label");
      if (btn) btn.classList.toggle("active", isScoreModeActive);
      if (label) label.textContent = isScoreModeActive ? "Exit Scoring Mode" : "Score Article";
      attachTangentListeners();
    }

    function initMobileSchematicHints(container) {
      if (!container) return;
      container.querySelectorAll('.schematic-card').forEach(card => {
        const viewport = card.querySelector('.schematic-viewport');
        const header = card.querySelector('.schematic-header');
        if (!viewport || !header) return;
        if (header.querySelector('.schematic-scroll-hint')) return;

        const hint = document.createElement('span');
        hint.className = 'schematic-scroll-hint';
        hint.innerHTML = '&#8644; SWIPE DIAGRAM';
        header.appendChild(hint);

        viewport.addEventListener('scroll', () => {
          if (viewport.scrollLeft > 12) {
            hint.style.opacity = '0';
          }
        }, { passive: true });
      });
    }

    function renderIssueNav() {
      const navEl = document.getElementById("issue-nav");
      if (!navEl) return;
      const published = TOPICS.filter(t => t.status === "Published");
      const currentIndex = published.findIndex(t => t.id === activeArticleId);
      if (currentIndex === -1) {
        navEl.innerHTML = "";
        return;
      }
      
      const prevTopic = published[currentIndex + 1];
      const nextTopic = published[currentIndex - 1];

      const prevHtml = prevTopic ? `
        <button class="issue-nav-btn" onclick="loadArticle('${prevTopic.id}')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          <span><strong>Previous:</strong> ${prevTopic.shortTitle || prevTopic.title}</span>
        </button>
      ` : `<div class="issue-nav-btn disabled"><span>Beginning of Archive</span></div>`;

      const nextHtml = nextTopic ? `
        <button class="issue-nav-btn" onclick="loadArticle('${nextTopic.id}')">
          <span><strong>Next:</strong> ${nextTopic.shortTitle || nextTopic.title}</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      ` : `<div class="issue-nav-btn disabled"><span>Latest Dispatch</span></div>`;

      navEl.innerHTML = prevHtml + nextHtml;
    }

    let isScoreModeActive = false;

      isScoreModeActive = !isScoreModeActive;
      const btn = document.getElementById("btn-score-mode");
      const label = document.getElementById("score-btn-label");
      if (btn) btn.classList.toggle("active", isScoreModeActive);
      if (label) label.textContent = isScoreModeActive ? "Exit Scoring Mode" : "Score Article";

      document.body.classList.toggle("score-mode-active", isScoreModeActive);
      const articleEl = document.getElementById("view-article");

      if (isScoreModeActive) {
        articleEl.classList.add("score-mode-active");

        const topicToolbar = articleEl.querySelector(".score-toolbar-topic");
        if (topicToolbar) {
          topicToolbar.scrollIntoView({ behavior: "smooth", block: "center" });
        }
      } else {
        articleEl.classList.remove("score-mode-active");
      }

          <div class="score-toolbar-label">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>

    function buildOutline() {
      const isDesktop = window.innerWidth > 768;
      const list = document.getElementById("outline-list");
      if (list) list.innerHTML = "";

      if (activeScrollSpyHandler) {
        window.removeEventListener("scroll", activeScrollSpyHandler);
        activeScrollSpyHandler = null;
      }

      const articleEl = document.getElementById("view-article");
      if (!articleEl) return;

      // Remove any existing mobile outline drawer before rebuilding
      const existingMobileOutline = articleEl.querySelector(".mobile-outline-details");
      if (existingMobileOutline) existingMobileOutline.remove();

      // Select all h2 and h3 headings in reading order
      const allHeadings = articleEl.querySelectorAll("h2, h3");
      if (!allHeadings.length) return;

      const trackedHeadings = [];
      const h2Sections = [];
      let currentH2Li = null;
      let currentSubList = null;
      let h2Index = 0;
      let h3Index = 0;

      allHeadings.forEach(heading => {
        const isH2 = heading.tagName.toLowerCase() === "h2";
        if (!heading.id) {
          heading.id = isH2 ? `section-${h2Index}` : `subsection-${h3Index}`;
        }
        if (isH2) h2Index++;
        else h3Index++;
        trackedHeadings.push(heading);

        // Clean text: strip price tags, nested spans, or trailing prices for concise overview display
        let titleText = heading.cloneNode(true);
        titleText.querySelectorAll(".price-tag").forEach(p => p.remove());
        let cleanTitle = titleText.textContent.replace(/<[^>]+>/g, '').trim();

        if (isH2) {
          h2Sections.push({ id: heading.id, title: cleanTitle, num: String(h2Sections.length + 1).padStart(2, '0') });
          if (list) {
            currentH2Li = document.createElement("li");
            currentH2Li.className = "outline-item";
            currentH2Li.innerHTML = `<a class="outline-link" href="#${heading.id}" data-target="${heading.id}">${cleanTitle}</a>`;
            list.appendChild(currentH2Li);
            currentSubList = null; // reset sublist for new h2
          }
        } else if (list) {
          // If no preceding h2 was found, attach directly to list
          if (!currentH2Li) {
            currentH2Li = document.createElement("li");
            currentH2Li.className = "outline-item";
            list.appendChild(currentH2Li);
          }
          if (!currentSubList) {
            currentSubList = document.createElement("ul");
            currentSubList.className = "outline-sublist";
            currentH2Li.appendChild(currentSubList);
          }
          const subLi = document.createElement("li");
          subLi.className = "outline-subitem";
          subLi.innerHTML = `<a class="outline-sublink" href="#${heading.id}" data-target="${heading.id}">${cleanTitle}</a>`;
          currentSubList.appendChild(subLi);
        }
      });

      // Inject Mobile Collapsible Section Jump Bar when article does not already have a .product-subnav-bar
      if (!articleEl.querySelector(".product-subnav-bar") && h2Sections.length > 1) {
        const subtitleEl = articleEl.querySelector(".subtitle");
        if (subtitleEl) {
          const mobileDetails = document.createElement("details");
          mobileDetails.className = "mobile-outline-details";
          mobileDetails.innerHTML = `
            <summary class="mobile-outline-summary">
              <span>Jump to Section (${h2Sections.length})</span>
              <span class="mobile-outline-chevron">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
              </span>
            </summary>
            <ul class="mobile-outline-list">
              ${h2Sections.map(sec => `
                <li>
                  <a class="mobile-outline-link" href="#${sec.id}" data-target="${sec.id}">
                    <span class="mobile-outline-num">${sec.num}</span>
                    <span>${sec.title}</span>
                  </a>
                </li>
              `).join('')}
            </ul>
          `;
          subtitleEl.insertAdjacentElement("afterend", mobileDetails);

          mobileDetails.querySelectorAll(".mobile-outline-link").forEach(link => {
            link.addEventListener("click", (e) => {
              e.preventDefault();
              const targetId = link.getAttribute("data-target");
              const targetEl = document.getElementById(targetId);
              mobileDetails.removeAttribute("open");
              if (targetEl) {
                const offset = 24;
                const elementPosition = targetEl.getBoundingClientRect().top + window.pageYOffset;
                window.scrollTo({
                  top: elementPosition - offset,
                  behavior: "smooth"
                });
                history.replaceState(null, "", `${activeArticleId}/${targetId}`);
              }
            });
          });
        }
      }

      if (!isDesktop || !list) return;

      // Smooth scroll navigation with header offset compensation for both h2 and h3
      list.querySelectorAll(".outline-link, .outline-sublink").forEach(link => {
        link.addEventListener("click", (e) => {
          e.preventDefault();
          const targetId = link.getAttribute("data-target");
          const targetEl = document.getElementById(targetId);
          if (targetEl) {
            const offset = 48;
            const elementPosition = targetEl.getBoundingClientRect().top + window.pageYOffset;
            window.scrollTo({
              top: elementPosition - offset,
              behavior: "smooth"
            });
            history.replaceState(null, "", `${activeArticleId}/${targetId}`);
          }
        });
      });

      // ScrollSpy: Real-time active section tracking as the user scrolls
      activeScrollSpyHandler = () => {
        const scrollPos = window.scrollY + 120;
        const links = list.querySelectorAll(".outline-link, .outline-sublink");
        let activeId = trackedHeadings[0]?.id;

        trackedHeadings.forEach(h => {
          if (h.offsetTop <= scrollPos) {
            activeId = h.id;
          }
        });

        links.forEach(l => {
          if (l.getAttribute("data-target") === activeId) {
            l.classList.add("active");
          } else {
            l.classList.remove("active");
          }
        });
      };

      window.addEventListener("scroll", activeScrollSpyHandler, { passive: true });
      activeScrollSpyHandler();
    }

    let activePopoverTerm = null;
    let popoverHideTimer = null;
    let popoverOpenedAt = 0;

    function attachTangentListeners() {
      const popover = document.getElementById('floating-popover');
      
      // Allow user to move cursor onto popover without it vanishing immediately
      if (popover && !popover.dataset.hoverWired) {
        popover.dataset.hoverWired = "true";
        popover.addEventListener('mouseenter', () => {
          if (popoverHideTimer) {
            clearTimeout(popoverHideTimer);
            popoverHideTimer = null;
          }
        });
        popover.addEventListener('mouseleave', () => {
          popoverHideTimer = setTimeout(() => {
            hidePopover(true);
          }, 150);
        });
      }

      document.querySelectorAll(".tangent-term").forEach(el => {
        el.addEventListener("mouseenter", () => {
          if (popoverHideTimer) {
            clearTimeout(popoverHideTimer);
            popoverHideTimer = null;
          }
          activePopoverTerm = el;
          showPopover(el, el.getAttribute("data-tangent"));
        });

        el.addEventListener("mouseleave", () => {
          // Grace delay allowing user to bridge into popover if needed, otherwise dismiss
          popoverHideTimer = setTimeout(() => {
            hidePopover(true);
          }, 240);
        });

        el.addEventListener("click", (e) => {
          e.preventDefault();
          activePopoverTerm = el;
          showPopover(el, el.getAttribute("data-tangent"));
        });
      });
    }

    function showPopover(termElement, key) {
      const data = TANGENTS[key];
      if (!data) return;

      const popover = document.getElementById('floating-popover');
      if (!popover) return;

      popoverOpenedAt = Date.now();
      document.getElementById('popover-tag').textContent = data.tag;
      document.getElementById('popover-title').textContent = data.title;
      const bodyEl = document.getElementById('popover-body');
      bodyEl.innerHTML = data.body;
      renderMath(bodyEl);

      // Measure true rendered dimensions invisibly off-screen to prevent layout flashes
      popover.style.display = 'block';
      popover.style.visibility = 'hidden';
      popover.style.maxHeight = 'none';
      popover.style.top = '0px';
      popover.style.left = '0px';

      const rect = termElement.getBoundingClientRect();
      const popoverRect = popover.getBoundingClientRect();
      const popoverHeight = popoverRect.height;
      const popoverWidth = popoverRect.width || 380;

      const viewportHeight = window.innerHeight;
      const viewportWidth = window.innerWidth;
      const GAP = 10; // Strict exclusion buffer between cursor/word and popover card
      const SCREEN_PADDING = viewportWidth <= 768 ? 12 : 14;

      const spaceBelow = viewportHeight - rect.bottom - GAP - SCREEN_PADDING;
      const spaceAbove = rect.top - GAP - SCREEN_PADDING;

      let top = 0;
      let maxHeight = 0;

      // Smart placement: strictly above or strictly below, never intersecting the word/cursor
      if (spaceBelow >= popoverHeight) {
        // Fits comfortably below
        top = rect.bottom + GAP;
        maxHeight = spaceBelow;
      } else if (spaceAbove >= popoverHeight) {
        // Fits comfortably above
        top = rect.top - popoverHeight - GAP;
        maxHeight = spaceAbove;
      } else if (spaceBelow >= spaceAbove) {
        // Limited height, but more room below
        top = rect.bottom + GAP;
        maxHeight = Math.max(140, spaceBelow);
      } else {
        // Limited height, but more room above
        const clampedHeight = Math.min(popoverHeight, spaceAbove);
        top = rect.top - clampedHeight - GAP;
        maxHeight = Math.max(140, spaceAbove);
      }

      // Horizontal alignment: align with left edge of term, clamped inside screen bounds
      let left = rect.left;
      const maxLeft = viewportWidth - popoverWidth - SCREEN_PADDING;
      left = Math.max(SCREEN_PADDING, Math.min(left, maxLeft));

      popover.style.maxHeight = `${Math.floor(maxHeight)}px`;
      popover.style.top = `${Math.round(top)}px`;
      popover.style.left = `${Math.round(left)}px`;
      popover.style.visibility = 'visible';
    }

    function hidePopover(force = false) {
      if (popoverHideTimer) {
        clearTimeout(popoverHideTimer);
        popoverHideTimer = null;
      }
      const popover = document.getElementById('floating-popover');
      if (popover) {
        popover.style.display = 'none';
        popover.style.visibility = 'hidden';
      }
      activePopoverTerm = null;
    }

    document.addEventListener("click", (e) => {
      if (!e.target.closest('#floating-popover') && !e.target.closest('.tangent-term')) {
        hidePopover(true);
      }
    });

    window.addEventListener("scroll", () => {
      if (Date.now() - popoverOpenedAt < 350) return;
      if (activePopoverTerm && !document.getElementById('floating-popover')?.matches(':hover')) {
        hidePopover(true);
      }
    }, { passive: true });

    window.addEventListener("resize", () => {
      hidePopover(true);
    }, { passive: true });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        hidePopover(true);
      }
    });

    function showView(view) {
      const isArchive = view === "archive";
      const grid = document.getElementById("content-grid");
      const articleView = document.getElementById("view-article");
      const archiveView = document.getElementById("view-archive");
      const btnArchive = document.getElementById("btn-archive");
      const btnCurrent = document.getElementById("btn-current-issue");
      const outline = document.getElementById("sidebar-outline");
      const issueNav = document.getElementById("issue-nav");
      const footerScore = document.getElementById("article-footer-score");

      articleView.classList.toggle("hidden", isArchive);
      archiveView.classList.toggle("hidden", !isArchive);

      const latestId = (typeof TOPICS !== "undefined" && TOPICS.length > 0) ? TOPICS[0].id : null;

      if (isArchive) {
        if (window.location.hash !== "#archive") history.replaceState(null, "", "#archive");
        if (grid) grid.classList.add("archive-mode");
        if (btnArchive) {
          btnArchive.style.display = "none";
          btnArchive.classList.remove("active");
          btnArchive.textContent = "Archive";
        }
        if (btnCurrent) {
          btnCurrent.style.display = "inline-flex";
        }
        if (outline) outline.style.display = "none";
        if (issueNav) issueNav.style.display = "none";
        if (footerScore) footerScore.style.display = "none";
        renderSubjects();
        renderArchive();
      } else {
        if (activeArticleId && window.location.hash !== activeArticleId) history.replaceState(null, "", activeArticleId);
        if (grid) grid.classList.remove("archive-mode");
        if (btnArchive) {
          btnArchive.style.display = "inline-flex";
          btnArchive.classList.remove("active");
          btnArchive.textContent = "Archive";
        }
        if (btnCurrent) {
          const isOlderArticle = activeArticleId && latestId && activeArticleId !== latestId;
          btnCurrent.style.display = isOlderArticle ? "inline-flex" : "none";
        }
        const isDesktop = window.innerWidth > 768;
        if (outline) outline.style.display = isDesktop ? "block" : "none";
        if (issueNav) issueNav.style.display = "flex";
        if (footerScore) footerScore.style.display = "flex";
      }

      window.scrollTo(0, 0);
    }

      switch(sub) {
        case "All": return "sub-all";
        case "Product Dives": return "sub-product-dives";
        case "Manufacturing": return "sub-manufacturing";
        case "Thermal": return "sub-thermal";
        case "Electromechanical": return "sub-electromechanical";
        case "Design": return "sub-design";
        case "Materials": return "sub-materials";
        case "Mechanisms": return "sub-mechanisms";
        case "Fluids": return "sub-fluids";
        default: return "sub-all";
      }
    }

    function renderSubjects() {
      const bar = document.getElementById("subjects-bar");
      if (!bar) return;
      const published = TOPICS.filter(t => t.status === "Published");
      
      bar.innerHTML = SUBJECTS.map(sub => {
        const count = (sub === "All") 
          ? published.length 
          : published.filter(t => t.subject === sub).length;
        const isActive = sub === activeSubject;
        const isDisabled = count === 0;
        const subClass = getSubClass(sub);

        return `
          <button class="subject-pill ${subClass} ${isActive ? 'active' : ''} ${isDisabled ? 'disabled' : ''}" 
                  ${isDisabled ? 'disabled' : `onclick="filterSubject('${sub}')"`}
                  title="${count} published">
            <span>${sub}</span>
            <span style="opacity: 0.85;">(${count})</span>
          </button>
        `;
      }).join("");
    }

    function filterSubject(sub) {
      activeSubject = sub;
      renderSubjects();
      renderArchive();
    }

    function renderArchive() {
      const list = document.getElementById("archive-list");
      if (!list) return;
      const published = TOPICS.filter(t => t.status === "Published");
      const filtered = (activeSubject === "All") 
        ? published 
        : published.filter(t => t.subject === activeSubject);

      if (filtered.length === 0) {
        list.innerHTML = `<div style="padding: 40px 0; color: var(--muted); font-family: 'JetBrains Mono', monospace; font-size: 13px;">No published dispatches in this discipline yet.</div>`;
        return;
      }

      list.innerHTML = filtered.map(item => `
        <div class="archive-item" onclick="loadArticle('${item.id}')">
          <div class="archive-main">
            <div class="archive-meta">
              <span class="archive-id">${item.id}</span>
              <span class="archive-subject-tag ${getSubClass(item.subject)}">${item.subject}</span>
              <span class="archive-date">${item.date}</span>
            </div>
            <h3 class="archive-title">${item.title}</h3>
          </div>
          <div class="archive-arrow">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </div>
        </div>
      `).join("");
    }

    function toggleTheme() {
      const isDark = document.documentElement.getAttribute("data-theme") === "dark";
      document.documentElement.setAttribute("data-theme", isDark ? "light" : "dark");
      document.getElementById("moon-icon").style.display = isDark ? "block" : "none";
      document.getElementById("sun-icon").style.display = isDark ? "none" : "block";
    }

    window.addEventListener("scroll", () => {
      const docHeight = document.documentElement.scrollHeight - window.innerHeight;
      const progress = docHeight > 0 ? (window.scrollY / docHeight) * 100 : 0;
      document.getElementById("reading-progress-bar").style.width = `${progress}%`;
    });

    function loadLatestArticle() {
      if (TOPICS && TOPICS.length > 0) {
        loadArticle(TOPICS[0].id);
      }
    }

    // Author Queue Access (only visible to author via ?author=1 or Ctrl+Shift+Q)
    function checkQueueAccess() {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.has("author") || urlParams.has("admin") || urlParams.has("queue") || urlParams.has("review")) {
        localStorage.setItem("deepdive_author", "1");
      }
      if (localStorage.getItem("deepdive_author") === "1") {
        const btnQueue = document.getElementById("btn-queue");
        if (btnQueue) btnQueue.style.display = "inline-flex";
      }
    }
    checkQueueAccess();

    window.addEventListener("keydown", (e) => {
      if ((e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "q") || (e.altKey && e.key.toLowerCase() === "q")) {
        const isAuth = localStorage.getItem("deepdive_author") === "1";
        if (isAuth) {
          localStorage.removeItem("deepdive_author");
          const btnQueue = document.getElementById("btn-queue");
          if (btnQueue) btnQueue.style.display = "none";
        } else {
          localStorage.setItem("deepdive_author", "1");
          const btnQueue = document.getElementById("btn-queue");
          if (btnQueue) btnQueue.style.display = "inline-flex";
        }
      }
    });

    window.addEventListener("hashchange", () => {
      const currentHash = window.location.hash;
      if (currentHash === "#archive") {
        showView("archive");
      } else {
        const articleId = currentHash.split('/')[0];
        if (TOPICS.some(t => t.id === articleId)) {
          if (articleId !== activeArticleId) {
            loadArticle(articleId);
          } else {
            showView("article");
          }
        }
      }
    });

    let resizeTimer = null;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        const articleView = document.getElementById("view-article");
        if (articleView && !articleView.classList.contains("hidden")) {
          buildOutline();
          alignComparisonCards(articleView);
        }
      }, 150);
    });

    // Check if initial hash is #archive or a specific issue (e.g. #001, #002)
    const initHash = window.location.hash;
    const initialArticleId = initHash.split('/')[0];
    if (initHash === "#archive") {
      showView("archive");
    } else if (TOPICS.some(t => t.id === initialArticleId)) {
      loadArticle(initialArticleId).then(() => {
        if (initHash.includes('/')) {
          const sectionId = initHash.split('/')[1];
          const targetEl = document.getElementById(sectionId);
          if (targetEl) {
            setTimeout(() => {
              const offset = 48;
              const elementPosition = targetEl.getBoundingClientRect().top + window.pageYOffset;
              window.scrollTo({ top: elementPosition - offset, behavior: "smooth" });
            }, 100);
          }
        }
      });
    } else {
      loadLatestArticle();
    }
  </script>
</body>
</html>
