  <style>
    :root {
      --bg: #F9F8F6;
      --surface: #EFECE6;
      --surface-hover: #E4E0D8;
      --text: #191918;
      --muted: #6B6960;
      --border: #D8D4CC;
      --accent: #D97757;
      --accent-hover: #C56645;
      --max-w: 1080px;

      /* Subject Tag Colors (Light Mode) */
      --sub-product-dives: #D97757;
      --sub-manufacturing: #2563EB;
      --sub-design: #7C3AED;
      --sub-materials: #059669;
      --sub-mechanisms: #D97706;
      --sub-thermal: #E11D48;
      --sub-fluids: #0891B2;
      --sub-electromechanical: #4F46E5;
    }
    [data-theme="dark"] {
      --bg: #191918;
      --surface: #232220;
      --surface-hover: #2E2D2A;
      --text: #EDEDEB;
      --muted: #9E9C94;
      --border: #383734;
      --accent: #D97757;
      --accent-hover: #E88868;

      /* Subject Tag Colors (Dark Mode) */
      --sub-product-dives: #E88868;
      --sub-manufacturing: #3B82F6;
      --sub-design: #8B5CF6;
      --sub-materials: #10B981;
      --sub-mechanisms: #F59E0B;
      --sub-thermal: #F43F5E;
      --sub-fluids: #06B6D4;
      --sub-electromechanical: #6366F1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      scroll-behavior: smooth;
      overflow-x: clip;
      max-width: 100%;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.74;
      font-size: 16.5px;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.2s ease, color 0.2s ease;
      overflow-x: clip;
      max-width: 100%;
      width: 100%;
    }
    .layout-wrapper {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 0 24px 104px;
      width: 100%;
      box-sizing: border-box;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 28px 0; border-bottom: 1px solid var(--border); margin-bottom: 44px;
    }
    .brand-group {
      display: flex; align-items: center; gap: 12px; text-decoration: none; cursor: pointer;
    }
    .brand-logo {
      width: 34px; height: 34px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 6px; display: flex; align-items: center; justify-content: center;
      color: var(--accent); transition: border-color 0.15s; font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 600;
      flex-shrink: 0;
    }
    .brand-group:hover .brand-logo { border-color: var(--accent); }
    .brand {
      font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500;
      letter-spacing: 0.06em; text-transform: uppercase; color: var(--text); text-decoration: none;
    }
    .nav-actions { display: flex; gap: 20px; align-items: center; }
    .nav-btn {
      background: none; border: none; font-family: 'JetBrains Mono', monospace;
      font-size: 12px; color: var(--muted); cursor: pointer; padding: 4px 0; transition: color 0.15s;
    }
    .nav-btn:hover, .nav-btn.active { color: var(--text); font-weight: 600; }
    .theme-toggle-btn {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      width: 34px; height: 34px; border-radius: 6px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background 0.15s, border-color 0.15s; flex-shrink: 0;
    }
    .theme-toggle-btn:hover { background: var(--surface-hover); border-color: var(--muted); }
    .theme-toggle-btn svg { width: 16px; height: 16px; fill: currentColor; }

    /* Reading Progress Bar */
    .reading-progress-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      z-index: 3000;
      pointer-events: none;
      background: transparent;
    }
    .reading-progress-bar {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.08s ease-out;
    }

    /* Desktop Grid: Sticky Left Rail Navigation */
    .content-grid {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 56px;
      align-items: flex-start;
      width: 100%;
      min-width: 0;
      position: relative;
    }

    .sidebar-outline {
      position: sticky;
      top: 28px;
      max-height: calc(100vh - 56px);
      overflow-y: auto;
      padding-right: 16px;
      border-right: 1px solid var(--border);

      -webkit-overflow-scrolling: touch;
    }
    .outline-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .outline-item a {
      font-size: 13.5px;
      color: var(--muted);
      text-decoration: none;
      display: block;
      line-height: 1.45;
      transition: color 0.15s, border-color 0.15s;
      border-left: 2px solid transparent;
      padding-left: 10px;
    }
    .outline-item a:hover { color: var(--text); }
    .outline-item a.active {
      color: var(--accent);
      border-left-color: var(--accent);
      font-weight: 500;
    }
    .outline-item.sub-item a { padding-left: 22px; font-size: 12.5px; }

    /* Columns with Grid Containment */
    .editorial-column {
      max-width: 740px;
      width: 100%;
      min-width: 0;
    }
    .archive-column {
      max-width: 100%;
      width: 100%;
      min-width: 0;
      grid-column: 1 / -1;
    }

    #view-article {
      min-width: 0;
      width: 100%;
    }

    .subjects-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 36px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
    .subject-pill {
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
      font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 6px 12px; border-radius: 4px; cursor: pointer; transition: all 0.15s ease;
    }
    .subject-pill:hover { opacity: 0.85; transform: translateY(-1px); }
    .subject-pill.active { box-shadow: 0 0 0 1px var(--text); }
    .subject-pill.disabled {
      opacity: 0.42;
      cursor: not-allowed;
      border-style: dashed;
    }
    .subject-pill.disabled:hover {
      transform: none;
      opacity: 0.42;
    }

    /* Filter Button Colors */
    .btn-sub-all { background: var(--surface); color: var(--text); border-color: var(--border); }
    .btn-sub-all.active { background: var(--text); color: var(--bg); border-color: var(--text); }
    .btn-sub-product-dives { background: rgba(217, 119, 87, 0.1); color: var(--sub-product-dives); border-color: rgba(217, 119, 87, 0.35); }
    .btn-sub-product-dives.active { background: var(--sub-product-dives); color: #FFF; border-color: var(--sub-product-dives); }
    .btn-sub-manufacturing { background: rgba(37, 99, 235, 0.1); color: var(--sub-manufacturing); border-color: rgba(37, 99, 235, 0.35); }
    .btn-sub-manufacturing.active { background: var(--sub-manufacturing); color: #FFF; border-color: var(--sub-manufacturing); }
    .btn-sub-design { background: rgba(124, 58, 237, 0.1); color: var(--sub-design); border-color: rgba(124, 58, 237, 0.35); }
    .btn-sub-design.active { background: var(--sub-design); color: #FFF; border-color: var(--sub-design); }
    .btn-sub-materials { background: rgba(5, 150, 105, 0.1); color: var(--sub-materials); border-color: rgba(5, 150, 105, 0.35); }
    .btn-sub-materials.active { background: var(--sub-materials); color: #FFF; border-color: var(--sub-materials); }
    .btn-sub-mechanisms { background: rgba(217, 119, 6, 0.1); color: var(--sub-mechanisms); border-color: rgba(217, 119, 6, 0.35); }
    .btn-sub-mechanisms.active { background: var(--sub-mechanisms); color: #FFF; border-color: var(--sub-mechanisms); }
    .btn-sub-thermal { background: rgba(225, 29, 72, 0.1); color: var(--sub-thermal); border-color: rgba(225, 29, 72, 0.35); }
    .btn-sub-thermal.active { background: var(--sub-thermal); color: #FFF; border-color: var(--sub-thermal); }
    .btn-sub-fluids { background: rgba(8, 145, 178, 0.1); color: var(--sub-fluids); border-color: rgba(8, 145, 178, 0.35); }
    .btn-sub-fluids.active { background: var(--sub-fluids); color: #FFF; border-color: var(--sub-fluids); }
    .btn-sub-electromechanical { background: rgba(79, 70, 229, 0.1); color: var(--sub-electromechanical); border-color: rgba(79, 70, 229, 0.35); }
    .btn-sub-electromechanical.active { background: var(--sub-electromechanical); color: #FFF; border-color: var(--sub-electromechanical); }

    .meta-line { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    h1 { font-family: 'Instrument Serif', Georgia, serif; font-size: 46px; font-weight: 400; line-height: 1.12; letter-spacing: -0.01em; margin-bottom: 20px; word-break: break-word; overflow-wrap: break-word; }
    .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 18.5px; color: var(--muted); line-height: 1.55; margin-bottom: 36px; font-weight: 400; word-break: break-word; overflow-wrap: break-word; }
    h2 { font-family: 'Instrument Serif', Georgia, serif; font-size: 34px; font-weight: 600; margin: 56px 0 18px; line-height: 1.18; letter-spacing: -0.01em; color: var(--text); scroll-margin-top: 56px; word-break: break-word; overflow-wrap: break-word; }
    h2 + p { font-size: 17.5px; line-height: 1.72; color: var(--text); margin-bottom: 22px; }
    h3 { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 21px; font-weight: 700; margin: 44px 0 14px; letter-spacing: -0.015em; line-height: 1.3; padding-left: 12px; border-left: 3px solid var(--accent); display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 10px; scroll-margin-top: 56px; }
    .price-tag { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--accent); font-weight: 600; letter-spacing: 0.02em; background: var(--surface); padding: 3px 9px; border-radius: 4px; border: 1px solid rgba(217, 119, 87, 0.3); white-space: nowrap; }
    p { margin-bottom: 20px; word-break: break-word; overflow-wrap: break-word; }
    ul { margin: 0 0 24px 22px; }
    li { margin-bottom: 12px; word-break: break-word; overflow-wrap: break-word; }
    strong { font-weight: 600; }

    /* Mobile Floating TOC Drawer Button */
    .mobile-toc-fab {
      display: none;
      position: fixed;
      bottom: 24px;
      right: 20px;
      z-index: 1500;
      background: var(--text);
      color: var(--bg);
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: 24px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      align-items: center;
      gap: 6px;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .mobile-toc-fab:active { transform: scale(0.96); }

    /* Mobile TOC Modal Drawer */
    .mobile-toc-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 2500;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .mobile-toc-modal.open {
      display: flex;
      opacity: 1;
      pointer-events: auto;
      justify-content: flex-end;
      flex-direction: column;
    }
    .mobile-toc-sheet {
      background: var(--bg);
      border-top: 1px solid var(--border);
      border-radius: 16px 16px 0 0;
      padding: 20px 20px 36px;
      max-height: 75vh;
      overflow-y: auto;
      transform: translateY(100%);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 -8px 32px rgba(0,0,0,0.25);
    }
    .mobile-toc-modal.open .mobile-toc-sheet { transform: translateY(0); }
    .mobile-toc-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .mobile-toc-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      font-weight: 600;
    }
    .mobile-toc-close {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 18px;
      cursor: pointer;
      padding: 4px 8px;
    }

    /* Popover Mobile Backdrop */
    .popover-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 1999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .popover-backdrop.active {
      display: block;
      opacity: 1;
      pointer-events: auto;
    }

    /* Share Toast Notification */
    .toast-pill {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--text);
      color: var(--bg);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      padding: 8px 16px;
      border-radius: 20px;
      z-index: 3500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }
    .toast-pill.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Interactive Deep-Dive Tangent Triggers */
    .tangent-term {
      border-bottom: 1.5px dotted var(--accent);
      color: var(--text);
      cursor: pointer;
      font-weight: 500;
      position: relative;
      transition: background-color 0.15s, color 0.15s;
      padding: 1px 3px;
      border-radius: 3px;
    }
    .tangent-term:hover, .tangent-term.active-hover {
      background-color: var(--surface);
      color: var(--accent);
    }

    /* Floating Hover Popover (Desktop) */
    .floating-popover {
      position: fixed;
      z-index: 2000;
      max-width: 380px;
      width: calc(100vw - 32px);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.16), 0 2px 8px rgba(0, 0, 0, 0.08);
      padding: 16px 20px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(6px);
      transition: opacity 0.18s cubic-bezier(0.16, 1, 0.3, 1), transform 0.18s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .floating-popover.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }
    .floating-popover.pinned {
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.22), 0 0 0 1.5px var(--accent);
    }
    .popover-arrow {
      position: absolute;
      width: 12px;
      height: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      transform: rotate(45deg);
      z-index: -1;
    }
    .floating-popover.arrow-bottom .popover-arrow {
      bottom: -7px;
      border-top: none;
      border-left: none;
    }
    .floating-popover.arrow-top .popover-arrow {
      top: -7px;
      border-bottom: none;
      border-right: none;
    }
    .popover-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }
    .popover-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent);
      font-weight: 600;
    }
    .popover-close-btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 15px;
      padding: 2px 6px;
      line-height: 1;
      display: none;
    }
    .floating-popover.pinned .popover-close-btn { display: block; }
    .popover-close-btn:hover { color: var(--text); }
    .popover-title {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 21px;
      font-weight: 400;
      margin-bottom: 8px;
      line-height: 1.25;
      color: var(--text);
    }
    .popover-body {
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--text);
    }
    .popover-body p { margin-bottom: 8px; }
    .popover-body p:last-child { margin-bottom: 0; }
    .popover-body .modal-equation-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 8px 12px;
      margin: 10px 0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      line-height: 1.45;
      color: var(--text);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      word-break: break-word;
    }
    .popover-footer {
      margin-top: 10px;
      padding-top: 6px;
      border-top: 1px solid var(--border);
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .callout-box { background: var(--surface); border-left: 3px solid var(--accent); padding: 18px 22px; margin: 28px 0; font-size: 15.5px; border-radius: 0 6px 6px 0; max-width: 100%; word-break: break-word; }
    .callout-title { font-family: 'JetBrains Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); margin-bottom: 6px; font-weight: 500; }

    figure.product-figure { margin: 38px 0; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; background: var(--surface); max-width: 100%; }
    .img-wrapper { position: relative; width: 100%; aspect-ratio: 16 / 10; overflow: hidden; background: #141413; }
    .img-wrapper img { width: 100%; height: 100%; object-fit: cover; display: block; }
    figcaption { padding: 14px 18px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); line-height: 1.5; display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
    .source-tag { white-space: nowrap; font-size: 11px; opacity: 0.85; }

    /* Specification Table: Isolated Horizontal Scroll Container */
    .spec-table-wrap {
      width: 100%;
      max-width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin: 28px 0 36px;
      border: 1px solid var(--border);
      border-radius: 6px;
      display: block;
      position: relative;
    }
    .spec-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      min-width: 620px;
      table-layout: auto;
    }
    .spec-table th, .spec-table td {
      text-align: left;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
      white-space: normal;
    }
    .spec-table tr:last-child td { border-bottom: none; }
    .spec-table th { font-family: 'JetBrains Mono', monospace; font-size: 11px; text-transform: uppercase; color: var(--muted); font-weight: 500; background: var(--surface); }

    .telemetry-bar { display: flex; justify-content: space-between; align-items: center; background: var(--surface); border: 1px solid var(--border); padding: 16px 20px; border-radius: 6px; margin: 48px 0 24px; font-size: 13.5px; flex-wrap: wrap; gap: 12px; }
    .telemetry-info { display: flex; flex-direction: column; gap: 2px; }
    .telemetry-title { font-weight: 600; font-family: 'JetBrains Mono', monospace; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
    .telemetry-desc { color: var(--muted); font-size: 13px; }
    .telemetry-actions { display: flex; gap: 10px; }
    .score-btn { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 6px 14px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.15s ease; }
    .score-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--surface); }
    .score-btn.active-up { background: #E1F5FE; border-color: #0288D1; color: #01579B; }
    .score-btn.active-down { background: #FFEBEE; border-color: #C62828; color: #B71C1C; }

    /* Dynamic Issue Navigation Bar */
    .issue-nav-bar {
      margin-top: 48px;

            Why heating cold water at 9 bars makes steady brew temperature so difficult—and how dual boilers solve it.
          </p>

          <h2 id="section-thermal-imperative">1. The Thermodynamic Challenge: Controlling 93.3°C Water Under Pressure</h2>
          <p>
            In precision espresso extraction, water temperature is the primary chemical solvent rate limiter. Coffee bean solubles—chlorogenic acids, trigonelline, lipids, and aromatic melanoidins—dissolve at sharply segregated activation energies. When water hits the coffee bed at <strong>89°C</strong>, low-molecular-weight organic acids wash out while complex caramelized sugars remain trapped inside the cell matrix, yielding unpleasantly sour, thin espresso. Conversely, when brewing temperature exceeds <strong>95.5°C</strong>, high-molecular-weight chlorogenic acid lactones and bitter astringent polyphenols dissolve rapidly, completely masking delicate terroir aromatics with dry, ashy bitterness. For specialty Arabica cultivars, commercial extraction standards demand maintaining brewing water between <strong>92.5°C and 93.5°C</strong>, with an allowable intra-shot temperature delta of no more than <strong>&plusmn;0.5°C</strong> across the entire 30-second brew cycle.
          </p>
          <p>
            To appreciate why this tight tolerance is so difficult to maintain in consumer and prosumer equipment, engineers must analyze the non-steady fluid and thermal parameters:
          </p>
          <ul>
            <li><strong>Sensible Heat Drawdown:</strong> A positive displacement vibratory pump or commercial rotary vane pump draws water from an unheated reservoir (ambient 18°C to 20°C) and forces it through a tightly compacted 18-gram puck of finely ground coffee at a volumetric flow rate between <strong>1.5 and 2.5 mL/s</strong> under 9 bar (130.5 psi) of hydrostatic pressure.</li>
            <li><strong>Mass Heat Absorption:</strong> Over a standard 36-gram double espresso extraction, approximately 65 to 75 mL of total water enters the boiler circuit (accounting for roughly 22 mL retained in the spent coffee cake, 12 mL purged through the three-way solenoid valve exhaust port at shot completion, and 36 mL delivered into the cup). Bringing 70 mL of cold water from 18°C up to 93.3°C in 30 seconds requires continuous, localized <span class="tangent-term" data-tangent="sensible_heat">sensible heat transfer</span>:
              <br><br>
              <code>q = m_dot · C_p · (T_brew - T_inlet)</code>
              <br><br>
              Where mass flow <code>m_dot = 2.0 g/s</code>, isobaric specific heat capacity <code>C_p = 4.184 J/(g·°C)</code>, and temperature differential <code>ΔT = 75.3°C</code>. This equates to an instantaneous fluid heating requirement of <strong>630 Watts</strong>, completely excluding passive radiant, conductive, and convective thermal losses to the machine's chassis.
            </li>
            <li><strong>Transient Hydraulic Loading:</strong> Unlike industrial continuous-flow water heaters that operate in steady state, espresso extraction is highly dynamic. Flow begins with a zero-flow pressurization phase (pre-infusion at 2 to 4 bar), transitions to full flow (2 mL/s at 9 bar), and ends abruptly when the three-way solenoid snaps shut, dumping high-pressure water into the drip tray. This sudden change in mass flow creates rapid thermal shocks inside compact heating elements.</li>
          </ul>

          <h2 id="section-thermoblock-mechanics">2. Thermoblock Flash Heating: Fluid Mechanics & Boundary Layer Limits</h2>
          <p>
            Entry-level and slim-profile residential espresso machines rely on <strong>Thermoblocks</strong> (and modern ceramic thick-film heating elements) to eliminate bulky, water-filled pressure vessels. Instead of storing a standing reservoir of heated water under continuous static pressure, a thermoblock functions as an on-demand continuous-flow heat exchanger. It consists of a dense block of die-cast aluminum alloy (typically A380 or ADC12) embedded with high-wattage resistive calrod heating coils and a winding internal fluid conduit.
          </p>
          <p>
            <strong>The Serpentine Capillary Conduit:</strong> In early consumer machines, water was pumped directly through bare channels cored into the cast aluminum body. However, alkaline tap water and acidic descaling agents caused rapid galvanic pitting, flaking aluminum oxide particles into the drinking water. Modern thermoblocks resolve this by casting a continuous, pre-formed <strong>AISI 304 stainless steel helical tube</strong> (typically 4.0 mm outer diameter with a 0.8 mm wall thickness) directly inside the aluminum casting. Heat generated in the electric element conducts through the aluminum block, across the metallurgical interface into the stainless steel tube wall, and finally transfers into the moving water via forced convection.
          </p>

          <p><strong>The Laminar Boundary Layer Bottleneck:</strong> While thermoblocks achieve rapid warm-up times (cold-to-brew in under 60 seconds), their transient extraction stability is constrained by fluid mechanics:
          </p>
          <ul>
            <li><strong>Laminar Flow and Thermal Sheathing:</strong> Because espresso flow rates are exceptionally small (<code>Q ≈ 2.0 mL/s</code> through a 2.4 mm inner tube diameter), the fluid velocity inside the capillary conduit is only <code>v ≈ 0.44 m/s</code>. The resulting Reynolds number is:
              <br><br>
              <code>Re = (ρ · v · D) / μ ≈ (997 · 0.44 · 0.0024) / 0.00089 ≈ 1,180</code>
              <br><br>
              Because <code>Re &lt; 2,100</code>, fluid flow inside the tube is strictly laminar. Fluid moving adjacent to the inner pipe wall slows to zero velocity, forming a stagnant thermal boundary layer. This boundary layer acts as an insulating blanket, forcing heat to conduct across stationary water before reaching the fast-moving fluid core. Unless the capillary tube incorporates internal static turbulators, helical rifling, or stamped dimples to trip the boundary layer into turbulent mixing, water emerging from the thermoblock core can measure 4°C to 6°C colder than the inner metal surface.
            </li>
            <li><strong>Flow-Rate Thermal Inversion:</strong> Because a thermoblock possesses very low stored <span class="tangent-term" data-tangent="thermal_mass">thermal mass</span> (typically 450 to 650 grams of aluminum, yielding a thermal capacitance <code>C_th ≈ 400 to 580 J/°C</code>), the exit temperature of the water is tightly coupled to volumetric flow velocity. If a coffee puck is tamped unevenly or ground too coarse, puck resistance drops and flow increases from 1.8 mL/s to 3.5 mL/s. Because water transit time through the heated labyrinth is cut in half, the water exits before absorbing adequate sensible heat, dropping extraction temperature by up to 5°C midway through the shot.</li>
            <li><strong>Steam Conversion Hysteresis:</strong> Producing 135°C dry steam for texturing milk requires running the thermoblock at maximum power while cycling the pump in short, microsecond pulses. These droplets hit the superheated tube walls and flash into vapor. However, once steaming is complete, the entire aluminum casting sits at 145°C. To pull an espresso shot immediately afterward, the user must run a manual water purge to cool the block back down to 93°C, wasting water and causing severe temperature guesswork.</li>
          </ul>

          <p>
            Commercial cafe machines and high-end prosumer appliances discard on-demand flash heating in favor of an <strong>Independent Dual Boiler (DB)</strong> architecture. By isolating the two disparate thermodynamic tasks into separate pressure vessels, each system operates at its optimal thermodynamic equilibrium:
          </p>
          <ul>
            <li><strong>The Dedicated Brew Boiler:</strong> A compact 0.5 to 0.8 L vessel maintained at exactly 93.0°C under 9 bar brew pressure. Because it never generates steam, it remains 100% full of liquid water with zero air pockets.</li>
            <li><strong>The Dedicated Service/Steam Boiler:</strong> A larger 1.5 to 3.5 L vessel operating at 1.5 to 2.0 bar gauge pressure (126°C to 130°C saturated steam). It operates with a two-phase liquid-vapor boundary, providing immense instantaneous steam enthalpy for milk texturing.</li>
          </ul>
          <p>
            <strong>Algorithmic PID Thermal Regulation:</strong> Rather than relying on mechanical thermostats that drift over time, precision dual-boiler systems incorporate discrete <span class="tangent-term" data-tangent="pid_controller">PID control loops</span> driven by Class-A PT100 platinum RTD sensors or high-sensitivity NTC thermistors submerged directly in the fluid core:
          </p>
          <p>
            The PID controller samples temperature error at 10 Hz, calculating proportional, integral, and derivative corrections to modulate a Solid-State Relay (SSR). By pulse-width modulating heater element wattage at zero-crossing AC cycles, the system prevents temperature cycling, maintaining steady-state boiler core water within an astonishing <strong>&plusmn;0.1°C</strong> of setpoint.
          </p>
          <p>
            <strong>Pre-Heating Ingress Fluid Loops:</strong> To eliminate cold water shock when 18°C reservoir water enters the brew boiler during extraction, advanced dual-boiler machines route cold pump water through an internal heat exchanger tube submersed inside the 130°C steam boiler before discharging it into the brew boiler. The incoming water is passively pre-heated to approximately 90°C before entering the brew chamber, completely neutralizing the thermal drawdown shock and enabling continuous back-to-back shot extraction with zero temperature loss.
          </p>

          <h2 id="section-group-head-kinematics">4. Group Head Thermal Mass: Saturated vs. E61 Thermosyphon</h2>
          <p>
            Delivering 93°C water out of a boiler is meaningless if that water loses heat as it travels to the coffee puck. The mechanical connection between boiler and portafilter—the <strong>Group Head</strong>—is the single largest thermal sink in the machine.
          </p>
          <p>
            <strong>The Historic E61 Thermosyphon Loop:</strong> Engineered by Ernesto Valente in 1961, the legendary Faema E61 group head uses a passive gravity-driven thermosyphon. Hot water rises from the upper boiler port, circulates through a massive <strong>4.2 kg forged brass group body</strong> via natural convection, and returns to the lower boiler port as it cools. This convective circuit keeps the exterior brass body piping hot. However, the E61 design is vulnerable to thermal stagnation: if the machine idles untouched for 30 minutes, water trapped inside the neck approaches steam boiler temperatures, requiring a mandatory 5-second "cooling flush" before locking in a portafilter.

          <h2 id="section-metallurgy-calcification">5. Metallurgy, DFM, and Scale Deposition Kinetics</h2>
          <p>
            Designing residential fluid-thermal appliances requires balancing thermal transport against long-term corrosion and water chemistry:
          </p>
          <ul>
            <li><strong>Thermal Conductivity vs. Heavy Metals:</strong> For decades, forged lead-free brass (CW617N) and deoxidized copper (C12200) were industry standards due to their immense <span class="tangent-term" data-tangent="thermal_conductivity">thermal conductivity</span> (385 W/m·K for copper vs. 16 W/m·K for stainless steel). However, stringent international drinking water regulations (such as California NSF 61 / NSF 372) and consumer demand for zero-lead wet paths have accelerated migration toward <strong>AISI 316L deep-drawn austenitic stainless steel</strong>. While stainless steel has 24x lower thermal conductivity than copper, its immense tensile strength allows thinner boiler walls, reducing total warm-up thermal inertia while providing near-immunity to chloride stress corrosion cracking.</li>
            <li><strong>The Chemistry of Calcification:</strong> When potable water is heated above 60°C, dissolved calcium and bicarbonate ions undergo retrograde mineral precipitation, forming rigid <span class="tangent-term" data-tangent="calcification">calcium carbonate scale</span>. Scale has an abysmal thermal conductivity of 1.3 W/(m·K)—acting as an insulating blanket over heating elements. A 1.0 mm scale layer forces heating element core temperatures to run over 120°C hotter to achieve the same water heat flux, triggering premature calrod element burnouts and occluding delicate 0.6 mm ruby gicleur flow-restrictor orifices.</li>
            <li><strong>Manufacturing and Pressure Vessel Certification:</strong> Fabricating reliable, food-safe high-pressure boilers involves precision automated orbital TIG welding or vacuum furnace brazing. Unlike residential hot water heaters operating at low municipal line pressures (2 to 4 bar), espresso boilers must withstand continuous cyclic hydraulic pulses up to 12 bar from positive displacement pumps. To satisfy ASME Boiler and Pressure Vessel Code (BPVC Section VIII) and European Pressure Equipment Directive (PED 2014/68/EU), deep-drawn boiler domes incorporate generous knuckle radii to eliminate localized mechanical stress concentrations, followed by automated hydrostatic burst testing at 24 bar (2.5x working pressure).</li>
          </ul>

          <h2 id="section-bench-testing-metrology">6. Empirical Bench Metrology: The Scace Device & Flow Profiling</h2>
          <p>
            Validating thermal stability in espresso equipment cannot be performed using external infrared thermography or standard fluid catch cups. Liquid water cooling rapidly through air introduces dramatic evaporative and convective measurement artifacts (&Delta;T &gt; 3°C within 3 seconds of leaving the dispersion screen).
          </p>
          <p>
            <strong>The Scace Thermofilter Standard:</strong> Developed by mechanical engineer Greg Scace, the industry-standard Scace device embeds a fast-response Type-T thermocouple directly inside a solid polyether ether ketone (PEEK) portafilter insert. PEEK exhibits a low thermal conductivity (<code>k ≈ 0.25 W/m·K</code>), closely simulating the thermal resistance and boundary conditions of a compacted coffee bed. A calibrated needle valve orifice restricts water flow to precisely 2.0 mL/s under 9 bar pressure. High-frequency digital data loggers sample thermocouple potential at 20 Hz:
          </p>
          <ul>
            <li><strong>Initial Transient Recovery Time:</strong> Measures how many seconds elapse between pump engagement and the fluid reaching 93.0°C. Saturated dual boilers stabilize within 1.2 seconds, whereas un-flushed heat exchanger machines often spike to 97°C for the first 8 seconds before plunging.</li>
            <li><strong>Inter-Shot Duty Cycle Recovery:</strong> Simulates high-volume cafe workflow by executing consecutive 30-second extraction shots separated by 10-second rest intervals. Thermoblocks experience continuous downward drift (averaging a 1.8°C loss on each consecutive shot), while dual-boiler systems with pre-heat heat exchangers maintain identical intra-shot curves across 20+ continuous extractions.</li>
          </ul>

          <h2 id="section-pump-dynamics">7. Fluid Delivery: Vibratory Solenoid vs. Rotary Vane Hydraulics</h2>
          <p>
            Upstream of any boiler or thermoblock lies the hydraulic power source. In espresso extraction, maintaining constant hydrostatic pressure against a compacting, swelling coffee puck requires continuous positive displacement fluid delivery.
          </p>
          <p>
            <strong>The 60 Hz Solenoid Vibratory Pump (Ulka Architecture):</strong> Residential machines predominantly employ oscillating solenoid pumps (such as the ubiquitous Italian Ulka EX5). An alternating current half-wave rectifier feeds an electromagnetic coil at 60 Hz (or 50 Hz), creating an oscillating magnetic field that drives a stainless steel piston against an internal compression spring.
          </p>
          <ul>
            <li><strong>Non-Linear Pressure-Flow Curves:</strong> Vibratory pumps exhibit a steep, non-linear characteristic curve. At zero pressure (free flow), flow reaches 11 to 12 mL/s; but as head resistance builds against the puck, flow drops precipitously. At the target 9.0 bar operating point, flow throttles to roughly 2.0 to 2.5 mL/s. If grind size shifts slightly, flow variations directly perturb the residence time inside upstream heating circuits.</li>
            <li><strong>Hydraulic Pressure Pulsations:</strong> Because the piston cycles at line frequency (60 strokes per second), fluid pressure exits the pump as a violent saw-tooth pressure wave (&plusmn;1.5 bar ripple amplitude). If un-damped, these high-frequency pressure shocks can fracture the brittle coffee bed, creating microscopic fissures and channeling. To mitigate this, engineers install elastomeric diaphragm pulse dampers and overpressure expansion valves (OPVs) directly at the boiler inlet to smooth pressure ripple into a continuous hydraulic gradient.</li>
          </ul>
          <p>
            <strong>The Balanced Commercial Rotary Vane Pump:</strong> High-end dual-boiler machines feature external or internal commercial rotary vane pumps driven by high-torque induction or brushless DC (BLDC) motors:
          </p>
          <ul>
            <li><strong>Linear Volumetric Delivery:</strong> A slotted rotor spins eccentrically inside a cylindrical brass or stainless steel chamber (e.g. Fluid-o-Tech or Procon). Carbon-graphite vanes slide outward under centrifugal force, trapping discrete fluid pockets and delivering ultra-smooth, pulse-free hydraulic pressure regardless of puck resistance.</li>
            <li><strong>Dynamic Pressure Profiling:</strong> Modern computerized espresso systems modulate BLDC motor RPM in real time to execute programmed pressure and flow profiles—such as a 30-second declining pressure curve (starting at 9 bar and tapering to 6 bar as coffee solids dissolve). This dynamic hydraulic regulation prevents over-extraction of bitter tannins in the final third of the extraction cycle.</li>
          </ul>

          <h2 id="section-safety-valves">8. Pressure Vessel Safety & Anti-Vacuum Breaker Mechanics</h2>
          <p>
            Operating sealed boilers at temperatures up to 130°C requires robust mechanical and thermodynamic safety architectures. Inside a dedicated steam boiler, water and saturated steam exist in equilibrium at approximately 1.5 bar gauge pressure (2.5 bar absolute, 36.3 psi).
          </p>
          <ul>
            <li><strong>Mechanical Overpressure Relief Valves (OPVs):</strong> To satisfy ASME Section VIII pressure vessel certification, every pressurized boiler integrates a certified spring-loaded mechanical relief valve. If solid-state relay failure causes heating elements to runaway continuously, boiler pressure rises toward catastrophic limits. At 2.5 bar gauge (138°C), the calibrated stainless steel compression spring overcomes internal fluid pressure, unseating a high-temperature fluoroelastomer (FKM/Viton) sealing disc and safely venting superheated steam into a dedicated drainage manifold.</li>
            <li><strong>The Cooling Vacuum Collapse & Anti-Vacuum Breakers:</strong> When an espresso machine powers down after use, the steam boiler begins cooling from 130°C toward ambient room temperature (20°C). As saturated steam condenses back into liquid water, its specific volume collapses by a factor of over 1,600x:
              <br><br>
              <code>v_steam ≈ 1.159 m³/kg  -->  v_water ≈ 0.001 m³/kg</code>
              <br><br>
              This massive phase-change volume contraction creates a severe internal vacuum (approaching -0.85 bar gauge). If the boiler is unvented, this vacuum will physically suck milky water from the steam wand directly into the clean boiler cavity through siphon action, contaminating the water supply and fostering bacterial growth. Furthermore, atmospheric pressure acting on the exterior boiler walls can buckle thin-walled copper vessels.
            </li>
            <li><strong>Automated Mechanical Vacuum Breakers:</strong> To eliminate vacuum collapse, boilers incorporate a vertical gravity-actuated brass vacuum relief valve. During normal pressurized operation, internal steam pressure pushes an internal PTFE or silicone seal upward against an upper orifice, sealing the chamber. As the boiler cools and pressure approaches zero bar, the sealing pin drops downward under its own gravity, breaking the seal and allowing atmospheric air to rush into the chamber. This eliminates internal vacuum formation, protecting boiler structural integrity and preventing back-siphon contamination.</li>
          </ul>

      } else {
        if (btnNorm) btnNorm.classList.remove('active');
        if (btnStall) btnStall.classList.add('active');
        if (flowHot) flowHot.className.baseVal = 'flow-line-stalled';
        if (flowCold) flowCold.className.baseVal = 'flow-line-stalled';
        if (flowGroup) flowGroup.className.baseVal = 'flow-line-stalled';
        if (warning) warning.style.display = 'block';
        if (titleEl) {
          titleEl.textContent = 'THERMAL STAGNATION DETECTED';
          titleEl.style.color = '#EF4444';
        }
        if (descEl) descEl.textContent = 'Convection stalled! Upper neck overheated to 98.5°C. Mandatory 5s cooling flush required.';
      }
    }

    function calculateReadTime() {
      const articleEl = document.getElementById("view-article");
      if (!articleEl) return;
      const text = articleEl.innerText || articleEl.textContent || "";
      const words = text.match(/\S+/g) || [];
      const wordCount = words.length;
      const readMinutes = Math.max(1, Math.round(wordCount / 220));
      const badge = document.getElementById("read-time-badge");
      if (badge) badge.textContent = `${readMinutes} MIN READ`;
    }

    let toastTimeout = null;
    function showToast(msg) {
      const toast = document.getElementById("toast-pill");
      if (!toast) return;
      toast.textContent = msg;
      toast.classList.add("show");
      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove("show");
      }, 2200);
    }

    function openMobileToc() {
      const modal = document.getElementById("mobile-toc-modal");
      if (!modal) return;
      const desktopList = document.getElementById("outline-list");
      const mobileList = document.getElementById("mobile-outline-list");
      if (desktopList && mobileList) {
        mobileList.innerHTML = desktopList.innerHTML;
        mobileList.querySelectorAll("a").forEach(a => {
          a.addEventListener("click", () => closeMobileToc());
        });
      }
      modal.classList.add("open");
      document.body.style.overflow = "hidden";
    }

    function closeMobileToc(e) {
      if (e && e.target && e.target.closest && e.target.closest(".mobile-toc-sheet") && !e.target.closest(".mobile-toc-close") && !e.target.closest("a")) {
        return;
      }
      const modal = document.getElementById("mobile-toc-modal");
      if (modal) modal.classList.remove("open");
      document.body.style.overflow = "";
    }

    function renderIssueNav() {
      let navContainer = document.getElementById("dynamic-issue-nav");
      if (!navContainer) {
        navContainer = document.createElement("div");
        navContainer.id = "dynamic-issue-nav";
        navContainer.className = "issue-nav-bar";
        const articleView = document.getElementById("view-article");
        if (articleView) articleView.appendChild(navContainer);
      }

      const published = TOPICS.filter(t => t.status === "Published");
      const currentIndex = published.findIndex(t => t.id === activeArticleId);
      if (currentIndex === -1) return;

      const current = published[currentIndex];
      const nextItem = currentIndex > 0 ? published[currentIndex - 1] : null;
      const prevItem = currentIndex < published.length - 1 ? published[currentIndex + 1] : null;

      let navHtml = "";
      if (prevItem) {
        navHtml += `<button class="issue-nav-btn" onclick="loadArticle('${prevItem.id}')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          Previous (${prevItem.id})
        </button>`;
      } else {
        navHtml += `<span class="issue-nav-btn disabled">First Issue</span>`;
      }

      navHtml += `<span style="font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--muted); text-align:center;">
        Issue ${current.id} &middot; ${current.date}
      </span>`;

      if (nextItem) {
        navHtml += `<button class="issue-nav-btn" onclick="loadArticle('${nextItem.id}')">
          Next (${nextItem.id})
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>`;
      } else {
        navHtml += `<span class="issue-nav-btn disabled">Latest Dispatch</span>`;
      }

      navContainer.innerHTML = navHtml;
    }

    function syncTelemetryUI() {
      const btnUp = document.getElementById("telemetry-up");
      const btnDown = document.getElementById("telemetry-down");
      if (!btnUp || !btnDown) return;
      btnUp.classList.remove("active-up");
      btnDown.classList.remove("active-down");

      const saved = localStorage.getItem("edd_telemetry_" + activeArticleId);
      if (saved === "up") btnUp.classList.add("active-up");
      else if (saved === "down") btnDown.classList.add("active-down");
    }

    function recordTelemetry(direction) {
      const key = "edd_telemetry_" + activeArticleId;
      const current = localStorage.getItem(key);
      if (current === direction) {
        localStorage.removeItem(key);
      } else {
        localStorage.setItem(key, direction);
      }
      syncTelemetryUI();
      showToast(direction === "up" ? "Feedback recorded: Helpful topic." : "Feedback recorded: Needs adjustment.");
    }

    function initTheme() {
      const savedTheme = localStorage.getItem("edd_theme");
      const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      const theme = savedTheme || (prefersDark ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
      updateThemeIcons(theme === "dark");
    }

    function updateThemeIcons(isDark) {
      const moon = document.getElementById("moon-icon");
      const sun = document.getElementById("sun-icon");
      if (moon && sun) {
        moon.style.display = isDark ? "block" : "none";
        sun.style.display = isDark ? "none" : "block";
      }
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute("data-theme") || "light";
      const nextTheme = current === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", nextTheme);
      localStorage.setItem("edd_theme", nextTheme);
      updateThemeIcons(nextTheme === "dark");
    }

    function syncUrlState(id) {
      if (history.replaceState) {
        const url = new URL(window.location);
        url.searchParams.set("issue", id.replace('#', ''));
        history.replaceState(null, "", url.toString());
      }
    }

    function getInitialIssue() {
      const urlParams = new URLSearchParams(window.location.search);
      const queryIssue = urlParams.get("issue");
      if (queryIssue) {
        const formatted = queryIssue.startsWith("#") ? queryIssue : "#" + queryIssue;
        if (TOPICS.some(t => t.id === formatted)) return formatted;
      }
      const hash = window.location.hash;
      if (hash && hash.startsWith("#0") && TOPICS.some(t => t.id === hash)) {
        return hash;
      }
      return "#002";
    }

    function updateProgressBar() {
      const bar = document.getElementById("reading-progress-bar");
      if (!bar) return;

      const article = document.getElementById("view-article");
      if (!article || article.classList.contains("hidden")) {
        bar.style.width = "0%";
        return;
      }

      const rect = article.getBoundingClientRect();
      const windowHeight = window.innerHeight;
      const totalScrollable = rect.height - windowHeight;

      if (totalScrollable <= 0) {
        bar.style.width = "100%";
        return;
      }

      const scrolled = -rect.top;
      const progress = Math.min(100, Math.max(0, (scrolled / totalScrollable) * 100));
      bar.style.width = progress + "%";
    }

    window.addEventListener("scroll", updateProgressBar, { passive: true });
    window.addEventListener("resize", updateProgressBar);

    function buildOutline() {
      const outlineList = document.getElementById("outline-list");
      const headings = document.querySelectorAll("#view-article h2, #view-article h3");
      let html = "";
      headings.forEach((h, index) => {
        if(!h.id) h.id = "heading-" + index;
        const isSub = h.tagName === "H3";
        const clone = h.cloneNode(true);
        clone.querySelectorAll(".price-tag").forEach(tag => tag.remove());
        const cleanTitle = clone.textContent.trim();
        html += `<li class="outline-item ${isSub ? 'sub-item' : ''}"><a href="#${h.id}" data-target="${h.id}">${cleanTitle}</a></li>`;
      });
      outlineList.innerHTML = html;

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            document.querySelectorAll(".outline-list a").forEach(a => a.classList.remove("active"));
            const activeLink = document.querySelector(`.outline-list a[data-target="${entry.target.id}"]`);
            if (activeLink) activeLink.classList.add("active");
          }
        });
      }, { rootMargin: "-15% 0px -70% 0px" });

      headings.forEach(h => observer.observe(h));
    }

    async function loadArticle(id) {
      if (!id) id = "#002";
      activeArticleId = id;
      unpinPopover();
      
      const articleEl = document.getElementById("view-article");
      const currentTopic = TOPICS.find(t => t.id === id);

      if (currentTopic) {
        document.title = `${currentTopic.title} — Engineering Deep Dive`;
        const metaDesc = document.querySelector('meta[name="description"]');
        if (metaDesc) metaDesc.setAttribute("content", currentTopic.title);
      }

      if (articleCache[id]) {
        renderArticleContent(articleCache[id]);
        return;
      }

      articleEl.innerHTML = `
        <div style="padding: 64px 0; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--muted);">
          <div style="margin-bottom: 12px; font-size: 22px; color: var(--accent);">⌀</div>
          Loading Dispatch ${id}...
        </div>
      `;

      const num = id.replace('#', '');
      try {
        const res = await fetch(`content/issues/${num}.json`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        articleCache[id] = data;
        renderArticleContent(data);
      } catch (err) {
        console.error("Failed to fetch issue chunk:", err);
        articleEl.innerHTML = `
          <div style="padding: 48px 0; font-family: 'JetBrains Mono', monospace; color: var(--muted); font-size: 13px;">
            <p style="color: var(--accent); font-weight: 600; margin-bottom: 8px;">Error Loading Dispatch ${id}</p>
            <p>Could not retrieve static chunk <code>content/issues/${num}.json</code>. Please refresh or verify network connection.</p>
          </div>
        `;
      }
    }

    function renderArticleContent(data) {
      const articleEl = document.getElementById("view-article");
      if (data.tangents) {
        TANGENTS = { ...TANGENTS, ...data.tangents };
      }
      articleEl.innerHTML = data.article_html;

      showView("article");
      calculateReadTime();
      buildOutline();
      renderIssueNav();
      syncTelemetryUI();
      syncUrlState(data.id || activeArticleId);
      updateProgressBar();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function getTagClass(sub) {
      switch(sub) {
        case "Product Dives": return "tag-product-dives";
        case "Manufacturing": return "tag-manufacturing";
        case "Design": return "tag-design";
        case "Materials": return "tag-materials";
        case "Mechanisms": return "tag-mechanisms";
        case "Thermal": return "tag-thermal";
        case "Fluids": return "tag-fluids";
        case "Electromechanical": return "tag-electromechanical";
        default: return "";
      }
    }

    function getBtnClass(sub) {
      switch(sub) {
        case "All": return "btn-sub-all";
        case "Product Dives": return "btn-sub-product-dives";
        case "Manufacturing": return "btn-sub-manufacturing";
        case "Design": return "btn-sub-design";
        case "Materials": return "btn-sub-materials";
        case "Mechanisms": return "btn-sub-mechanisms";
        case "Thermal": return "btn-sub-thermal";
        case "Fluids": return "btn-sub-fluids";
        case "Electromechanical": return "btn-sub-electromechanical";
        default: return "";
      }
    }

    function renderSubjects() {
      const bar = document.getElementById("subjects-bar");
      if (!bar) return;
      const published = TOPICS.filter(t => t.status === "Published");
      
      bar.innerHTML = SUBJECTS.map(sub => {
        let count = 0;
        if (sub === "All") count = published.length;
        else count = published.filter(t => t.subject === sub).length;

        const isDisabled = count === 0;
        const disabledClass = isDisabled ? "disabled" : "";
        const activeClass = sub === activeSubject ? "active" : "";
        const clickAttr = isDisabled ? "" : `onclick="filterSubject('${sub}')"`;

        return `
          <button class="subject-pill ${getBtnClass(sub)} ${disabledClass} ${activeClass}" ${clickAttr} title="${count} published">
            ${sub} (${count})
          </button>
        `;
      }).join("");
    }

    function renderArchive() {
      const list = document.getElementById("archive-list");
      const published = TOPICS.filter(t => t.status === "Published");
      const filtered = activeSubject === "All" ? published : published.filter(t => t.subject === activeSubject);
      
      if(filtered.length === 0) {
        list.innerHTML = `<div style="padding:48px 0; color:var(--muted); font-family:'JetBrains Mono',monospace; font-size:13px;">No published dispatches under this subject yet.</div>`;
        return;
      }

      list.innerHTML = filtered.map(item => `
        <div class="archive-item" onclick="loadArticle('${item.id}')">
          <div class="archive-main">
            <div class="archive-title">${item.title}</div>
            <div class="archive-details">
              <span class="archive-subject-tag ${getTagClass(item.subject)}">${item.subject}</span>
            </div>
          </div>
          <div class="archive-right">
            <span style="font-weight:600; color:var(--text);">${item.id}</span>
            <span>${item.date}</span>
          </div>
        </div>
      `).join("");
    }

    function filterSubject(sub) {
      activeSubject = sub;
      renderSubjects();
      renderArchive();
    }

    function showView(view) {
      document.getElementById("view-article").classList.toggle("hidden", view !== "article");
      document.getElementById("view-archive").classList.toggle("hidden", view !== "archive");
      document.getElementById("btn-archive").classList.toggle("active", view === "archive");
      
      const grid = document.getElementById("content-grid");
      const outline = document.getElementById("sidebar-outline");
      const mainContainer = document.getElementById("main-container");

      if(view === "article") {
        outline.style.display = "block";
        grid.style.gridTemplateColumns = "240px 1fr";
        mainContainer.className = "editorial-column";
        buildOutline();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        outline.style.display = "none";
        grid.style.gridTemplateColumns = "1fr";
        mainContainer.className = "archive-column";
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
      updateProgressBar();
    }

    initTheme();
    renderSubjects();
    renderArchive();

    if (window.location.hash === "#archive") {
      showView("archive");
    } else {
      const startId = getInitialIssue();
      loadArticle(startId);
    }
  </script>
</body>
</html>
