<body>
  <div class="reading-progress-container"><div class="reading-progress-bar" id="reading-progress-bar"></div></div>

  <div id="floating-popover" class="floating-popover">
    <div class="popover-header">
      <span class="popover-tag" id="popover-tag">ENGINEERING CONCEPT</span>
      <button class="popover-close-btn" onclick="hidePopover(true)">✕</button>
    </div>
    <h4 class="popover-title" id="popover-title">Concept</h4>
    <div class="popover-body" id="popover-body"></div>
  </div>

  <div class="layout-wrapper">
    <header>
      <a class="brand-group" onclick="loadLatestArticle()">
        <div class="brand-logo">⌀</div>
        <span class="brand">Engineering Deep Dive</span>
      </a>
      <div class="nav-actions">
        <button class="nav-btn" id="btn-queue" style="display:none;" onclick="window.location.href='queue.html'">Queue</button>
        <button class="nav-btn" id="btn-current-issue" style="display:none;" onclick="loadLatestArticle()">Current Issue</button>
        <button class="nav-btn" id="btn-archive" onclick="toggleArchiveView()">Archive</button>
        <button class="theme-toggle-btn" onclick="toggleTheme()" id="theme-btn" title="Toggle Theme">
          <svg id="moon-icon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          <svg id="sun-icon" style="display:none;" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        </button>
      </div>
    </header>

    <div class="content-grid" id="content-grid">
      <!-- Desktop Left Sidebar (Only visible on Desktop in Article view) -->
      <aside class="sidebar-outline" id="sidebar-outline">
        <div class="sidebar-overview-header">OVERVIEW</div>
        <ul class="outline-list" id="outline-list"></ul>
      </aside>

      <main class="editorial-column" id="main-container">
        <!-- Article View -->
        <article id="view-article"></article>
        
        <!-- Bottom Article Navigation -->
        <nav class="issue-nav" id="issue-nav"></nav>

        <!-- Archive View (Redesigned Full-Width & Responsive) -->
        <section id="view-archive" class="hidden">
          <h1 class="archive-header-title">Archive</h1>
          <p class="archive-header-subtitle">Explore published dispatches across all 8 core engineering disciplines.</p>
          <div class="subjects-bar" id="subjects-bar"></div>
          <div id="archive-list"></div>
        </section>
      </main>
    </div>
  </div>

  <script>
    const SUBJECTS = ["All", "Product Dives", "Manufacturing", "Design", "Materials", "Mechanisms", "Thermal", "Fluids", "Electromechanical"];
    
    const TOPICS = [
      { id: "#004", subject: "Product Dives", title: "The Secret Geometry of Foldable Screens", shortTitle: "The Secret Geometry of Foldable Screens", status: "Published", date: "Oct 17, 2026" },
      { id: "#003", subject: "Manufacturing", title: "How Laptops Get Featherweight Metal Shells", shortTitle: "Featherweight Laptop Shells", status: "Published", date: "Oct 16, 2026" },
      { id: "#002", subject: "Thermal", title: "Espresso Machine Boilers: Thermoblocks vs. Dual-Boiler PID Systems", shortTitle: "Espresso Machine Boilers", status: "Published", date: "Oct 15, 2026" },
      { id: "#001", subject: "Product Dives", title: "Apple Home Hardware: HomeView Hub & The LG/Schneider Teardown", shortTitle: "Apple Home Hardware", status: "Published", date: "Oct 14, 2026" },
      { id: "#000", subject: "Mechanisms", title: "Surviving 100G Shock Loads in Cycloidal Drives", shortTitle: "Cycloidal Drives Shock Resistance", status: "Published", date: "Oct 13, 2026" }
    ];

    let TANGENTS = {};
    const articleCache = {};
    let activeArticleId = (typeof TOPICS !== "undefined" && TOPICS.length > 0) ? TOPICS[0].id : "#004";
    let activeSubject = "All";
    let telemetryScores = {};
    try {
      telemetryScores = JSON.parse(localStorage.getItem("deepdive_telemetry") || "{}");
    } catch (e) {}

    function renderMath(targetEl) {
      if (!targetEl) return;
      if (window.renderMathInElement) {
        try {
          window.renderMathInElement(targetEl, {
            delimiters: [
              { left: '$$', right: '$$', display: true },
              { left: '$', right: '$', display: false },
              { left: '\\(', right: '\\)', display: false },
              { left: '\\[', right: '\\]', display: true }
            ],
            ignoredClasses: ["price-tag", "katex-ignore", "schematic-card", "spec-table", "spec-table-wrap", "product-subnav-bar", "process-grid"],
            throwOnError: false
          });
        } catch (e) {
          console.error("KaTeX render error:", e);
        }
      } else {
        setTimeout(() => renderMath(targetEl), 100);
      }
    }

    async function loadArticle(id) {
      activeArticleId = id;
      const articleEl = document.getElementById("view-article");
      const currentTopic = TOPICS.find(t => t.id === id);
      if (currentTopic) {
        document.title = `${currentTopic.title} — Engineering Deep Dive`;
      }

      if (articleCache[id]) {
        renderArticleContent(articleCache[id]);
        return;
      }

      const num = id.replace('#', '');
      try {
        const res = await fetch(`content/issues/${num}.json`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        articleCache[id] = data;
        renderArticleContent(data);
      } catch (err) {
        console.error("Could not fetch issue chunk:", err);
        articleEl.innerHTML = `<div style="padding:48px 0; color:var(--muted); font-family:'JetBrains Mono',monospace;">Could not load dispatch ${id}.</div>`;
        showView("article");
      }
    }

    function formatTablePrices(container) {
      if (!container) return;
      container.querySelectorAll(".spec-table").forEach(table => {
        const ths = Array.from(table.querySelectorAll("th"));
        const priceColIndices = new Set();
        ths.forEach((th, idx) => {
          const txt = th.textContent.toLowerCase();
          if (txt.includes("price") || txt.includes("cost") || txt.includes("bom") || txt.includes("msrp")) {
            priceColIndices.add(idx);
          }
        });

        table.querySelectorAll("tbody tr").forEach(tr => {
          const tds = Array.from(tr.querySelectorAll("td"));
          tds.forEach((td, idx) => {
            const raw = td.textContent.trim();
            const isPriceCol = priceColIndices.has(idx);
            const looksLikePrice = /^(\$|&dollar;|USD)\s*[0-9]+(\.[0-9]{2})?(\s*(&ndash;|-|–|—|to)\s*(\$|&dollar;)?\s*[0-9]+(\.[0-9]{2})?)?(\s*(per|\/)\s*[a-zA-Z]+)?$/i.test(raw);
            
            if (isPriceCol || looksLikePrice) {
              td.classList.add("price-cell");
              if (!td.querySelector(".price-tag") && (raw.includes("$") || raw.includes("USD"))) {
                td.innerHTML = `<span class="price-tag">${td.innerHTML.trim()}</span>`;
              }
            }
          });
        });
      });
    }

    function initProcessWheels(container) {
      if (!container) return;
      const grids = Array.from(container.querySelectorAll('.process-grid'));
      grids.forEach((grid, gIdx) => {
        if (grid.dataset.wheelInitialized) return;
        const cards = Array.from(grid.querySelectorAll('.process-step-card'));
        if (cards.length < 2) return;

        grid.dataset.wheelInitialized = "true";
        const total = cards.length;
        const wheelId = `pw-${Date.now()}-${gIdx}`;

        const steps = cards.map((card, idx) => {
          const tagEl = card.querySelector('.process-step-tag');
          const titleEl = card.querySelector('.process-step-title');
          const visualEl = card.querySelector('.process-step-visual');
          const descEl = card.querySelector('.process-step-desc');
          const metricEl = card.querySelector('.process-step-metric');

          let tagText = tagEl ? tagEl.textContent.trim() : `STAGE 0${idx + 1}`;
          let shortLabel = tagText.replace(/^ST(AGE|EP)\s*\d+\s*:\s*/i, '').trim();
          if (!shortLabel || shortLabel.length > 16) {
            shortLabel = titleEl ? titleEl.textContent.trim().split(' ')[0] : `Step ${idx + 1}`;
          }

          return {
            tagHtml: tagEl ? tagEl.innerHTML : `STAGE 0${idx + 1}`,
            titleHtml: titleEl ? titleEl.innerHTML : '',
            visualHtml: visualEl ? visualEl.innerHTML : '',
            descHtml: descEl ? descEl.innerHTML : '',
            metricHtml: metricEl ? metricEl.innerHTML : '',
            shortLabel: shortLabel
          };
        });

        grid.classList.add('hidden-by-wheel');

        const viewer = document.createElement('div');
        viewer.className = 'process-wheel-viewer';
        viewer.id = wheelId;
        viewer.setAttribute('tabindex', '0');
        viewer.setAttribute('role', 'region');
        viewer.setAttribute('aria-label', 'Interactive kinematic step viewer');

        viewer.innerHTML = `
          <div class="stepper-top-bar">
            <div class="stepper-left-group">
              <div class="stepper-pills" id="pills-${wheelId}">
                ${steps.map((s, idx) => `
                  <button type="button" class="stepper-pill ${idx === 0 ? 'active' : ''}" data-idx="${idx}">
                    <span class="stepper-pill-num">0${idx + 1}</span>
                    <span class="stepper-pill-text">${s.shortLabel}</span>
                  </button>
                `).join('')}
              </div>
            </div>

            <div class="stepper-right-group">
              <span class="stepper-counter"><strong id="counter-curr-${wheelId}">01</strong> / 0${total}</span>
              <button type="button" class="stepper-nav-btn" id="prev-${wheelId}" title="Previous Stage" aria-label="Previous Stage">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
              </button>
              <button type="button" class="stepper-nav-btn" id="next-${wheelId}" title="Next Stage" aria-label="Next Stage">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
              </button>
              <button type="button" class="stepper-view-toggle" id="toggle-${wheelId}" title="Toggle between interactive view and full grid">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                <span id="toggle-label-${wheelId}">Grid</span>
              </button>
            </div>
          </div>

          <div class="stepper-stage-viewport">
            <div class="stepper-visual-large" id="vis-${wheelId}">
              ${steps[0].visualHtml}
            </div>
            <div class="stepper-details" id="det-${wheelId}">
              <div class="stepper-stage-header">
                <span class="stepper-stage-tag" id="tag-${wheelId}">${steps[0].tagHtml}</span>
              </div>
              <h4 class="stepper-stage-title" id="title-${wheelId}">${steps[0].titleHtml}</h4>
              <p class="stepper-stage-desc" id="desc-${wheelId}">${steps[0].descHtml}</p>
              <div class="stepper-stage-metric" id="metric-${wheelId}">${steps[0].metricHtml}</div>
            </div>
          </div>
        `;

        grid.parentNode.insertBefore(viewer, grid);

        let activeIdx = 0;

        function updateView(idx) {
          activeIdx = (idx + total) % total;
          const s = steps[activeIdx];

          const counterEl = document.getElementById(`counter-curr-${wheelId}`);
          if (counterEl) counterEl.textContent = `0${activeIdx + 1}`;

          const pills = viewer.querySelectorAll('.stepper-pill');
          pills.forEach((p, pIdx) => {
            if (pIdx === activeIdx) {
              p.classList.add('active');
              p.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
            } else {
              p.classList.remove('active');
            }
          });

          const visEl = document.getElementById(`vis-${wheelId}`);
          const detEl = document.getElementById(`det-${wheelId}`);
          if (visEl) {
            visEl.style.opacity = '0.35';
            visEl.style.transform = 'scale(0.98)';
            setTimeout(() => {
              visEl.innerHTML = s.visualHtml;
              visEl.style.opacity = '1';
              visEl.style.transform = 'scale(1)';
            }, 120);
          }
          if (detEl) {
            detEl.style.opacity = '0.35';
            setTimeout(() => {
              const tagEl = document.getElementById(`tag-${wheelId}`);
              const titleEl = document.getElementById(`title-${wheelId}`);
              const descEl = document.getElementById(`desc-${wheelId}`);
              const metricEl = document.getElementById(`metric-${wheelId}`);
              if (tagEl) tagEl.innerHTML = s.tagHtml;
              if (titleEl) titleEl.innerHTML = s.titleHtml;
              if (descEl) descEl.innerHTML = s.descHtml;
              if (metricEl) {
                metricEl.innerHTML = s.metricHtml;
                if (typeof renderMathInElement === 'function') {
                  renderMathInElement(metricEl, {
                    delimiters: [
                      { left: "$$", right: "$$", display: true },
                      { left: "$", right: "$", display: false }
                    ],
                    throwOnError: false
                  });
                }
              }
              detEl.style.opacity = '1';
            }, 120);
          }
        }

        const prevBtn = document.getElementById(`prev-${wheelId}`);
        if (prevBtn) prevBtn.addEventListener('click', () => updateView(activeIdx - 1));

        const nextBtn = document.getElementById(`next-${wheelId}`);
        if (nextBtn) nextBtn.addEventListener('click', () => updateView(activeIdx + 1));

        const pillsContainer = document.getElementById(`pills-${wheelId}`);
        if (pillsContainer) {
          pillsContainer.addEventListener('click', (e) => {
            const btn = e.target.closest('.stepper-pill');
            if (btn && btn.dataset.idx !== undefined) {
              updateView(parseInt(btn.dataset.idx, 10));
            }
          });
        }

        const toggleBtn = document.getElementById(`toggle-${wheelId}`);
        const toggleLabel = document.getElementById(`toggle-label-${wheelId}`);
        let inGridView = false;
        if (toggleBtn) {
          toggleBtn.addEventListener('click', () => {
            inGridView = !inGridView;
            if (inGridView) {
              grid.classList.remove('hidden-by-wheel');
              const vp = viewer.querySelector('.stepper-stage-viewport');
              if (vp) vp.style.display = 'none';
              if (toggleLabel) toggleLabel.textContent = 'Steps';
            } else {
              grid.classList.add('hidden-by-wheel');
              const vp = viewer.querySelector('.stepper-stage-viewport');
              if (vp) vp.style.display = 'grid';
              if (toggleLabel) toggleLabel.textContent = 'Grid';
            }
          });
        }

        viewer.addEventListener('keydown', (e) => {
          if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
            e.preventDefault();
            updateView(activeIdx + 1);
          } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
            e.preventDefault();
            updateView(activeIdx - 1);
          }
        });

        let touchStartX = 0;
        const visEl = document.getElementById(`vis-${wheelId}`);
        if (visEl) {
          visEl.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
          }, { passive: true });
          visEl.addEventListener('touchend', (e) => {
            const touchEndX = e.changedTouches[0].clientX;
            const diffX = touchEndX - touchStartX;
            if (Math.abs(diffX) > 40) {
              if (diffX < 0) updateView(activeIdx + 1);
              else updateView(activeIdx - 1);
            }
          }, { passive: true });
        }
      });
    }

    function renderArticleContent(data) {
      const articleEl = document.getElementById("view-article");
      if (data.tangents) {
        TANGENTS = { ...TANGENTS, ...data.tangents };
      }

      let html = data.article_html || '';

      // Defensive Fallback 1: Ensure metadata header (meta-line, h1, subtitle) is present
      if (!html.includes('class="meta-line"') && data.title) {
        const subSlug = (data.subject || 'Hardware').toLowerCase().replace(/[^a-z0-9]+/g, '-');
        html = `
<div class="meta-line">
  <span>ISSUE ${data.id || ''}</span><span>•</span><span class="archive-subject-tag sub-${subSlug}">${(data.subject || '').toUpperCase()}</span><span>•</span><span id="read-time-badge">14 MIN READ</span>
</div>

<h1>${data.title}</h1>
<p class="subtitle">
  ${data.subtitle || ''}
</p>
` + html;
      }

      // Defensive Fallback 2: Ensure product-figure has .img-wrapper
      html = html.replace(/(<figure class="product-figure">\s*)(<img\b[^>]*>)/gi, (m, pre, img) => {
        return `${pre}<div class="img-wrapper">\n    ${img}\n  </div>`;
      });

      // Defensive Fallback 3: Ensure schematic-card wraps svg in .schematic-viewport
      html = html.replace(/(<div class="schematic-card"[^>]*>[\s\S]*?<\/div>\s*)(<svg\b[\s\S]*?<\/svg>)/gi, (m, header, svg) => {
        if (!m.includes('class="schematic-viewport"')) {
          return `${header}<div class="schematic-viewport">\n    ${svg}\n  </div>`;
        }
        return m;
      });

      // Defensive Fallback 4: Ensure telemetry-bar is present
      if (!html.includes('class="telemetry-bar"')) {
        html += `
<div class="telemetry-bar">
  <div class="telemetry-info">
    <span class="telemetry-title">Background Quality Telemetry</span>
    <span class="telemetry-desc">Rate this topic to train the automated curation model for future dispatches.</span>
  </div>
  <div class="telemetry-actions">
    <button class="score-btn" id="telemetry-up" onclick="recordTelemetry('up')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path></svg>
      Good Topic
    </button>
    <button class="score-btn" id="telemetry-down" onclick="recordTelemetry('down')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h3a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-3"></path></svg>
      Poor Topic
    </button>
  </div>
</div>
`;
      }

      articleEl.innerHTML = html;
      formatTablePrices(articleEl);
      initProcessWheels(articleEl);
      renderMath(articleEl);
      showView("article");
      buildOutline();
      renderIssueNav();
      syncTelemetryUI();
      attachTangentListeners();
    }

    function renderIssueNav() {
      const navEl = document.getElementById("issue-nav");
      if (!navEl) return;
      const published = TOPICS.filter(t => t.status === "Published");
      const currentIndex = published.findIndex(t => t.id === activeArticleId);
      if (currentIndex === -1) {
        navEl.innerHTML = "";
        return;
      }
      
      const prevTopic = published[currentIndex + 1];
      const nextTopic = published[currentIndex - 1];

      const prevHtml = prevTopic ? `
        <button class="issue-nav-btn" onclick="loadArticle('${prevTopic.id}')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          <span><strong>Previous:</strong> ${prevTopic.shortTitle || prevTopic.title}</span>
        </button>
      ` : `<div class="issue-nav-btn disabled"><span>Beginning of Archive</span></div>`;

      const nextHtml = nextTopic ? `
        <button class="issue-nav-btn" onclick="loadArticle('${nextTopic.id}')">
          <span><strong>Next:</strong> ${nextTopic.shortTitle || nextTopic.title}</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      ` : `<div class="issue-nav-btn disabled"><span>Latest Dispatch</span></div>`;

      navEl.innerHTML = prevHtml + nextHtml;
    }

    function recordTelemetry(score) {
      telemetryScores[activeArticleId] = score;
      try {
        localStorage.setItem("deepdive_telemetry", JSON.stringify(telemetryScores));
      } catch (e) {}
      const upBtn = document.getElementById("telemetry-up");
      const downBtn = document.getElementById("telemetry-down");
      if (upBtn && downBtn) {
        upBtn.classList.toggle("active", score === "up");
        downBtn.classList.toggle("active", score === "down");
      }
    }

    function syncTelemetryUI() {
      const score = telemetryScores[activeArticleId];
      const upBtn = document.getElementById("telemetry-up");
      const downBtn = document.getElementById("telemetry-down");
      if (upBtn && downBtn) {
        upBtn.classList.toggle("active", score === "up");
        downBtn.classList.toggle("active", score === "down");
      }
    }

    let activeScrollSpyHandler = null;

    function buildOutline() {
      const isDesktop = window.innerWidth > 768;
      const list = document.getElementById("outline-list");
      if (!list) return;
      list.innerHTML = "";

      if (activeScrollSpyHandler) {
        window.removeEventListener("scroll", activeScrollSpyHandler);
        activeScrollSpyHandler = null;
      }

      if (!isDesktop) return;
      
      const articleEl = document.getElementById("view-article");
      if (!articleEl) return;

      // Select all h2 and h3 headings in reading order
      const allHeadings = articleEl.querySelectorAll("h2, h3");
      if (!allHeadings.length) return;

      const trackedHeadings = [];
      let currentH2Li = null;
      let currentSubList = null;
      let h2Index = 0;
      let h3Index = 0;

      allHeadings.forEach(heading => {
        const isH2 = heading.tagName.toLowerCase() === "h2";
        if (!heading.id) {
          heading.id = isH2 ? `section-${h2Index++}` : `subsection-${h3Index++}`;
        }
        trackedHeadings.push(heading);

        // Clean text: strip price tags, nested spans, or trailing prices for concise overview display
        let titleText = heading.cloneNode(true);
        titleText.querySelectorAll(".price-tag").forEach(p => p.remove());
        let cleanTitle = titleText.textContent.replace(/<[^>]+>/g, '').trim();

        if (isH2) {
          currentH2Li = document.createElement("li");
          currentH2Li.className = "outline-item";
          currentH2Li.innerHTML = `<a class="outline-link" href="#${heading.id}" data-target="${heading.id}">${cleanTitle}</a>`;
          list.appendChild(currentH2Li);
          currentSubList = null; // reset sublist for new h2
        } else {
          // If no preceding h2 was found, attach directly to list
          if (!currentH2Li) {
            currentH2Li = document.createElement("li");
            currentH2Li.className = "outline-item";
            list.appendChild(currentH2Li);
          }
          if (!currentSubList) {
            currentSubList = document.createElement("ul");
            currentSubList.className = "outline-sublist";
            currentH2Li.appendChild(currentSubList);
          }
          const subLi = document.createElement("li");
          subLi.className = "outline-subitem";
          subLi.innerHTML = `<a class="outline-sublink" href="#${heading.id}" data-target="${heading.id}">${cleanTitle}</a>`;
          currentSubList.appendChild(subLi);
        }
      });

      // Smooth scroll navigation with header offset compensation for both h2 and h3
      list.querySelectorAll(".outline-link, .outline-sublink").forEach(link => {
        link.addEventListener("click", (e) => {
          e.preventDefault();
          const targetId = link.getAttribute("data-target");
          const targetEl = document.getElementById(targetId);
          if (targetEl) {
            const offset = 48;
            const elementPosition = targetEl.getBoundingClientRect().top + window.pageYOffset;
            window.scrollTo({
              top: elementPosition - offset,
              behavior: "smooth"
            });
            history.replaceState(null, "", `${activeArticleId}/${targetId}`);
          }
        });
      });

      // ScrollSpy: Real-time active section tracking as the user scrolls
      activeScrollSpyHandler = () => {
        const scrollPos = window.scrollY + 120;
        const links = list.querySelectorAll(".outline-link, .outline-sublink");
        let activeId = trackedHeadings[0]?.id;

        trackedHeadings.forEach(h => {
          if (h.offsetTop <= scrollPos) {
            activeId = h.id;
          }
        });

        links.forEach(l => {
          if (l.getAttribute("data-target") === activeId) {
            l.classList.add("active");
          } else {
            l.classList.remove("active");
          }
        });
      };

      window.addEventListener("scroll", activeScrollSpyHandler, { passive: true });
      activeScrollSpyHandler();
    }

    let activePopoverTerm = null;
    let popoverHideTimer = null;

    function attachTangentListeners() {
      const popover = document.getElementById('floating-popover');
      
      // Allow user to move cursor onto popover without it vanishing immediately
      if (popover && !popover.dataset.hoverWired) {
        popover.dataset.hoverWired = "true";
        popover.addEventListener('mouseenter', () => {
          if (popoverHideTimer) {
            clearTimeout(popoverHideTimer);
            popoverHideTimer = null;
          }
        });
        popover.addEventListener('mouseleave', () => {
          popoverHideTimer = setTimeout(() => {
            hidePopover(true);
          }, 150);
        });
      }

      document.querySelectorAll(".tangent-term").forEach(el => {
        el.addEventListener("mouseenter", () => {
          if (popoverHideTimer) {
            clearTimeout(popoverHideTimer);
            popoverHideTimer = null;
          }
          activePopoverTerm = el;
          showPopover(el, el.getAttribute("data-tangent"));
        });

        el.addEventListener("mouseleave", () => {
          // Grace delay allowing user to bridge into popover if needed, otherwise dismiss
          popoverHideTimer = setTimeout(() => {
            hidePopover(true);
          }, 240);
        });

        el.addEventListener("click", (e) => {
          e.preventDefault();
          showPopover(el, el.getAttribute("data-tangent"));
        });
      });
    }

    function showPopover(termElement, key) {
      const data = TANGENTS[key];
      if (!data) return;

      const popover = document.getElementById('floating-popover');
      if (!popover) return;

      document.getElementById('popover-tag').textContent = data.tag;
      document.getElementById('popover-title').textContent = data.title;
      const bodyEl = document.getElementById('popover-body');
      bodyEl.innerHTML = data.body;
      renderMath(bodyEl);

      // Measure true rendered dimensions invisibly off-screen to prevent layout flashes
      popover.style.display = 'block';
      popover.style.visibility = 'hidden';
      popover.style.maxHeight = 'none';
      popover.style.top = '0px';
      popover.style.left = '0px';

      const rect = termElement.getBoundingClientRect();
      const popoverRect = popover.getBoundingClientRect();
      const popoverHeight = popoverRect.height;
      const popoverWidth = popoverRect.width || 380;

      const viewportHeight = window.innerHeight;
      const viewportWidth = window.innerWidth;
      const GAP = 10; // Strict exclusion buffer between cursor/word and popover card
      const SCREEN_PADDING = 14;

      const spaceBelow = viewportHeight - rect.bottom - GAP - SCREEN_PADDING;
      const spaceAbove = rect.top - GAP - SCREEN_PADDING;

      let top = 0;
      let maxHeight = 0;

      // Smart placement: strictly above or strictly below, never intersecting the word/cursor
      if (spaceBelow >= popoverHeight) {
        // Fits comfortably below
        top = rect.bottom + GAP;
        maxHeight = spaceBelow;
      } else if (spaceAbove >= popoverHeight) {
        // Fits comfortably above
        top = rect.top - popoverHeight - GAP;
        maxHeight = spaceAbove;
      } else if (spaceBelow >= spaceAbove) {
        // Limited height, but more room below
        top = rect.bottom + GAP;
        maxHeight = Math.max(140, spaceBelow);
      } else {
        // Limited height, but more room above
        const clampedHeight = Math.min(popoverHeight, spaceAbove);
        top = rect.top - clampedHeight - GAP;
        maxHeight = Math.max(140, spaceAbove);
      }

      // Horizontal alignment: align with left edge of term, clamped inside screen bounds
      let left = rect.left;
      const maxLeft = viewportWidth - popoverWidth - SCREEN_PADDING;
      left = Math.max(SCREEN_PADDING, Math.min(left, maxLeft));

      popover.style.maxHeight = `${Math.floor(maxHeight)}px`;
      popover.style.top = `${Math.round(top)}px`;
      popover.style.left = `${Math.round(left)}px`;
      popover.style.visibility = 'visible';
    }

    function hidePopover(force = false) {
      if (popoverHideTimer) {
        clearTimeout(popoverHideTimer);
        popoverHideTimer = null;
      }
      const popover = document.getElementById('floating-popover');
      if (popover) {
        popover.style.display = 'none';
        popover.style.visibility = 'hidden';
      }
      activePopoverTerm = null;
    }

    document.addEventListener("click", (e) => {
      if (!e.target.closest('#floating-popover') && !e.target.closest('.tangent-term')) {
        hidePopover(true);
      }
    });

    window.addEventListener("scroll", () => {
      if (activePopoverTerm && !document.getElementById('floating-popover')?.matches(':hover')) {
        hidePopover(true);
      }
    }, { passive: true });

    window.addEventListener("resize", () => {
      hidePopover(true);
    }, { passive: true });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        hidePopover(true);
      }
    });

        

    function toggleArchiveView() {
      const isCurrentlyArchive = !document.getElementById("view-archive").classList.contains("hidden");
      showView(isCurrentlyArchive ? "article" : "archive");
    }

    function showView(view) {
      const isArchive = view === "archive";
      const grid = document.getElementById("content-grid");
      const articleView = document.getElementById("view-article");
      const archiveView = document.getElementById("view-archive");
      const btnArchive = document.getElementById("btn-archive");
      const btnCurrent = document.getElementById("btn-current-issue");
      const outline = document.getElementById("sidebar-outline");
      const issueNav = document.getElementById("issue-nav");

      articleView.classList.toggle("hidden", isArchive);
      archiveView.classList.toggle("hidden", !isArchive);

      const latestId = (typeof TOPICS !== "undefined" && TOPICS.length > 0) ? TOPICS[0].id : null;

      if (isArchive) {
        if (window.location.hash !== "#archive") history.replaceState(null, "", "#archive");
        if (grid) grid.classList.add("archive-mode");
        if (btnArchive) {
          btnArchive.classList.add("active");
          btnArchive.textContent = "Close Archive";
        }
        if (btnCurrent) {
          btnCurrent.style.display = "inline-flex";
        }
        if (outline) outline.style.display = "none";
        if (issueNav) issueNav.style.display = "none";
        renderSubjects();
        renderArchive();
      } else {
        if (activeArticleId && window.location.hash !== activeArticleId) history.replaceState(null, "", activeArticleId);
        if (grid) grid.classList.remove("archive-mode");
        if (btnArchive) {
          btnArchive.classList.remove("active");
          btnArchive.textContent = "Archive";
        }
        if (btnCurrent) {
          const isOlderArticle = activeArticleId && latestId && activeArticleId !== latestId;
          btnCurrent.style.display = isOlderArticle ? "inline-flex" : "none";
        }
        const isDesktop = window.innerWidth > 768;
        if (outline) outline.style.display = isDesktop ? "block" : "none";
        if (issueNav) issueNav.style.display = "flex";
      }

      window.scrollTo(0, 0);
    }

    function getSubClass(sub) {
      switch(sub) {
        case "All": return "sub-all";
        case "Product Dives": return "sub-product-dives";
        case "Manufacturing": return "sub-manufacturing";
        case "Thermal": return "sub-thermal";
        case "Electromechanical": return "sub-electromechanical";
        case "Design": return "sub-design";
        case "Materials": return "sub-materials";
        case "Mechanisms": return "sub-mechanisms";
        case "Fluids": return "sub-fluids";
        default: return "sub-all";
      }
    }

    function renderSubjects() {
      const bar = document.getElementById("subjects-bar");
      if (!bar) return;
      const published = TOPICS.filter(t => t.status === "Published");
      
      bar.innerHTML = SUBJECTS.map(sub => {
        const count = (sub === "All") 
          ? published.length 
          : published.filter(t => t.subject === sub).length;
        const isActive = sub === activeSubject;
        const isDisabled = count === 0;
        const subClass = getSubClass(sub);

        return `
          <button class="subject-pill ${subClass} ${isActive ? 'active' : ''} ${isDisabled ? 'disabled' : ''}" 
                  ${isDisabled ? 'disabled' : `onclick="filterSubject('${sub}')"`}
                  title="${count} published">
            <span>${sub}</span>
            <span style="opacity: 0.85;">(${count})</span>
          </button>
        `;
      }).join("");
    }

    function filterSubject(sub) {
      activeSubject = sub;
      renderSubjects();
      renderArchive();
    }

    function renderArchive() {
      const list = document.getElementById("archive-list");
      if (!list) return;
      const published = TOPICS.filter(t => t.status === "Published");
      const filtered = (activeSubject === "All") 
        ? published 
        : published.filter(t => t.subject === activeSubject);

      if (filtered.length === 0) {
        list.innerHTML = `<div style="padding: 40px 0; color: var(--muted); font-family: 'JetBrains Mono', monospace; font-size: 13px;">No published dispatches in this discipline yet.</div>`;
        return;
      }

      list.innerHTML = filtered.map(item => `
        <div class="archive-item" onclick="loadArticle('${item.id}')">
          <div class="archive-main">
            <div class="archive-meta">
              <span class="archive-id">${item.id}</span>
              <span class="archive-subject-tag ${getSubClass(item.subject)}">${item.subject}</span>
              <span class="archive-date">${item.date}</span>
            </div>
            <h3 class="archive-title">${item.title}</h3>
          </div>
          <div class="archive-arrow">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </div>
        </div>
      `).join("");
    }

    function toggleTheme() {
      const isDark = document.documentElement.getAttribute("data-theme") === "dark";
      document.documentElement.setAttribute("data-theme", isDark ? "light" : "dark");
      document.getElementById("moon-icon").style.display = isDark ? "block" : "none";
      document.getElementById("sun-icon").style.display = isDark ? "none" : "block";
    }

    window.addEventListener("scroll", () => {
      const docHeight = document.documentElement.scrollHeight - window.innerHeight;
      const progress = docHeight > 0 ? (window.scrollY / docHeight) * 100 : 0;
      document.getElementById("reading-progress-bar").style.width = `${progress}%`;
    });

    function loadLatestArticle() {
      if (TOPICS && TOPICS.length > 0) {
        loadArticle(TOPICS[0].id);
      }
    }

    // Author Queue Access (only visible to author via ?author=1 or Ctrl+Shift+Q)
    function checkQueueAccess() {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.has("author") || urlParams.has("admin") || urlParams.has("queue") || urlParams.has("review")) {
        localStorage.setItem("deepdive_author", "1");
      }
      if (localStorage.getItem("deepdive_author") === "1") {
        const btnQueue = document.getElementById("btn-queue");
        if (btnQueue) btnQueue.style.display = "inline-flex";
      }
    }
    checkQueueAccess();

    window.addEventListener("keydown", (e) => {
      if ((e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "q") || (e.altKey && e.key.toLowerCase() === "q")) {
        const isAuth = localStorage.getItem("deepdive_author") === "1";
        if (isAuth) {
          localStorage.removeItem("deepdive_author");
          const btnQueue = document.getElementById("btn-queue");
          if (btnQueue) btnQueue.style.display = "none";
        } else {
          localStorage.setItem("deepdive_author", "1");
          const btnQueue = document.getElementById("btn-queue");
          if (btnQueue) btnQueue.style.display = "inline-flex";
        }
      }
    });

    window.addEventListener("hashchange", () => {
      const currentHash = window.location.hash;
      if (currentHash === "#archive") {
        showView("archive");
      } else {
        const articleId = currentHash.split('/')[0];
        if (TOPICS.some(t => t.id === articleId) && articleId !== activeArticleId) {
          loadArticle(articleId);
        }
      }
    });

    let resizeTimer = null;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        const articleView = document.getElementById("view-article");
        if (articleView && !articleView.classList.contains("hidden")) {
          buildOutline();
        }
      }, 150);
    });

    // Check if initial hash is #archive or a specific issue (e.g. #001, #002)
    const initHash = window.location.hash;
    const initialArticleId = initHash.split('/')[0];
    if (initHash === "#archive") {
      showView("archive");
    } else if (TOPICS.some(t => t.id === initialArticleId)) {
      loadArticle(initialArticleId).then(() => {
        if (initHash.includes('/')) {
          const sectionId = initHash.split('/')[1];
          const targetEl = document.getElementById(sectionId);
          if (targetEl) {
            setTimeout(() => {
              const offset = 48;
              const elementPosition = targetEl.getBoundingClientRect().top + window.pageYOffset;
              window.scrollTo({ top: elementPosition - offset, behavior: "smooth" });
            }, 100);
          }
        }
      });
    } else {
      loadLatestArticle();
    }
  </script>
</body>
</html>
