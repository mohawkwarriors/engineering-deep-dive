<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Engineering Deep Dive — Archive</title>
  <!-- Diameter Symbol Favicon (Data URI) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23D97757%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><circle cx=%2212%22 cy=%2212%22 r=%228%22/><line x1=%225.5%22 y1=%2218.5%22 x2=%2218.5%22 y2=%225.5%22/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F9F8F6;
      --surface: #EFECE6;
      --surface-hover: #E4E0D8;
      --text: #191918;
      --muted: #6B6960;
      --border: #D8D4CC;
      --accent: #D97757;
      --accent-hover: #C56645;
      --max-w: 1080px;

      /* Subject Tag Colors (Light Mode) */
      --sub-product-dives: #D97757;
      --sub-manufacturing: #2563EB;
      --sub-design: #7C3AED;
      --sub-materials: #059669;
      --sub-mechanisms: #D97706;
      --sub-thermal: #E11D48;
      --sub-fluids: #0891B2;
      --sub-electromechanical: #4F46E5;
    }
    [data-theme="dark"] {
      --bg: #191918;
      --surface: #232220;
      --surface-hover: #2E2D2A;
      --text: #EDEDEB;
      --muted: #9E9C94;
      --border: #383734;
      --accent: #D97757;
      --accent-hover: #E88868;

      /* Subject Tag Colors (Dark Mode) */
      --sub-product-dives: #E88868;
      --sub-manufacturing: #3B82F6;
      --sub-design: #8B5CF6;
      --sub-materials: #10B981;
      --sub-mechanisms: #F59E0B;
      --sub-thermal: #F43F5E;
      --sub-fluids: #06B6D4;
      --sub-electromechanical: #6366F1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      scroll-behavior: smooth;
      overflow-x: clip;
      max-width: 100%;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.74;
      font-size: 16.5px;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.2s ease, color 0.2s ease;
      overflow-x: clip;
      max-width: 100%;
      width: 100%;
    }
    .layout-wrapper {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 0 24px 104px;
      width: 100%;
      box-sizing: border-box;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 28px 0; border-bottom: 1px solid var(--border); margin-bottom: 44px;
    }
    .brand-group {
      display: flex; align-items: center; gap: 12px; text-decoration: none; cursor: pointer;
    }
    .brand-logo {
      width: 34px; height: 34px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 6px; display: flex; align-items: center; justify-content: center;
      color: var(--accent); transition: border-color 0.15s; font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 600;
      flex-shrink: 0;
    }
    .brand-group:hover .brand-logo { border-color: var(--accent); }
    .brand {
      font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500;
      letter-spacing: 0.06em; text-transform: uppercase; color: var(--text); text-decoration: none;
    }
    .nav-actions { display: flex; gap: 20px; align-items: center; }
    .nav-btn {
      background: none; border: none; font-family: 'JetBrains Mono', monospace;
      font-size: 12px; color: var(--muted); cursor: pointer; padding: 4px 0; transition: color 0.15s;
    }
    .nav-btn:hover, .nav-btn.active { color: var(--text); font-weight: 600; }
    .theme-toggle-btn {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      width: 34px; height: 34px; border-radius: 6px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background 0.15s, border-color 0.15s; flex-shrink: 0;
    }
    .theme-toggle-btn:hover { background: var(--surface-hover); border-color: var(--muted); }
    .theme-toggle-btn svg { width: 16px; height: 16px; fill: currentColor; }

    /* Desktop Grid: Sticky Left Rail Navigation */
    .content-grid {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 56px;
      align-items: flex-start;
      width: 100%;
      min-width: 0;
      position: relative;
    }

    .sidebar-outline {
      position: sticky;
      top: 28px;
      max-height: calc(100vh - 56px);
      overflow-y: auto;
      padding-right: 16px;
      border-right: 1px solid var(--border);
      display: block;
      -webkit-overflow-scrolling: touch;
    }
    .outline-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .outline-item a {
      font-size: 13.5px;
      color: var(--muted);
      text-decoration: none;
      display: block;
      line-height: 1.45;
      transition: color 0.15s, border-color 0.15s;
      border-left: 2px solid transparent;
      padding-left: 10px;
    }
    .outline-item a:hover { color: var(--text); }
    .outline-item a.active {
      color: var(--accent);
      border-left-color: var(--accent);
      font-weight: 500;
    }
    .outline-item.sub-item a { padding-left: 22px; font-size: 12.5px; }

    /* Columns with Grid Containment */
    .editorial-column {
      max-width: 740px;
      width: 100%;
      min-width: 0;
    }
    .archive-column {
      max-width: 100%;
      width: 100%;
      min-width: 0;
      grid-column: 1 / -1;
    }

    #view-article {
      min-width: 0;
      width: 100%;
    }

    .subjects-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 36px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
    .subject-pill {
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
      font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 6px 12px; border-radius: 4px; cursor: pointer; transition: all 0.15s ease;
    }
    .subject-pill:hover { opacity: 0.85; transform: translateY(-1px); }
    .subject-pill.active { box-shadow: 0 0 0 1px var(--text); }

    /* Filter Button Colors */
    .btn-sub-all { background: var(--surface); color: var(--text); border-color: var(--border); }
    .btn-sub-all.active { background: var(--text); color: var(--bg); border-color: var(--text); }
    .btn-sub-product-dives { background: rgba(217, 119, 87, 0.1); color: var(--sub-product-dives); border-color: rgba(217, 119, 87, 0.35); }
    .btn-sub-product-dives.active { background: var(--sub-product-dives); color: #FFF; border-color: var(--sub-product-dives); }
    .btn-sub-manufacturing { background: rgba(37, 99, 235, 0.1); color: var(--sub-manufacturing); border-color: rgba(37, 99, 235, 0.35); }
    .btn-sub-manufacturing.active { background: var(--sub-manufacturing); color: #FFF; border-color: var(--sub-manufacturing); }
    .btn-sub-design { background: rgba(124, 58, 237, 0.1); color: var(--sub-design); border-color: rgba(124, 58, 237, 0.35); }
    .btn-sub-design.active { background: var(--sub-design); color: #FFF; border-color: var(--sub-design); }
    .btn-sub-materials { background: rgba(5, 150, 105, 0.1); color: var(--sub-materials); border-color: rgba(5, 150, 105, 0.35); }
    .btn-sub-materials.active { background: var(--sub-materials); color: #FFF; border-color: var(--sub-materials); }
    .btn-sub-mechanisms { background: rgba(217, 119, 6, 0.1); color: var(--sub-mechanisms); border-color: rgba(217, 119, 6, 0.35); }
    .btn-sub-mechanisms.active { background: var(--sub-mechanisms); color: #FFF; border-color: var(--sub-mechanisms); }
    .btn-sub-thermal { background: rgba(225, 29, 72, 0.1); color: var(--sub-thermal); border-color: rgba(225, 29, 72, 0.35); }
    .btn-sub-thermal.active { background: var(--sub-thermal); color: #FFF; border-color: var(--sub-thermal); }
    .btn-sub-fluids { background: rgba(8, 145, 178, 0.1); color: var(--sub-fluids); border-color: rgba(8, 145, 178, 0.35); }
    .btn-sub-fluids.active { background: var(--sub-fluids); color: #FFF; border-color: var(--sub-fluids); }
    .btn-sub-electromechanical { background: rgba(79, 70, 229, 0.1); color: var(--sub-electromechanical); border-color: rgba(79, 70, 229, 0.35); }
    .btn-sub-electromechanical.active { background: var(--sub-electromechanical); color: #FFF; border-color: var(--sub-electromechanical); }

    /* Metadata Bar */
    .meta-line {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    /* Article Main Title */
    h1 {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 46px;
      font-weight: 400;
      line-height: 1.12;
      letter-spacing: -0.01em;
      margin-bottom: 20px;
      word-break: break-word;
      overflow-wrap: break-word;
    }

    /* Editorial Subtitle / Opening Hook (High Contrast Pullout) */
    .subtitle {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 19.5px;
      color: var(--text);
      line-height: 1.52;
      margin-bottom: 38px;
      font-weight: 400;
      padding: 10px 16px 10px 18px;
      border-left: 3px solid var(--accent);
      background: linear-gradient(90deg, rgba(217, 119, 87, 0.07) 0%, transparent 100%);
      border-radius: 0 4px 4px 0;
      word-break: break-word;
      overflow-wrap: break-word;
    }

    /* Major Section Titles (H2) */
    h2 {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 34px;
      font-weight: 600;
      margin: 64px 0 20px;
      line-height: 1.18;
      letter-spacing: -0.01em;
      color: var(--text);
      border-top: 2px solid var(--border);
      padding-top: 36px;
      position: relative;
      scroll-margin-top: 56px;
      word-break: break-word;
      overflow-wrap: break-word;
    }
    h2::before {
      content: "";
      position: absolute;
      top: -2px;
      left: 0;
      width: 48px;
      height: 2px;
      background: var(--accent);
    }

    /* Section Lead Paragraph */
    h2 + p {
      font-size: 17.5px;
      line-height: 1.72;
      color: var(--text);
      margin-bottom: 22px;
    }

    /* Product Subheadings & Subsections (H3) */
    h3 {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 21px;
      font-weight: 700;
      margin: 44px 0 14px;
      letter-spacing: -0.015em;
      line-height: 1.3;
      padding-left: 12px;
      border-left: 3px solid var(--accent);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 10px;
      scroll-margin-top: 56px;
    }

    /* Product Price Tag Badge */
    .price-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      color: var(--accent);
      font-weight: 600;
      letter-spacing: 0.02em;
      background: var(--surface);
      padding: 3px 9px;
      border-radius: 4px;
      border: 1px solid rgba(217, 119, 87, 0.3);
      white-space: nowrap;
    }

    p { margin-bottom: 20px; word-break: break-word; overflow-wrap: break-word; }
    ul { margin: 0 0 24px 22px; }
    li { margin-bottom: 12px; word-break: break-word; overflow-wrap: break-word; }
    strong { font-weight: 600; }

    /* Interactive Deep-Dive Tangent Triggers */
    .tangent-term {
      border-bottom: 1.5px dotted var(--accent);
      color: var(--text);
      cursor: pointer;
      font-weight: 500;
      position: relative;
      transition: background-color 0.15s, color 0.15s;
      padding: 1px 3px;
      border-radius: 3px;
    }
    .tangent-term:hover, .tangent-term.active-hover {
      background-color: var(--surface);
      color: var(--accent);
    }

    /* Floating Hover Popover (Desktop) */
    .floating-popover {
      position: fixed;
      z-index: 2000;
      max-width: 380px;
      width: calc(100vw - 32px);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.16), 0 2px 8px rgba(0, 0, 0, 0.08);
      padding: 16px 20px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(6px);
      transition: opacity 0.18s cubic-bezier(0.16, 1, 0.3, 1), transform 0.18s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .floating-popover.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }
    .floating-popover.pinned {
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.22), 0 0 0 1.5px var(--accent);
    }
    .popover-arrow {
      position: absolute;
      width: 12px;
      height: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      transform: rotate(45deg);
      z-index: -1;
    }
    .floating-popover.arrow-bottom .popover-arrow {
      bottom: -7px;
      border-top: none;
      border-left: none;
    }
    .floating-popover.arrow-top .popover-arrow {
      top: -7px;
      border-bottom: none;
      border-right: none;
    }
    .popover-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }
    .popover-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent);
      font-weight: 600;
    }
    .popover-close-btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 15px;
      padding: 2px 6px;
      line-height: 1;
      display: none;
    }
    .floating-popover.pinned .popover-close-btn { display: block; }
    .popover-close-btn:hover { color: var(--text); }
    .popover-title {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 21px;
      font-weight: 400;
      margin-bottom: 8px;
      line-height: 1.25;
      color: var(--text);
    }
    .popover-body {
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--text);
    }
    .popover-body p { margin-bottom: 8px; }
    .popover-body p:last-child { margin-bottom: 0; }
    .popover-body .modal-equation-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 8px 12px;
      margin: 10px 0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      line-height: 1.45;
      color: var(--text);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      word-break: break-word;
    }
    .popover-footer {
      margin-top: 10px;
      padding-top: 6px;
      border-top: 1px solid var(--border);
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .callout-box { background: var(--surface); border-left: 3px solid var(--accent); padding: 18px 22px; margin: 28px 0; font-size: 15.5px; border-radius: 0 6px 6px 0; max-width: 100%; word-break: break-word; }
    .callout-title { font-family: 'JetBrains Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); margin-bottom: 6px; font-weight: 500; }

    figure.product-figure { margin: 38px 0; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; background: var(--surface); max-width: 100%; }
    .img-wrapper { position: relative; width: 100%; aspect-ratio: 16 / 10; overflow: hidden; background: #141413; }
    .img-wrapper img { width: 100%; height: 100%; object-fit: cover; display: block; }
    figcaption { padding: 14px 18px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); line-height: 1.5; display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
    .source-tag { white-space: nowrap; font-size: 11px; opacity: 0.85; }

    /* Specification Table: Isolated Horizontal Scroll Container */
    .spec-table-wrap {
      width: 100%;
      max-width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin: 28px 0 36px;
      border: 1px solid var(--border);
      border-radius: 6px;
      display: block;
      position: relative;
    }
    .spec-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      min-width: 620px;
      table-layout: auto;
    }
    .spec-table th, .spec-table td {
      text-align: left;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
      white-space: normal;
    }
    .spec-table tr:last-child td { border-bottom: none; }
    .spec-table th { font-family: 'JetBrains Mono', monospace; font-size: 11px; text-transform: uppercase; color: var(--muted); font-weight: 500; background: var(--surface); }

    .telemetry-bar { display: flex; justify-content: space-between; align-items: center; background: var(--surface); border: 1px solid var(--border); padding: 16px 20px; border-radius: 6px; margin: 48px 0 24px; font-size: 13.5px; flex-wrap: wrap; gap: 12px; }
    .telemetry-info { display: flex; flex-direction: column; gap: 2px; }
    .telemetry-title { font-weight: 600; font-family: 'JetBrains Mono', monospace; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
    .telemetry-desc { color: var(--muted); font-size: 13px; }
    .telemetry-actions { display: flex; gap: 10px; }
    .score-btn { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 6px 14px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.15s ease; }
    .score-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--surface); }
    .score-btn.active-up { background: #E1F5FE; border-color: #0288D1; color: #01579B; }
    .score-btn.active-down { background: #FFEBEE; border-color: #C62828; color: #B71C1C; }

    /* Bottom Issue Navigation */
    .issue-nav-bar {
      margin-top: 48px;
      padding-top: 28px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    .prev-issue-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      transition: all 0.15s ease;
      font-weight: 500;
    }
    .prev-issue-btn:hover {
      background: var(--surface-hover);
      border-color: var(--accent);
      color: var(--accent);
      transform: translateX(-2px);
    }

    /* Archive Items */
    #archive-list { display: flex; flex-direction: column; gap: 0px; }
    .archive-item {
      padding: 24px 0; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; cursor: pointer;
    }
    .archive-item:hover .archive-title { color: var(--accent); }
    .archive-main { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 0; }
    .archive-title { font-weight: 500; font-size: 17px; line-height: 1.4; transition: color 0.15s; }
    .archive-details { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-family: 'JetBrains Mono', monospace; font-size: 12px; }
    .archive-subject-tag { font-weight: 500; padding: 3px 9px; border-radius: 4px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
    .archive-right { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted); white-space: nowrap; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; padding-top: 2px; }

    /* Distinct Subject Tag Colors */
    .tag-product-dives { background: rgba(217, 119, 87, 0.12); color: var(--sub-product-dives); border: 1px solid rgba(217, 119, 87, 0.25); }
    .tag-manufacturing { background: rgba(37, 99, 235, 0.12); color: var(--sub-manufacturing); border: 1px solid rgba(37, 99, 235, 0.25); }
    .tag-design { background: rgba(124, 58, 237, 0.12); color: var(--sub-design); border: 1px solid rgba(124, 58, 237, 0.25); }
    .tag-materials { background: rgba(5, 150, 105, 0.12); color: var(--sub-materials); border: 1px solid rgba(5, 150, 105, 0.25); }
    .tag-mechanisms { background: rgba(217, 119, 6, 0.12); color: var(--sub-mechanisms); border: 1px solid rgba(217, 119, 6, 0.25); }
    .tag-thermal { background: rgba(225, 29, 72, 0.12); color: var(--sub-thermal); border: 1px solid rgba(225, 29, 72, 0.25); }
    .tag-fluids { background: rgba(8, 145, 178, 0.12); color: var(--sub-fluids); border: 1px solid rgba(8, 145, 178, 0.25); }
    .tag-electromechanical { background: rgba(79, 70, 229, 0.12); color: var(--sub-electromechanical); border: 1px solid rgba(79, 70, 229, 0.25); }

    .hidden { display: none !important; }

    /* ==========================================================================
       RESPONSIVE MOBILE VIEWING OPTIMIZATIONS (<1024px & <640px)
       ========================================================================== */
    @media (max-width: 1023px) {
      .content-grid {

          <ul>
            <li><strong>Catadioptric Pancake MTF Collapse:</strong> Folded <span class="tangent-term" data-tangent="pancake_optics">pancake optics</span> achieve extraordinary flatness and compactness by polarizing, reflecting, and semi-transmitting light multiple times between spherical glass surfaces. However, this catadioptric beam path creates an ultra-tight "optical eyebox" measuring only 4.0 mm in diameter. Translating the human pupil just 1.5 mm off the primary <span class="tangent-term" data-tangent="ipd_alignment">interpupillary optical axis</span> causes the <span class="tangent-term" data-tangent="mtf">Modulation Transfer Function (MTF)</span> to drop by over 45%, introducing severe astigmatic blur, chromatic fringing, and geometric coma aberrations.</li>
            <li><strong>Vergence-Accommodation Conflict & Vestibular Mismatch:</strong> In the natural physical world, visual accommodation (the focal power of the crystalline lens inside the eyeball) and visual vergence (the inward or outward rotation of both eyeballs to triangulate a target) are mechanically coupled in the brainstem. In spatial headsets, the micro-OLED virtual image plane is held at a fixed optical focal distance of approximately 1.3 meters. If physical display centers fail to match the user's interpupillary vector, the user's brain is forced to artificially diverge or converge its optical axes against the physical focal cues, causing <span class="tangent-term" data-tangent="vergence_accommodation">Vergence-Accommodation Conflict</span> that rapidly induces nausea, visual fatigue, and debilitating vestibular disorientation.</li>
          </ul>
          <p>
            To eliminate this entire error class, Apple eliminated manual mechanical dials, ratchets, and sliders entirely. Instead, Vision Pro incorporates a fully automated, closed-loop electromechanical drivetrain that detects eye positions and translates the dual lens pods into optical alignment within ±0.05 mm during initial calibration.
          </p>

          <h2 id="section-actuator-selection">2. Actuator Selection: Voice Coil Motors vs. Stepper Lead Screws</h2>
          <p>
            When engineering an automated optical positioning mechanism inside a wearable headset, the mechanical design constraints are extraordinarily punishing:
          </p>
          <ul>
            <li><strong>Spatial Volumetric Packaging:</strong> The mechanism must fit inside a tightly contoured, organic 3D magnesium chassis curved to match human facial anthropology, leaving zero clearance for bulky motor housings.</li>
            <li><strong>Acoustic and Bone-Conduction Silence:</strong> The headset sits directly against the facial bones of the zygomatic arch and temples. Any mechanical gear whine, tooth backlash, or stepper resonance will conduct directly through the user's cranium, sounding like a dentist's drill.</li>
            <li><strong>Mass and Center of Gravity (CoG):</strong> The complete headset already approaches 600 to 650 grams. Moving mass must be kept under 30 grams per optical pod to avoid shifting the headset's forward center of gravity and worsening neck strain.</li>
          </ul>
          <p>
            Miniature stepper motors paired with lead screws—the standard industrial approach in camera zoom stages—were systematically evaluated and rejected. Lead screw nuts suffer from mechanical backlash, require periodic lubrication that can outgas and fog sealed optical surfaces, generate high-frequency micro-stepping acoustic chatter, and exhibit slow settling times.
          </p>
          <p>
            Instead, Apple engineered custom miniature dual-gap <span class="tangent-term" data-tangent="lorentz_vcm">voice coil motors (VCMs)</span> mounted directly to the optical carriages and suspended on planar beryllium-copper <span class="tangent-term" data-tangent="flexure_suspension">flexure spring suspensions</span>.
          </p>
          <p>
            Unlike rotary motors that convert rotary torque to linear motion via friction-laden mechanical interfaces, a voice coil motor generates direct linear force via the <span class="tangent-term" data-tangent="lorentz_force">Lorentz force</span> interaction between a stationary NdFeB permanent magnet array and an energized copper voice coil. By regulating current through a high-frequency PWM H-bridge driver, the VCM produces completely smooth, frictionless linear translation. It operates in absolute acoustic silence, exhibits zero mechanical backlash, and achieves full-stroke position settling in under 120 milliseconds.
          </p>

          <h2 id="section-optical-encoders">3. Closed-Loop Metrology: Sub-Micron Optical Linear Encoders</h2>
          <p>
            Voice coil motors possess zero holding detent torque: the moment current is removed from the coil, the carriage is free to drift under gravity or head acceleration. Consequently, the mechanism requires an ultra-precise, real-time closed-loop positional feedback system.
          </p>
          <p>
            Traditional rotary encoders were unusable because there is no rotating shaft. Hall-effect magnetic linear sensors were evaluated, but the intense magnetic fields generated by the headset's integrated spatial audio speakers, magnetic head-strap connectors, and external power cords introduced unacceptable sensor noise and offset drift.
          </p>
          <p>
            Apple solved this by developing custom reflective <span class="tangent-term" data-tangent="linear_encoder">optical linear encoders</span> integrated directly along the structural magnesium guide rail:
          </p>
          <ul>
            <li><strong>Photolithographic Chrome-on-Glass Scale:</strong> A precision glass encoder scale etched with reflective chrome lines at a 20-micron pitch runs parallel to the transverse carriage guide shaft.</li>
            <li><strong>Differential Quadrature Laser Metrology:</strong> An infrared VCSEL laser diode illuminates the moving scale, reflecting optical diffraction fringes onto an application-specific integrated circuit (ASIC) photodiode array. The sensor outputs two 90°-phase-shifted sinusoidal signals (<span class="tangent-term" data-tangent="quadrature_encoder">quadrature sine waves</span> on Channel A and Channel B).</li>
            <li><strong>256x Digital Sub-Division:</strong> The dedicated encoder ASIC digitizes and interpolates the analog quadrature sine waves down to 1/256th of a pitch period. This mathematical interpolation resolves linear displacement down to an astonishing <strong>0.078 microns (78 nanometers)</strong>.</li>
            <li><strong>Non-Volatile Hardware Position Locking:</strong> Once the optimal IPD is reached, the controller cuts high holding currents to preserve battery life, relying on a bi-stable micro-solenoid friction brake to lock the carriage rigidly in place. The encoder writes the physical coordinates to non-volatile flash memory, enabling instant, homing-free readiness the next time the device is powered on.</li>
          </ul>

          <h2 id="section-gaze-calibration">4. Eye-Tracking Sensor Fusion & Gaze Calibration Vectors</h2>
          <p>
            A high-precision motorized stage is useless without an equally precise sensing system to dictate its target coordinates. In Apple Vision Pro, the automated IPD calibration process is completely invisible to the user, occurring dynamically during the initial device onboarding sequence.
          </p>
          <p>
            Surrounding each pancake lens barrel is an annular ring of infrared <span class="tangent-term" data-tangent="vcsel">VCSEL</span> lasers operating across both 850 nm and 940 nm wavelengths. These illuminators project an invisible structured array of glint reflections onto the user's curved cornea. High-speed infrared cameras positioned at the base of the lens barrels capture the corneal reflections and pupil boundary at 90 frames per second.
          </p>
          <p>
            Apple's computer vision pipeline runs these video streams through custom convolutional neural networks running locally on the R1 real-time coprocessor. By measuring the dynamic spatial vector between the pupil center and the multiple corneal glints across varying gaze angles, the R1 calculates the true 3D center of rotation of the eyeball in Cartesian coordinate space. It separates the optical visual axis (the line connecting the fovea to the pupil center) from the anatomical pupillary axis, computing the exact mathematical interpupillary separation. The system then commands the left and right VCM drivers independently, translating each optical pod until its optical axis aligns with the user's eyes within ±0.05 mm.
          </p>

          <h2 id="section-thermal-packaging">5. Structural Packaging, DFM, and Thermal Dissipation</h2>
          <p>
            Packing two motorized optical translation carriages, four display micro-OLED panels, eye-tracking optics, and logic boards into a sealed, curved facial enclosure represents a masterclass in electromechanical design for manufacturing (DFM):
          </p>
          <ul>
            <li><strong>Thixomolded Magnesium-Aluminum Skeleton:</strong> The internal structural chassis is <span class="tangent-term" data-tangent="thixomolding">thixomolded from AZ91D magnesium alloy</span>. Thixomolding produces thin-wall (0.6 mm) structural ribbing with high dimensional stability and superior damping characteristics, keeping the moving carriage weight under 26 grams per eye pod.</li>
            <li><strong>Dynamic High-Flex FPC Ribbon Cables:</strong> Connecting the continuously moving optical pod (which carries the 4K micro-OLED panels, display drivers, and eye-tracking cameras) to the stationary main logic board requires <span class="tangent-term" data-tangent="fpc_ribbon">dynamic high-flex FPC ribbon cables</span>. Apple designed custom multi-layer rolled annealed copper ribbons routed through a controlled teardrop bend radius, certified for over 150,000 continuous translation cycles without copper trace fatigue failure.</li>
            <li><strong>Thermal Shunt Chimneys:</strong> The two micro-OLED display panels dissipate approximately 6W to 8W of electrical power at peak luminance. Because heat cannot be dumped directly into the user's face, flexible annealed copper foil shunts conduct thermal energy from the rear of the moving displays into a central structural chimney, where an ultra-quiet radial micro-blower gently exhausts warm air through top-facing chassis vents.</li>
            <li><strong>Lost-Motion Mechanical Shock Decouplers:</strong> If a user grabs the lens pods with their fingers while cleaning the optics or during a severe drop impact, rigid gear connections would strip or bend flexure springs. Apple engineered internal <span class="tangent-term" data-tangent="lost_motion_clutch">lost-motion mechanical shock decouplers</span> into the carriage mount that safely slip under external shock loads exceeding 12 N, re-engaging seamlessly once external force is removed.</li>
          </ul>

          <div class="telemetry-bar">
            <div class="telemetry-info">
              <span class="telemetry-title">Background Quality Telemetry</span>
              <span class="telemetry-desc">Rate this topic to train the automated curation model for future dispatches.</span>
            </div>
            <div class="telemetry-actions">
              <button class="score-btn" id="telemetry-up" onclick="recordTelemetry('up')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path></svg>
                Good Topic
              </button>
              <button class="score-btn" id="telemetry-down" onclick="recordTelemetry('down')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h3a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-3"></path></svg>
                Poor Topic
              </button>
            </div>
          </div>

          <!-- Bottom Navigation: View Next Issue -->
          <div class="issue-nav-bar">
            <button class="prev-issue-btn" onclick="loadArticle('#001')">
              View Next Issue (10/14) →
            </button>
            <span style="font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted);">
              Current Dispatch: Issue #000 &middot; Oct 13, 2026
            </span>
          </div>
      `
    };

    let activeArticleId = "#001";
    let activeSubject = "All";

    // Floating Popover State & Controller
    let currentHoveredTerm = null;
    let isPinned = false;
    let hideTimeout = null;

    function showPopover(termElement, key) {
      const data = TANGENTS[key];
      if (!data) return;
      
      if (hideTimeout) {
        clearTimeout(hideTimeout);
        hideTimeout = null;
      }
      
      currentHoveredTerm = termElement;
      termElement.classList.add('active-hover');

      const popover = document.getElementById('floating-popover');
      document.getElementById('popover-tag').textContent = data.tag;
      document.getElementById('popover-title').textContent = data.title;
      document.getElementById('popover-body').innerHTML = data.body;
      
      const isMobile = window.innerWidth <= 640;

      if (!isMobile) {
        popover.style.display = 'block';
        popover.style.visibility = 'hidden';
        
        const termRect = termElement.getBoundingClientRect();
        const popoverWidth = Math.min(380, window.innerWidth - 32);
        popover.style.width = `${popoverWidth}px`;
        
        const popoverHeight = popover.offsetHeight || 220;
        
        let left = termRect.left + (termRect.width / 2) - (popoverWidth / 2);
        left = Math.max(16, Math.min(left, window.innerWidth - popoverWidth - 16));
        
        let top = termRect.top - popoverHeight - 12;
        let arrowClass = 'arrow-bottom';
        
        if (top < 16) {
          top = termRect.bottom + 12;
          arrowClass = 'arrow-top';
        }
        
        popover.classList.remove('arrow-top', 'arrow-bottom');
        popover.classList.add(arrowClass);
        
        const arrow = document.getElementById('popover-arrow');
        const arrowX = Math.max(16, Math.min(termRect.left + (termRect.width / 2) - left - 6, popoverWidth - 24));
        arrow.style.left = `${arrowX}px`;
        
        popover.style.top = `${top}px`;
        popover.style.left = `${left}px`;
        popover.style.visibility = 'visible';
      }

      popover.classList.add('active');
    }

    function hidePopover(immediate = false) {
      if (isPinned) return;
      const popover = document.getElementById('floating-popover');
      if (currentHoveredTerm) currentHoveredTerm.classList.remove('active-hover');
      
      if (immediate) {
        popover.classList.remove('active');
        currentHoveredTerm = null;
      } else {
        hideTimeout = setTimeout(() => {
          popover.classList.remove('active');
          currentHoveredTerm = null;
        }, 140);
      }
    }

    function pinPopover(termElement, key) {
      showPopover(termElement, key);
      const popover = document.getElementById('floating-popover');
      isPinned = true;
      popover.classList.add('pinned');
      document.getElementById('popover-footer-text').textContent = 'Pinned · Click outside or ✕ to close';
    }

    function unpinPopover() {
      isPinned = false;
      const popover = document.getElementById('floating-popover');
      popover.classList.remove('pinned', 'active');
      if (currentHoveredTerm) currentHoveredTerm.classList.remove('active-hover');
      currentHoveredTerm = null;
      document.getElementById('popover-footer-text').textContent = 'Click or tap to pin';
    }

    // Delegated hover & click listeners for .tangent-term
    document.addEventListener('mouseover', (e) => {
      if (window.innerWidth <= 640) return;
      const term = e.target.closest('.tangent-term');
      if (term) {
        const key = term.getAttribute('data-tangent');
        if (key && !isPinned) {
          showPopover(term, key);
        }
      }
    });

    document.addEventListener('mouseout', (e) => {
      if (window.innerWidth <= 640) return;
      const term = e.target.closest('.tangent-term');
      if (term && !isPinned) {
        hidePopover(false);
      }
    });

    const popoverEl = document.getElementById('floating-popover');
    popoverEl.addEventListener('mouseenter', () => {
      if (hideTimeout) {
        clearTimeout(hideTimeout);
        hideTimeout = null;
      }
    });
    popoverEl.addEventListener('mouseleave', () => {
      if (!isPinned && window.innerWidth > 640) hidePopover(false);
    });

    document.addEventListener('click', (e) => {
      const term = e.target.closest('.tangent-term');
      if (term) {
        e.preventDefault();
        e.stopPropagation();
        const key = term.getAttribute('data-tangent');
        if (key) {
          if (isPinned && currentHoveredTerm === term) {
            unpinPopover();
          } else {
            pinPopover(term, key);
          }
        }
        return;
      }

      if (!e.target.closest('#floating-popover')) {
        unpinPopover();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') unpinPopover();
    });

    // Dynamic Read Time Calculation (~220 WPM)
    function calculateReadTime() {
      const articleEl = document.getElementById("view-article");
      if (!articleEl) return;
      const text = articleEl.innerText || articleEl.textContent || "";
      const words = text.match(/\S+/g) || [];
      const wordCount = words.length;
      const readMinutes = Math.max(1, Math.round(wordCount / 220));
      const badge = document.getElementById("read-time-badge");
      if (badge) badge.textContent = `${readMinutes} MIN READ`;
    }

    function loadArticle(id) {
      if (!ARTICLES[id]) id = "#001";
      activeArticleId = id;
      unpinPopover();
      
      const articleEl = document.getElementById("view-article");
      articleEl.innerHTML = ARTICLES[id];

      showView("article");
      calculateReadTime();
      buildOutline();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function getTagClass(sub) {
      switch(sub) {
        case "Product Dives": return "tag-product-dives";
        case "Manufacturing": return "tag-manufacturing";
        case "Design": return "tag-design";
        case "Materials": return "tag-materials";
        case "Mechanisms": return "tag-mechanisms";
        case "Thermal": return "tag-thermal";
        case "Fluids": return "tag-fluids";
        case "Electromechanical": return "tag-electromechanical";
        default: return "";
      }
    }

    function getBtnClass(sub) {
      switch(sub) {
        case "All": return "btn-sub-all";
        case "Product Dives": return "btn-sub-product-dives";
        case "Manufacturing": return "btn-sub-manufacturing";
        case "Design": return "btn-sub-design";
        case "Materials": return "btn-sub-materials";
        case "Mechanisms": return "btn-sub-mechanisms";
        case "Thermal": return "btn-sub-thermal";
        case "Fluids": return "btn-sub-fluids";
        case "Electromechanical": return "btn-sub-electromechanical";
        default: return "";
      }
    }

    function renderSubjects() {
      const bar = document.getElementById("subjects-bar");
      bar.innerHTML = SUBJECTS.map(sub => `
        <button class="subject-pill ${getBtnClass(sub)} ${sub === activeSubject ? 'active' : ''}" onclick="filterSubject('${sub}')">
          ${sub}
        </button>
      `).join("");
    }

    function renderArchive() {
      const list = document.getElementById("archive-list");
      const published = TOPICS.filter(t => t.status === "Published");
      const filtered = activeSubject === "All" ? published : published.filter(t => t.subject === activeSubject);
      
      if(filtered.length === 0) {
        list.innerHTML = `<div style="padding:48px 0; color:var(--muted); font-family:'JetBrains Mono',monospace; font-size:13px;">No published dispatches under this subject yet.</div>`;
        return;
      }

      list.innerHTML = filtered.map(item => `
        <div class="archive-item" onclick="loadArticle('${item.id}')">
          <div class="archive-main">
            <div class="archive-title">${item.title}</div>
            <div class="archive-details">
              <span class="archive-subject-tag ${getTagClass(item.subject)}">${item.subject}</span>
            </div>
          </div>
          <div class="archive-right">
            <span style="font-weight:600; color:var(--text);">${item.id}</span>
            <span>${item.date}</span>
          </div>
        </div>
      `).join("");
    }

    function filterSubject(sub) {
      activeSubject = sub;
      renderSubjects();
      renderArchive();
    }

    function showView(view) {
      document.getElementById("view-article").classList.toggle("hidden", view !== "article");
      document.getElementById("view-archive").classList.toggle("hidden", view !== "archive");
      document.getElementById("btn-archive").classList.toggle("active", view === "archive");
      
      const grid = document.getElementById("content-grid");
      const outline = document.getElementById("sidebar-outline");
      const mainContainer = document.getElementById("main-container");

      if(view === "article") {
        outline.style.display = "block";
        grid.style.gridTemplateColumns = "240px 1fr";
        mainContainer.className = "editorial-column";
        buildOutline();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        outline.style.display = "none";
        grid.style.gridTemplateColumns = "1fr";
        mainContainer.className = "archive-column";
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function showPreviousIssueNotification() {
      showView('archive');
    }

    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.getAttribute("data-theme") === "dark";
      html.setAttribute("data-theme", isDark ? "light" : "dark");
      document.getElementById("moon-icon").style.display = isDark ? "block" : "none";
      document.getElementById("sun-icon").style.display = isDark ? "none" : "block";
    }

    function recordTelemetry(direction) {
      const btnUp = document.getElementById("telemetry-up");
      const btnDown = document.getElementById("telemetry-down");
      btnUp.classList.remove("active-up");
      btnDown.classList.remove("active-down");
      if(direction === 'up') {
        btnUp.classList.add("active-up");
        console.log("[Telemetry] Recorded positive reinforcement for hardware teardown depth.");
      } else {
        btnDown.classList.add("active-down");
        console.log("[Telemetry] Recorded negative reinforcement. Re-weighting curation parameters.");
      }
    }

    function buildOutline() {
      const outlineList = document.getElementById("outline-list");
      const headings = document.querySelectorAll("#view-article h2, #view-article h3");
      let html = "";
      headings.forEach((h, index) => {
        if(!h.id) h.id = "heading-" + index;
        const isSub = h.tagName === "H3";
        // Clone heading to cleanly remove price tag elements before generating sidebar text
        const clone = h.cloneNode(true);
        clone.querySelectorAll(".price-tag").forEach(tag => tag.remove());
        const cleanTitle = clone.textContent.trim();
        html += `<li class="outline-item ${isSub ? 'sub-item' : ''}"><a href="#${h.id}" data-target="${h.id}">${cleanTitle}</a></li>`;
      });
      outlineList.innerHTML = html;

      // Scroll-spy observer with dedicated top margin tracking
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            document.querySelectorAll(".outline-list a").forEach(a => a.classList.remove("active"));
            const activeLink = document.querySelector(`.outline-list a[data-target="${entry.target.id}"]`);
            if (activeLink) activeLink.classList.add("active");
          }
        });
      }, { rootMargin: "-15% 0px -70% 0px" });

      headings.forEach(h => observer.observe(h));
    }

    renderSubjects();
    renderArchive();
    loadArticle("#001");
  </script>
</body>
</html>
