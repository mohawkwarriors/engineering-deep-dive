<!DOCTYPE html>
<html lang="en">
<head>

  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #F9F8F6;
      --surface: #EFECE6;
      --surface-hover: #E4E0D8;
      --text: #191918;
      --muted: #6B6960;
      --border: #D8D4CC;
      --accent: #D97757;
      --max-w: 1080px;
      --sub-thermal: #E11D48;
    }
    [data-theme="dark"] {
      --bg: #191918;
      --surface: #232220;
      --surface-hover: #2E2D2A;
      --text: #EDEDEB;
      --muted: #9E9C94;
      --border: #383734;
      --accent: #D97757;
      --sub-thermal: #F43F5E;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.74;
      font-size: 16.5px;
      -webkit-font-smoothing: antialiased;
    }
    .layout-wrapper {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 0 24px 104px;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 28px 0; border-bottom: 1px solid var(--border); margin-bottom: 44px;
    }
    .brand-group { display: flex; align-items: center; gap: 12px; text-decoration: none; cursor: pointer; }
    .brand-logo {
      width: 34px; height: 34px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 6px; display: flex; align-items: center; justify-content: center;
      color: var(--accent); font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 600;
    }
    .brand {
      font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500;
      letter-spacing: 0.06em; text-transform: uppercase; color: var(--text);
    }
    .nav-actions { display: flex; gap: 16px; align-items: center; }
    .nav-btn {
      background: none; border: none; font-family: 'JetBrains Mono', monospace;
      font-size: 12px; color: var(--muted); cursor: pointer; padding: 4px 0;
    }
    .nav-btn:hover, .nav-btn.active { color: var(--text); font-weight: 600; }
    .theme-toggle-btn {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      width: 34px; height: 34px; border-radius: 6px; display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .reading-progress-bar {
      position: fixed; top: 0; left: 0; height: 3px; width: 0%;
      background: var(--accent); z-index: 3000; transition: width 0.08s ease-out;
    }
    .content-grid {
      display: grid; grid-template-columns: 240px 1fr; gap: 56px;
      align-items: flex-start;
    }
    .sidebar-outline {
      position: sticky; top: 28px; max-height: calc(100vh - 56px);
      overflow-y: auto; padding-right: 16px; border-right: 1px solid var(--border);
    }
    .outline-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .outline-item a {
      font-size: 13.5px; color: var(--muted); text-decoration: none;
      display: block; line-height: 1.45; border-left: 2px solid transparent; padding-left: 10px;
    }
    .outline-item a:hover { color: var(--text); }
    .outline-item a.active { color: var(--accent); border-left-color: var(--accent); font-weight: 500; }
    .editorial-column { max-width: 740px; width: 100%; min-width: 0; }
    .meta-line {
      font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--accent);
      text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px;
      display: flex; gap: 12px; align-items: center;
    }
    h1 {
      font-family: 'Instrument Serif', Georgia, serif; font-size: 46px;
      font-weight: 400; line-height: 1.12; letter-spacing: -0.01em; margin-bottom: 20px;
    }
    .subtitle {
      font-size: 18.5px; color: var(--muted); line-height: 1.55; margin-bottom: 36px;
    }
    h2 {
      font-family: 'Instrument Serif', Georgia, serif; font-size: 34px; font-weight: 600;
      margin: 52px 0 18px; scroll-margin-top: 40px;
    }
    p { margin-bottom: 20px; }
    code {
      font-family: 'JetBrains Mono', monospace; font-size: 13.5px;
      background: var(--surface); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border);
    }

    /* TechnicalCard Component */
    .technical-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      padding: 22px; margin: 32px 0;
    }
    .tech-card-header {
      margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border);
    }
    .tech-card-title {
      font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent);
    }
    .tech-card-subtitle {
      font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); margin-top: 3px;
    }
    .tech-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .tech-sub-box {
      background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
      padding: 12px 14px; font-size: 12.5px; font-family: 'JetBrains Mono', monospace;
    }
    .tech-box-tag {
      font-size: 10.5px; font-weight: 600; text-transform: uppercase; color: var(--accent); margin-bottom: 4px;
    }
    .tech-box-val { color: var(--text); font-weight: 500; }
    .tech-box-muted { color: var(--muted); font-size: 11px; margin-top: 2px; }
    .tech-card-bottleneck {
      background: rgba(225, 29, 72, 0.08); border: 1px solid rgba(225, 29, 72, 0.25);
      border-radius: 6px; padding: 12px 14px; margin-top: 14px; font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px; line-height: 1.5;
    }
    .tech-bottleneck-title {
      font-weight: 600; color: var(--sub-thermal); text-transform: uppercase; margin-bottom: 2px;
    }

    /* ProcessFlow Component */
    .process-flow { display: flex; flex-direction: column; gap: 14px; margin: 32px 0; }
    .process-step {
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      padding: 16px 18px;
    }
    .process-step-header {
      display: flex; justify-content: space-between; align-items: baseline;
      flex-wrap: wrap; gap: 8px; margin-bottom: 8px;
    }
    .process-step-title {
      font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600;
      display: flex; gap: 8px; align-items: center;
    }
    .process-step-num {
      background: var(--accent); color: #FFF; font-size: 10px; padding: 2px 6px; border-radius: 4px;
    }
    .process-step-params {
      font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted);
    }
    .process-step-body { font-size: 14px; line-height: 1.6; margin: 0; }

    /* Interactive Tangent Triggers & Popover */
    .tangent-term {
      border-bottom: 1.5px dotted var(--accent); cursor: pointer; font-weight: 500;
      padding: 1px 3px; border-radius: 3px;
    }
    .tangent-term:hover { background: var(--surface); color: var(--accent); }
    .floating-popover {
      position: fixed; z-index: 2000; max-width: 380px; width: calc(100vw - 32px);
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      box-shadow: 0 16px 36px rgba(0,0,0,0.18); padding: 16px 20px;
      opacity: 0; pointer-events: none; transition: opacity 0.18s ease;
    }
    .floating-popover.active { opacity: 1; pointer-events: auto; }
    .popover-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border);
    }
    .popover-tag {
      font-family: 'JetBrains Mono', monospace; font-size: 10px; text-transform: uppercase;
      color: var(--accent); font-weight: 600;
    }
    .popover-close-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 16px; }
    .popover-title {
      font-family: 'Instrument Serif', Georgia, serif; font-size: 20px; margin-bottom: 8px;
    }
    .popover-body { font-size: 13.5px; line-height: 1.55; }
    .modal-equation-box {
      background: var(--surface); border: 1px solid var(--border); border-radius: 5px;
      padding: 8px 12px; margin: 10px 0; font-family: 'JetBrains Mono', monospace; font-size: 11.5px;
    }

    /* Telemetry & Navigation */
    .telemetry-bar {
      display: flex; justify-content: space-between; align-items: center; background: var(--surface);
      border: 1px solid var(--border); padding: 16px 20px; border-radius: 6px; margin: 48px 0 24px;
      font-size: 13.5px; flex-wrap: wrap; gap: 12px;
    }
    .score-btn {
      background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 6px 14px;
      border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: 12px; cursor: pointer;
    }
    .score-btn:hover { border-color: var(--accent); color: var(--accent); }
    .issue-nav-bar {
      margin-top: 48px; padding-top: 28px; border-top: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;
    }
    .issue-nav-btn {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      font-family: 'JetBrains Mono', monospace; font-size: 12.5px; padding: 9px 16px;
      border-radius: 6px; cursor: pointer; text-decoration: none;
    }
    .hidden { display: none !important; }

    @media (max-width: 1023px) {
      .content-grid { grid-template-columns: 1fr !important; }
      .sidebar-outline { display: none !important; }
    }
    @media (max-width: 640px) {
      .layout-wrapper { padding: 0 16px 64px; }
      h1 { font-size: 28px; line-height: 1.18; }
      .tech-grid-2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="reading-progress-bar" id="reading-progress-bar"></div>

  <div class="layout-wrapper">
    <header>
      <a class="brand-group" onclick="loadArticle('#002')">
        <div class="brand-logo">⌀</div>
        <span class="brand">Engineering Deep Dive</span>
      </a>
      <div class="nav-actions">
        <button class="nav-btn" id="btn-archive" onclick="showView('archive')">Archive</button>
        <button class="theme-toggle-btn" onclick="toggleTheme()" id="theme-btn" title="Toggle Theme">
          <svg id="moon-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          <svg id="sun-icon" width="16" height="16" style="display:none;" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="5"></circle></svg>
        </button>
      </div>
    </header>

    <div class="content-grid" id="content-grid">
      <aside class="sidebar-outline">
        <ul class="outline-list" id="outline-list"></ul>
      </aside>

      <main class="editorial-column" id="main-container">
        <article id="view-article"></article>
        
        <section id="view-archive" class="hidden">
          <h1>Archive</h1>
          <p class="subtitle" style="margin-bottom: 28px;">Explore published dispatches across all core engineering disciplines.</p>
          <div id="archive-list"></div>
        </section>
      </main>
    </div>
  </div>

  <div id="floating-popover" class="floating-popover" role="tooltip">
    <div class="popover-header">
      <span class="popover-tag" id="popover-tag">ENGINEERING CONCEPT</span>
      <button class="popover-close-btn" onclick="hidePopover(true)">✕</button>
    </div>
    <h4 class="popover-title" id="popover-title">Concept</h4>
    <div class="popover-body" id="popover-body"></div>
  </div>

  <script>
    const TOPICS = [
      { id: "#002", subject: "Thermal", title: "Capillary Fluid Boundary Dynamics & Thermoblock Cavitation", date: "Oct 14, 2026" },
      { id: "#001", subject: "Product Dives", title: "Apple Home Hardware: HomeView Hub & The LG/Schneider Teardown", date: "Oct 14, 2026" },
      { id: "#000", subject: "Electromechanical", title: "Apple Vision Pro: Automatic Lens Adjustment & Voice Coil Motors", date: "Oct 13, 2026" }
    ];

    const TANGENTS = {
      "laminar_sublayer": {
        tag: "FLUIDS & HEAT TRANSFER // BOUNDARY LAYER",
        title: "Laminar Boundary Sublayer",
        body: `
          <p>Thin fluid film adjacent to the conduit surface where viscous forces dominate and convective mixing is suppressed, creating a steep conductive thermal bottleneck.</p>
          <div class="modal-equation-box">
            Equation: &delta;<sub>t</sub> &asymp; &delta; / (Pr<sup>1/3</sup>)<br>
            Where: Pr = &nu; / &alpha; (Kinematic Viscosity / Thermal Diffusivity)
          </div>
          <p>Because fluid velocity approaches zero at the capillary wall under the no-slip condition, sensible heat ingress into the rapid core is restricted strictly to conduction.</p>
        `
      }
    };

    const articleCache = {
      "#002": {
        id: "#002",
        subject: "Thermal",
        title: "Capillary Fluid Boundary Dynamics & Thermoblock Cavitation",
        date: "Oct 14, 2026",
        article_html: `
          <div class="meta-line">
            <span>ISSUE #002</span><span>•</span><span>THERMAL</span><span>•</span><span>12 MIN READ</span>
          </div>

          <h1>Capillary Fluid Boundary Dynamics & Thermoblock Cavitation</h1>
          <p class="subtitle">
            Why micro-bore heat exchangers choke under pulsed hydraulic delivery despite ample continuous thermal reservoir capacity.
          </p>

          <h2 id="section-1">1. Executive Hardware Teardown</h2>
          <p>
            In high-pressure continuous-flow thermoblocks, heat transfer efficiency is governed by the boundary layer laminar sublayer rather than raw heater wattage. When cold fluid is delivered at high pressures across tight capillary conduits, stagnant fluid coats the conduit walls while core fluid streams through unheated.
          </p>

          <div class="technical-card">
            <div class="tech-card-header">
              <div class="tech-card-title">Die-Cast A380 Aluminum Block</div>
              <div class="tech-card-subtitle">Microscopic Cross-Section of 2.4 mm Water Conduit</div>
            </div>

            <div class="tech-grid-2">
              <div class="tech-sub-box">
                <div class="tech-box-tag">Die-Cast A380 Block</div>
                <div class="tech-box-val">Mass: 550g • k = 96 W/(m·K)</div>
                <div class="tech-box-muted">Heat Capacity: C_th = 510 J/°C</div>
              </div>
              <div class="tech-sub-box">
                <div class="tech-box-tag">Calrod Heating Element</div>
                <div class="tech-box-val">1,350W Resistive Incoloy</div>
                <div class="tech-box-muted">Inlet: 18°C Cold Water (9 Bar)</div>
              </div>
            </div>

            <div class="tech-sub-box">
              <div style="display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px;">
                <span style="color:var(--muted);">Embedded AISI 304 Capillary:</span>
                <span class="tech-box-val">OD 4.0mm / ID 2.4mm</span>
              </div>
              <div class="tech-box-muted" style="margin-top:6px;">
                Tube Wall Temp: ~98°C • Core Velocity: v_max = 0.88 m/s • Outlet Target: 89°C - 93°C
              </div>
            </div>

            <div class="tech-card-bottleneck">
              <div class="tech-bottleneck-title">Thermodynamic Bottleneck</div>
              <div>Without turbulators, laminar conduction resistance causes 4°C exit delta across core flow.</div>
            </div>
          </div>

          <h2 id="section-2">2. Hydrodynamic Boundary Layer Dynamics</h2>
          <p>
            Fluid passing through the capillary conduit develops a parabolic velocity profile governed by the Navier-Stokes momentum equations. Because fluid velocity at the tube wall approaches zero (no-slip condition), heat transfer from the 98°C AISI 304 wall into the core fluid is constrained by molecular thermal conduction across the stagnant viscous boundary layer.
          </p>
          <p>
            When un-tripped, the <span class="tangent-term" data-tangent="laminar_sublayer">Laminar Boundary Sublayer</span> suppresses turbulent bulk fluid displacement, creating an unyielding conductive bottleneck regardless of surface area expansion.
          </p>

          <h2 id="section-3">3. Manufacturing & Thermal Bonding Sequence</h2>
          <p>
            To prevent thermal contact resistance (<code>R_th</code>) spikes at the stainless-steel-to-aluminum interface, casting and mechanical swaging follow strict progressive parameters:
          </p>

          <div class="process-flow">
            <div class="process-step">
              <div class="process-step-header">
                <span class="process-step-title"><span class="process-step-num">01</span> Rotary-Draw Capillary Bending</span>
                <span class="process-step-params">AISI 304 • OD 4.0mm / ID 2.4mm</span>
              </div>
              <p class="process-step-body">Annealed stainless steel tube is bent on a CNC rotary-draw mandrel with pressurized internal oil fill to limit cross-sectional ovality under 3.5%.</p>
            </div>
            <div class="process-step">
              <div class="process-step-header">
                <span class="process-step-title"><span class="process-step-num">02</span> Pre-Formed Cavity Pre-Heating</span>
                <span class="process-step-params">280°C pre-soak</span>
              </div>
              <p class="process-step-body">Stainless capillary conduit and high-output tubular calrod elements are seated into hardened H13 tool steel dies to suppress chill-pin formation.</p>
            </div>
            <div class="process-step">
              <div class="process-step-header">
                <span class="process-step-title"><span class="process-step-num">03</span> High-Pressure Squeeze Casting</span>
                <span class="process-step-params">A380 Alloy • 65 MPa dwell</span>
              </div>
              <p class="process-step-body">Semi-solid liquid A380 aluminum alloy is injected under high pressure to metallurgically bed the conduit, eliminating insulating interfacial air micro-voids.</p>
            </div>
            <div class="process-step">
              <div class="process-step-header">
                <span class="process-step-title"><span class="process-step-num">04</span> Hydrostatic Calibration Burst Test</span>
                <span class="process-step-params">18 Bar • 30s dwell</span>
              </div>
              <p class="process-step-body">The finished assembly is pressurized with deionized water to gauge capillary bore retention and confirm zero leakage along the swaged interface.</p>
            </div>
          </div>

          <div class="telemetry-bar">
            <span>Hardware Telemetry: Rate this dispatch to adjust curation parameters.</span>
            <div>
              <button class="score-btn" onclick="this.textContent = 'Recorded ✓'">Helpful Topic</button>
            </div>
          </div>
        `
      }
    };

    let activeArticleId = "#002";

    function showPopover(termEl, key) {
      const data = TANGENTS[key];
      if (!data) return;
      const popover = document.getElementById('floating-popover');
      document.getElementById('popover-tag').textContent = data.tag;
      document.getElementById('popover-title').textContent = data.title;
      document.getElementById('popover-body').innerHTML = data.body;

      const rect = termEl.getBoundingClientRect();
      const top = Math.max(16, rect.top - 230);
      const left = Math.max(16, Math.min(rect.left, window.innerWidth - 396));

      popover.style.top = `${top}px`;
      popover.style.left = `${left}px`;
      popover.classList.add('active');
    }

    function hidePopover() {
      document.getElementById('floating-popover').classList.remove('active');
    }

    document.addEventListener('mouseover', (e) => {
      const term = e.target.closest('.tangent-term');
      if (term) showPopover(term, term.getAttribute('data-tangent'));
    });

    document.addEventListener('mouseout', (e) => {
      if (e.target.closest('.tangent-term')) hidePopover();
    });

    function buildOutline() {
      const outlineList = document.getElementById("outline-list");
      const headings = document.querySelectorAll("#view-article h2");
      outlineList.innerHTML = Array.from(headings).map(h => 
        `<li class="outline-item"><a href="#${h.id}" data-target="${h.id}">${h.textContent.trim()}</a></li>`
      ).join('');
    }

    function renderIssueNav() {
      let nav = document.getElementById("dynamic-issue-nav");
      if (!nav) {
        nav = document.createElement("div");
        nav.id = "dynamic-issue-nav";
        nav.className = "issue-nav-bar";
        document.getElementById("view-article").appendChild(nav);
      }
      nav.innerHTML = `
        <button class="issue-nav-btn" onclick="loadArticle('#001')">← Previous (#001)</button>
        <span style="font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--muted);">Issue #002 · Oct 14, 2026</span>
        <span class="issue-nav-btn" style="opacity:0.4; cursor:default;">Latest Dispatch</span>
      `;
    }

    async function loadArticle(id = "#002") {
      activeArticleId = id;
      const articleEl = document.getElementById("view-article");

      if (articleCache[id]) {
        articleEl.innerHTML = articleCache[id].article_html;
      } else {
        const num = id.replace('#', '');
        try {
          const res = await fetch(`content/issues/${num}.json`);
          const data = await res.json();
          articleEl.innerHTML = data.article_html;
        } catch {
          articleEl.innerHTML = `<p style="padding:40px 0; color:var(--muted);">Could not load content/issues/${num}.json</p>`;
        }
      }

      showView("article");
      buildOutline();
      renderIssueNav();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function showView(view) {
      document.getElementById("view-article").classList.toggle("hidden", view !== "article");
      document.getElementById("view-archive").classList.toggle("hidden", view !== "archive");
      document.getElementById("btn-archive").classList.toggle("active", view === "archive");
      document.querySelector(".sidebar-outline").style.display = view === "article" ? "block" : "none";
      document.getElementById("content-grid").style.gridTemplateColumns = view === "article" ? "240px 1fr" : "1fr";

      if (view === "archive") {
        document.getElementById("archive-list").innerHTML = TOPICS.map(item => `
          <div style="padding:18px 0; border-bottom:1px solid var(--border); cursor:pointer;" onclick="loadArticle('${item.id}')">
            <div style="font-weight:600;">${item.title}</div>
            <div style="font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--muted); margin-top:4px;">
              <span>${item.id}</span> · <span>${item.subject}</span> · <span>${item.date}</span>
            </div>
          </div>
        `).join('');
      }
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", current);
      document.getElementById("moon-icon").style.display = current === "dark" ? "none" : "block";
      document.getElementById("sun-icon").style.display = current === "dark" ? "block" : "none";
    }

    window.addEventListener("scroll", () => {
      const el = document.getElementById("view-article");
      const total = el.getBoundingClientRect().height - window.innerHeight;
      const progress = total <= 0 ? 100 : Math.min(100, Math.max(0, (-el.getBoundingClientRect().top / total) * 100));
      document.getElementById("reading-progress-bar").style.width = progress + "%";
    }, { passive: true });

    loadArticle("#002");
  </script>
</body>
</html>
