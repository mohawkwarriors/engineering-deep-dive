<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Engineering Deep Dive — Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FAF9F5;
      --surface: #F2F0E8;
      --text: #141413;
      --muted: #66655F;
      --border: #E4E2DA;
      --accent: #C84B31;
      --max-w: 740px;
    }
    [data-theme="dark"] {
      --bg: #121211;
      --surface: #1C1C1A;
      --text: #EDEDEC;
      --muted: #9A9992;
      --border: #2A2A27;
      --accent: #E06D53;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.72;
      font-size: 16.5px;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    .container { max-width: var(--max-w); margin: 0 auto; padding: 0 24px 104px; }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 28px 0; border-bottom: 1px solid var(--border); margin-bottom: 36px;
    }
    .brand {
      font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500;
      letter-spacing: 0.06em; text-transform: uppercase; color: var(--text); text-decoration: none; cursor: pointer;
    }
    .nav-actions { display: flex; gap: 20px; align-items: center; }
    .nav-btn {
      background: none; border: none; font-family: 'JetBrains Mono', monospace;
      font-size: 12px; color: var(--muted); cursor: pointer; padding: 4px 0; transition: color 0.15s;
    }
    .nav-btn:hover, .nav-btn.active { color: var(--text); }
    .subjects-bar {
      display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 44px; padding-bottom: 20px; border-bottom: 1px solid var(--border);
    }
    .subject-pill {
      background: transparent; border: 1px solid var(--border); color: var(--muted);
      font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 5px 10px; border-radius: 4px; cursor: pointer; transition: all 0.15s ease;
    }
    .subject-pill:hover, .subject-pill.active { border-color: var(--text); color: var(--text); background: var(--surface); }
    .meta-line {
      font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--accent);
      text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; display: flex; gap: 12px; align-items: center;
    }
    h1 { font-family: 'Instrument Serif', Georgia, serif; font-size: 46px; font-weight: 400; line-height: 1.12; letter-spacing: -0.01em; margin-bottom: 18px; }
    .subtitle { font-size: 18.5px; color: var(--muted); line-height: 1.55; margin-bottom: 36px; font-weight: 400; }
    h2 { font-family: 'Instrument Serif', Georgia, serif; font-size: 32px; font-weight: 400; margin: 52px 0 16px; line-height: 1.2; border-top: 1px solid var(--border); padding-top: 32px; }
    h3 { font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 600; margin: 32px 0 10px; letter-spacing: -0.01em; display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; }
    .price-tag { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--accent); font-weight: 500; background: var(--surface); padding: 3px 8px; border-radius: 4px; border: 1px solid var(--border); }
    p { margin-bottom: 20px; }
    ul { margin: 0 0 24px 22px; }
    li { margin-bottom: 12px; }
    strong { font-weight: 600; }
    .callout-box {
      background: var(--surface);
      border-left: 3px solid var(--accent);
      padding: 18px 22px;
      margin: 28px 0;
      font-size: 15.5px;
      border-radius: 0 6px 6px 0;
    }
    .callout-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent);
      margin-bottom: 6px;
      font-weight: 500;
    }
    figure.product-figure { margin: 38px 0; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; background: var(--surface); }
    .img-wrapper { position: relative; width: 100%; aspect-ratio: 16 / 10; overflow: hidden; background: #141413; }
    .img-wrapper img { width: 100%; height: 100%; object-fit: cover; display: block; }
    figcaption {
      padding: 14px 18px; font-family: 'JetBrains Mono', monospace; font-size: 12px;
      color: var(--muted); border-top: 1px solid var(--border); line-height: 1.5; display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
    }
    .source-tag { white-space: nowrap; font-size: 11px; opacity: 0.85; }
